name: CI

on:
  # Pull requests only: a merge to main is the code its pull request already tested.
  # main's images are built by docker-publish. Run it by hand on any branch with workflow_dispatch.
  pull_request:
    # Changes CI cannot see. Only top-level *.md: Markdown under src/, db/, templates/ and prompts/ is
    # test or app input. ci.yml itself is not listed, so a change to it still runs everything.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub-hosted runners only: this repository is public, so a fork's pull request runs here and must
  # never reach a self-hosted machine. Pinned to 24.04, not ubuntu-latest, so the acceptance job's
  # `playwright install --with-deps` and the sandbox's Landlock needs do not move under a runner upgrade.
  build:
    name: build, lint, typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      - run: dotnet build src/Codex.slnx --configuration Release
      - run: pnpm install --frozen-lockfile
        working-directory: src/Codex.Client
      - run: pnpm run format:check && pnpm run lint && pnpm run typecheck && pnpm test && pnpm run build
        working-directory: src/Codex.Client
      # The core shared with the mobile app (#35): no DOM in its tsconfig, a lint boundary, vitest in plain Node.
      - run: pnpm run format:check && pnpm run lint && pnpm run typecheck && pnpm test
        working-directory: src/Codex.Core.Client
      # The Expo app (#35): checks, vitest for its pure modules (*.test.ts), jest-expo for its screens and primitives
      # (*.spec.tsx), and a Metro bundle so a module the bundler cannot resolve fails here rather than on a device.
      # Device builds go through EAS later.
      - run: pnpm run format:check && pnpm run lint && pnpm run typecheck && pnpm test && pnpm run test:screens && pnpm run bundle
        working-directory: src/Codex.Mobile

  unit:
    name: unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test src/Codex.UnitTest --configuration Release

  api:
    name: API tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The print tests run pandoc and Tectonic through codex-sandbox, at the versions src/Dockerfile.worker pins.
      # Tectonic's bundle cache (~/.cache/Tectonic) is kept between runs so the bundle is fetched once. The install
      # script warms it with every built-in template before any test runs (render jobs read it read-only), and it is
      # saved right after, whether or not the tests pass.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-bundle-0.15.0-${{ hashFiles('templates/**') }}
          restore-keys: tectonic-bundle-0.15.0-
      - run: scripts/install-print-tools.sh "$RUNNER_TEMP/print-tools" ~/.cache/Tectonic && echo "$RUNNER_TEMP/print-tools" >> "$GITHUB_PATH"
      - uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.cache/Tectonic
          key: tectonic-bundle-0.15.0-${{ hashFiles('templates/**') }}
      # CODEX_TEST_DB is unset here, so the tests start a postgres:18 container (Docker is on the runner).
      # Memory: these limits were set for runners that capped a job at 2 GiB; hosted runners have more, so they
      # are conservative here. Each test class starts its own Kestrel host, so the build servers are shut down
      # first, fixtures run 4 at a time (not one per visible core), and the managed heap is capped at 1 GiB.
      # Uncapped, the test host was OOM-killed (wave 3, PR #34).
      # The test host's RSS still grows with every fixture (~1.5 GB by the end of 700 tests), and the Print
      # tests add up to 4 Tectonic processes (~180 MB each) beside it: one run peaked at ~2.1 GB and was
      # OOM-killed (wave 4, PR #38). So Print runs in its own test host: ~1.5 GB and ~1.3 GB peaks.
      # At ~850 non-Print tests the 1 GiB heap ran out at the end of the run (#69 with #67 merged in), so the
      # largest namespaces (References, KnowledgeBase, Structure, Manuscript) get a test host of their own too.
      # Sharing (#80) took the rest to ~780 tests and the 1 GiB heap ran out again, so the access tests
      # (Auth, Sharing) get a test host of their own as well.
      - run: dotnet build src/Codex.WebApi.Tests --configuration Release && dotnet build-server shutdown
      - run: dotnet test src/Codex.WebApi.Tests --configuration Release --no-build --filter "FullyQualifiedName~Codex.WebApi.Tests.References.|FullyQualifiedName~Codex.WebApi.Tests.KnowledgeBase.|FullyQualifiedName~Codex.WebApi.Tests.Structure.|FullyQualifiedName~Codex.WebApi.Tests.Manuscript." -- NUnit.NumberOfTestWorkers=4
        env:
          DOTNET_GCHeapHardLimit: '0x40000000'
          DOTNET_GCConserveMemory: '7'
      - run: dotnet test src/Codex.WebApi.Tests --configuration Release --no-build --filter "FullyQualifiedName~Codex.WebApi.Tests.Auth.|FullyQualifiedName~Codex.WebApi.Tests.Sharing." -- NUnit.NumberOfTestWorkers=4
        if: ${{ !cancelled() }}
        env:
          DOTNET_GCHeapHardLimit: '0x40000000'
          DOTNET_GCConserveMemory: '7'
      - run: dotnet test src/Codex.WebApi.Tests --configuration Release --no-build --filter "FullyQualifiedName!~Codex.WebApi.Tests.Print.&FullyQualifiedName!~Codex.WebApi.Tests.References.&FullyQualifiedName!~Codex.WebApi.Tests.KnowledgeBase.&FullyQualifiedName!~Codex.WebApi.Tests.Structure.&FullyQualifiedName!~Codex.WebApi.Tests.Manuscript.&FullyQualifiedName!~Codex.WebApi.Tests.Auth.&FullyQualifiedName!~Codex.WebApi.Tests.Sharing." -- NUnit.NumberOfTestWorkers=4
        if: ${{ !cancelled() }}
        env:
          DOTNET_GCHeapHardLimit: '0x40000000'
          DOTNET_GCConserveMemory: '7'
      - run: dotnet test src/Codex.WebApi.Tests --configuration Release --no-build --filter "FullyQualifiedName~Codex.WebApi.Tests.Print." -- NUnit.NumberOfTestWorkers=4
        if: ${{ !cancelled() }}
        env:
          DOTNET_GCHeapHardLimit: '0x40000000'
          DOTNET_GCConserveMemory: '7'

  mcp:
    name: MCP tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Spawns the Codex.Mcp stdio server and starts the web host; like the API job, a postgres:18 container.
      # place_figure's test reads the Layout Quick preview, which runs pandoc through codex-sandbox (503 without them).
      - run: scripts/install-print-tools.sh "$RUNNER_TEMP/print-tools" && echo "$RUNNER_TEMP/print-tools" >> "$GITHUB_PATH"
      - run: dotnet build src/Codex.Mcp.Tests --configuration Release && dotnet build-server shutdown
      - run: dotnet test src/Codex.Mcp.Tests --configuration Release --no-build -- NUnit.NumberOfTestWorkers=4
        env:
          DOTNET_GCHeapHardLimit: '0x40000000'
          DOTNET_GCConserveMemory: '7'

  component:
    name: component tests
    runs-on: ubuntu-24.04
    # Same image used to generate the committed screenshot snapshots. The
    # GitHub-hosted runner image and this container ship different font
    # packages even on matching Ubuntu versions, which is enough to break
    # every screenshot assertion; running inside the image itself is what
    # reliably matches.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-resolute
    defaults:
      run:
        working-directory: src/Codex.Client
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/package.json
      - run: pnpm install --frozen-lockfile
      # Playwright defaults to half the CPUs it can see: 2 on a 4 vCPU hosted runner. Pinned so that stays true.
      - run: pnpm run test-ct --workers=2
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: src/Codex.Client/playwright-report/
          retention-days: 14

  acceptance:
    name: acceptance (${{ matrix.group }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Shards are namespaces, so later slices add tests under these namespaces and never edit this file.
        # They are grouped into two jobs because each job spends ~1.5 min on setup (client bundle, build,
        # Chromium, print tools) for 2-60 s of tests; the groups are balanced on test time (~2.5 and ~2 min).
        # Each shard still runs in its own `dotnet test`, so a test host's memory is what one shard needs.
        # `Other` runs every test outside the listed namespaces (a new lane's namespace lands there until it
        # gets a shard), so nothing is silently skipped. A shard with no tests passes (dotnet test exits 0).
        include:
          - group: 1
            shards: Journeys Lanes.References Lanes.Kb Lanes.Library Harness
          - group: 2
            shards: Lanes.Write Other Lanes.Plan Lanes.Settings Lanes.Shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      # The tests serve the real bundle, so it is built first (into Codex.WebApi/wwwroot).
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: src/Codex.Client
      - run: dotnet build src/Codex.AcceptanceTests --configuration Release
      - run: pwsh src/Codex.AcceptanceTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      # Layout's Quick preview runs pandoc through codex-sandbox; without them it answers 503 not_configured.
      # Layout's Proof and Export tests compile PDFs with --only-cached, so the Tectonic cache is restored and warmed
      # as in the API job (which saves it); a stale cache fails on the first package a template change adds.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-bundle-0.15.0-${{ hashFiles('templates/**') }}
          restore-keys: tectonic-bundle-0.15.0-
      - run: scripts/install-print-tools.sh "$RUNNER_TEMP/print-tools" ~/.cache/Tectonic && echo "$RUNNER_TEMP/print-tools" >> "$GITHUB_PATH"
      - name: dotnet test (${{ matrix.shards }})
        env:
          SHARDS: ${{ matrix.shards }}
        # Every shard runs even after one fails; the step fails at the end, naming the failed shards.
        # The trailing dot keeps Lanes.Plan from also matching a Lanes.PlanX namespace.
        run: |
          failed=""
          for shard in $SHARDS; do
            if [ "$shard" = "Other" ]; then
              filter=""
              for ns in Harness Lanes.Shell Lanes.Library Lanes.Plan Lanes.Write Lanes.Kb Lanes.References Lanes.Settings Journeys; do
                filter="${filter:+$filter&}FullyQualifiedName!~Codex.AcceptanceTests.$ns."
              done
            else
              filter="FullyQualifiedName~Codex.AcceptanceTests.$shard."
            fi
            echo "::group::$shard"
            dotnet test src/Codex.AcceptanceTests --configuration Release --no-build --filter "$filter" || failed="$failed $shard"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed shards:$failed"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.group }}
          path: artifacts/playwright-traces/
          if-no-files-found: ignore
          retention-days: 14

  images:
    name: docker images build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Dockerfile
          push: false
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Dockerfile.worker
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
