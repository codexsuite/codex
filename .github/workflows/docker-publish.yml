name: Build & Publish Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Dockerfile
          push: true
          # Stamped into the assembly so /health reports which commit is running.
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/codex:latest
            ghcr.io/${{ github.repository_owner }}/codex:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      # The render worker (pandoc + Tectonic), deployed as codex-worker.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Dockerfile.worker
          push: true
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/codex-worker:latest
            ghcr.io/${{ github.repository_owner }}/codex-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
