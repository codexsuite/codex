<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex · Library (reference)</title>
<!--
  Reference implementation of the Library screen (#7) and Series screen.
  Open directly in a browser. Uses ../tokens.css only; no build step.
  Covers are gradient placeholders: real covers are images in a 2:3 frame.
  Working: grid and list views, search, the Series screen (library.html#series=<id>), New book, Import, Series
  settings, the ⌘K palette, and books shared with you (#80): a "Shared by <owner>" line and a View only / Comment /
  Edit chip on shared tiles and rows, an Owner column in the list, the All / Mine / Shared with me filter
  (library.html#filter=mine|shared), a shared series with all its books (#series=la), and one shared book shown
  under its series heading with the series' other books left out (#series=nr). Shared books open in Write.
  The "Preview" panel bottom-right is a review aid, not part of the design (theme, density, and "Nothing shared"
  for the empty Shared with me state).
-->
<link rel="stylesheet" href="../tokens.css">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--color-bg); color: var(--color-text); font: var(--text-base)/var(--leading) var(--font-sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
svg { flex: none; }

/* App bar */
.appbar { height: var(--bar-height); display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-3); background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
.logo { display: flex; align-items: center; gap: 7px; font-weight: 700; }
.logo i { width: 16px; height: 16px; border-radius: 4px; background: var(--color-accent); }
.crumbs { flex: 1; min-width: 0; display: flex; gap: 6px; align-items: center; color: var(--color-muted); font-size: var(--text-sm); white-space: nowrap; overflow: hidden; }
.crumbs a { color: inherit; text-decoration: none; cursor: pointer; }
.crumbs a:hover { color: var(--color-text); }
.crumbs b { color: var(--color-text); font-weight: var(--weight-medium); overflow: hidden; text-overflow: ellipsis; }
.kbd { border: 1px solid var(--color-border); border-radius: 4px; padding: 1px 5px; font-size: var(--text-xs); color: var(--color-muted); background: var(--color-surface-2); }
button.kbd { cursor: pointer; line-height: inherit; }
button.kbd:hover { color: var(--color-text); }
button.kbd:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--color-accent-soft); color: var(--color-accent); font-size: 10px; font-weight: 700; display: grid; place-items: center; }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--space-2); padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--color-border); }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 5px; height: var(--control-height); padding: 0 10px; border-radius: var(--radius-sm); border: 1px solid var(--color-border); background: var(--color-surface); font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--color-surface-2); }
.btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-fg); }
.btn.primary:hover { filter: brightness(1.07); }
.btn:focus-visible, .seg button:focus-visible, .search:focus-within, .tile:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.btn svg, .seg svg { width: 13px; height: 13px; }
.search { display: flex; align-items: center; gap: 6px; height: var(--control-height); width: 220px; max-width: 100%; padding: 0 var(--space-2); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); }
.search svg { width: 13px; height: 13px; color: var(--color-muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: 0; font-size: var(--text-sm); }
.search input::placeholder { color: var(--color-muted); }
.sel { display: inline-flex; align-items: center; gap: 4px; height: var(--control-height); padding: 0 var(--space-2); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); font-size: var(--text-sm); white-space: nowrap; cursor: pointer; }
.sel em { font-style: normal; color: var(--color-muted); }
.sel svg { width: 11px; height: 11px; color: var(--color-muted); }
.seg { display: inline-flex; height: var(--control-height); border: 1px solid var(--color-border); border-radius: var(--radius-sm); overflow: hidden; background: var(--color-surface); }
.seg button { display: inline-flex; align-items: center; gap: 4px; padding: 0 9px; border: 0; border-right: 1px solid var(--color-border); background: transparent; color: var(--color-muted); font-size: var(--text-sm); cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--color-accent-soft); color: var(--color-text); font-weight: var(--weight-semibold); }

/* Content + groups */
.content { padding: var(--space-1) var(--space-3) var(--space-4); }
.group { padding: 10px 0 var(--space-1); }
.group + .group { border-top: 1px solid var(--color-border); }
.group-h { display: flex; align-items: baseline; gap: var(--space-2); margin: 2px 0 10px; }
.group-h h2 { margin: 0; font-size: var(--text-md); font-weight: var(--weight-semibold); }
.group-h span { color: var(--color-muted); font-size: var(--text-xs); }

/* Shelf: book + series tiles */
.shelf { display: flex; flex-wrap: wrap; gap: var(--shelf-gap); }
.tile { width: var(--cover-width); display: flex; flex-direction: column; gap: 5px; cursor: pointer; border-radius: var(--radius-xs); }
.tile.stack { width: calc(var(--cover-width) + 14px); }
.tile:hover > .cover, .tile:hover .stackwrap > .cover:first-child { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.cover { position: relative; width: var(--cover-width); aspect-ratio: 2 / 3; overflow: hidden; border-radius: var(--radius-xs); padding: 9% 8%; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 1px 2px rgb(0 0 0 / .25), 0 0 0 1px rgb(0 0 0 / .08); }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgb(0 0 0 / .18), transparent 6%); }
.cover .ct { font: 700 calc(var(--cover-width) * .1)/1.05 var(--font-sans); text-transform: uppercase; letter-spacing: .02em; }
.cover .ca { font-size: calc(var(--cover-width) * .065); opacity: .8; text-align: center; }
/* Series stack: up to 3 covers, each one offset down-right and darker (#7) */
.stackwrap { position: relative; width: calc(var(--cover-width) + 14px); height: calc(var(--cover-width) * 1.5 + 10px); }
.stackwrap > .cover { position: absolute; }
.stackwrap > .cover:nth-child(1) { left: 0; top: 0; z-index: 3; }
.stackwrap > .cover:nth-child(2) { left: 7px; top: 5px; z-index: 2; filter: brightness(.82); }
.stackwrap > .cover:nth-child(3) { left: 14px; top: 10px; z-index: 1; filter: brightness(.66); }
.stackwrap .count { position: absolute; z-index: 4; right: 2px; bottom: 2px; padding: 0 5px; line-height: 16px; font-size: 10px; font-weight: var(--weight-semibold); border-radius: 4px; background: var(--color-surface); border: 1px solid var(--color-border); }
.overline { font-size: var(--text-2xs); font-weight: var(--weight-medium); color: var(--color-muted); text-transform: uppercase; letter-spacing: .02em; }
.title { font-size: 12.5px; font-weight: var(--weight-semibold); line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { font-size: var(--text-xs); color: var(--color-muted); }
.status { display: inline-flex; align-items: center; gap: 4px; font-size: var(--text-2xs); font-weight: var(--weight-medium); }
.status i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-planning { color: var(--status-planning); } .st-draft { color: var(--status-draft); } .st-writing { color: var(--status-writing); }
.st-revising { color: var(--status-revising); } .st-published { color: var(--status-published); }
.prog { height: 3px; border-radius: 2px; background: var(--color-surface-2); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--color-accent); }
.addtile { width: var(--cover-width); aspect-ratio: 2 / 3; display: grid; place-items: center; border: 1px dashed var(--color-border); border-radius: var(--radius-xs); color: var(--color-muted); font-size: var(--text-xs); cursor: pointer; background: none; }
.addtile:hover { border-color: var(--color-accent); color: var(--color-accent); }

/* Shared with you (#80): who shared it and your role. The chip is #26 F-06's quiet "Reviewer · comment only" chip. */
.shr { display: flex; align-items: flex-start; gap: 4px; min-width: 0; font-size: var(--text-2xs); line-height: 1.35; color: var(--color-muted); }
.shr span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.shr svg { width: 11px; height: 11px; margin-top: 1px; }
.rchip { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; height: 18px; padding: 0 7px; border-radius: 9px; background: var(--color-surface-2); color: var(--color-muted); font-size: var(--text-2xs); font-weight: var(--weight-medium); white-space: nowrap; flex: none; }
.rchip svg { width: 10px; height: 10px; }
.shared-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: var(--space-2); font-size: var(--text-xs); color: var(--color-muted); }
.shared-h > svg { width: 13px; height: 13px; }
.shared-h b { color: var(--color-text); font-weight: var(--weight-medium); }
.empty-shelf { padding: var(--space-4) 0; max-width: 52ch; font-size: var(--text-sm); color: var(--color-muted); }
.empty-shelf b { display: block; margin-bottom: 2px; color: var(--color-text); font-weight: var(--weight-medium); }

/* List view */
.tbl-wrap { overflow-x: auto; margin-top: var(--space-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); }
table { width: 100%; min-width: 820px; border-collapse: collapse; font-size: var(--text-sm); }
th { text-align: left; padding: 7px 10px; font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--color-muted); text-transform: uppercase; letter-spacing: .04em; background: var(--color-surface-2); border-bottom: 1px solid var(--color-border); white-space: nowrap; }
td { height: var(--row-height); padding: 0 10px; border-bottom: 1px solid var(--color-border); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr:not(.grp):hover td { background: var(--color-accent-soft); cursor: pointer; }
tbody tr[data-book]:focus-visible { outline: 2px solid var(--color-accent); outline-offset: -2px; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.dim { color: var(--color-muted); }
tr.grp td { height: 28px; background: var(--color-bg); color: var(--color-muted); font-size: var(--text-xs); font-weight: var(--weight-semibold); }
.ttl { display: flex; align-items: center; gap: 9px; }
.ttl .rchip { margin-left: -2px; align-self: center; }
.cover.thumb { --cover-width: 22px; padding: 0; }
.cover.thumb > div { display: none; }

/* Series screen */
.series-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--space-4); padding: var(--space-3) 0 14px; margin-bottom: var(--space-3); border-bottom: 1px solid var(--color-border); }
.series-head .stackwrap { --cover-width: 64px; }
.series-head h1 { margin: 0 0 3px; font-size: var(--text-lg); font-weight: var(--weight-semibold); }
.series-head p { margin: 0 0 var(--space-2); max-width: 60ch; color: var(--color-muted); font-size: var(--text-sm); }
.stats { display: flex; flex-wrap: wrap; gap: 18px; }
.stats div { display: flex; flex-direction: column; }
.stats b { font-size: var(--text-md); font-variant-numeric: tabular-nums; }
.stats span { font-size: var(--text-2xs); color: var(--color-muted); text-transform: uppercase; letter-spacing: .05em; }

/* Overlay: one at a time, either a dialog (New book, Import, Series settings) or the ⌘K palette */
#ov { position: fixed; inset: 0; z-index: 30; display: none; grid-template-columns: minmax(0, 1fr); place-items: start center; padding: 12vh var(--space-4) var(--space-4); background: rgb(0 0 0 / .32); overflow: auto; }
#ov.open { display: grid; }
.dlg { width: 440px; max-width: 100%; display: flex; flex-direction: column; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-raised), 0 18px 48px -16px rgb(0 0 0 / .45); overflow: hidden; }
.dlg.wide { width: 500px; }
.dlg-h { display: flex; align-items: center; gap: var(--space-2); padding: 8px 8px 8px 14px; border-bottom: 1px solid var(--color-border); }
.dlg-h h3 { flex: 1; margin: 0; font-size: var(--text-md); font-weight: var(--weight-semibold); }
.dlg-h .step { font-size: var(--text-xs); color: var(--color-muted); }
.dlg-b { display: grid; gap: 10px; padding: 12px 14px; }
.dlg-f { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-top: 1px solid var(--color-border); background: var(--color-bg); }
.btn[disabled] { opacity: .5; cursor: default; filter: none; }
.ib { display: inline-grid; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: var(--radius-xs); background: transparent; color: var(--color-muted); cursor: pointer; flex: none; }
.ib:hover { background: var(--color-surface-2); color: var(--color-text); }
.ib:focus-visible, .mini:focus-visible, .opt:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.ib svg { width: 13px; height: 13px; }
.ib[disabled] { opacity: .35; cursor: default; background: none; }
.mini { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; border: 0; border-radius: var(--radius-xs); background: none; color: var(--color-muted); font-size: var(--text-xs); font-weight: var(--weight-medium); cursor: pointer; white-space: nowrap; }
.mini:hover { background: var(--color-surface-2); color: var(--color-text); }
.fields { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px 10px; align-items: center; }
.fields > label { font-size: var(--text-xs); color: var(--color-muted); }
.fields > label.top { align-self: start; padding-top: 6px; }
.fields [hidden] { display: none; }
.inp { width: 100%; height: var(--control-height); padding: 0 8px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-bg); font-size: var(--text-sm); }
textarea.inp { height: auto; min-height: 54px; padding: 6px 8px; resize: vertical; line-height: var(--leading); }
.inp:focus { outline: 2px solid var(--color-accent); outline-offset: -1px; }
.inp[aria-invalid="true"] { border-color: var(--color-danger); }
.inp.short { width: 76px; font-variant-numeric: tabular-nums; }
.inrow { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
.hint { font-size: var(--text-xs); color: var(--color-muted); }
.note { display: flex; gap: 7px; padding: 7px 9px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--color-info) 9%, var(--color-surface)); border: 1px solid color-mix(in srgb, var(--color-info) 30%, var(--color-border)); font-size: var(--text-xs); color: var(--color-muted); line-height: 1.4; }
.note svg { width: 13px; height: 13px; margin-top: 1px; color: var(--color-info); }
.note a, .note b { color: var(--color-text); }
/* Import: source options, drop zone, mapping summary */
.opts { display: grid; gap: 4px; }
.opt { display: flex; align-items: flex-start; gap: 9px; width: 100%; padding: 7px 9px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); text-align: left; cursor: pointer; }
.opt:hover { background: var(--color-surface-2); }
.opt[aria-checked="true"] { background: var(--color-accent-soft); border-color: color-mix(in srgb, var(--color-accent) 45%, var(--color-border)); }
.opt .rd { width: 12px; height: 12px; margin-top: 2px; border-radius: 50%; border: 1px solid var(--color-muted); flex: none; }
.opt[aria-checked="true"] .rd { border: 4px solid var(--color-accent); }
.opt b { display: block; font-size: var(--text-sm); font-weight: var(--weight-medium); }
.opt small { display: block; font-size: var(--text-xs); color: var(--color-muted); }
.drop { display: grid; place-items: center; gap: 2px; min-height: 76px; padding: 10px; border: 1px dashed var(--color-border); border-radius: var(--radius-sm); color: var(--color-muted); font-size: var(--text-xs); text-align: center; cursor: pointer; }
.drop:hover, .drop.over { border-color: var(--color-accent); color: var(--color-text); background: color-mix(in srgb, var(--color-accent) 5%, transparent); }
.drop:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.drop svg { width: 16px; height: 16px; }
.file { display: flex; align-items: center; gap: 7px; height: var(--row-height); padding: 0 6px 0 9px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-bg); font-size: var(--text-sm); }
.file .ok { color: var(--color-ok); display: inline-flex; }
.file .ok svg { width: 13px; height: 13px; }
.file .fn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.map { border: 1px solid var(--color-border); border-radius: var(--radius-sm); overflow: hidden; }
.map-h { padding: 7px 10px; background: var(--color-surface-2); font-size: var(--text-sm); }
.map-h b { font-weight: var(--weight-semibold); }
.map-h span { display: block; font-size: var(--text-xs); color: var(--color-muted); }
.map-r { display: grid; grid-template-columns: 108px 14px minmax(0, 1fr); align-items: center; gap: 6px; min-height: 28px; padding: 3px 10px; border-top: 1px solid var(--color-border); font-size: var(--text-sm); }
.map-r .n { font-weight: var(--weight-medium); font-variant-numeric: tabular-nums; }
.map-r .to { color: var(--color-muted); }
.map-r small { display: block; font-size: var(--text-xs); color: var(--color-muted); }
.map-r.skip .n, .map-r.skip .dest { color: var(--color-warn); }
/* Series settings: book order */
.order { margin: 0; padding: 0; list-style: none; border: 1px solid var(--color-border); border-radius: var(--radius-sm); overflow: hidden; }
.ord { display: flex; align-items: center; gap: 7px; height: var(--row-height); padding: 0 4px 0 2px; border-top: 1px solid var(--color-border); background: var(--color-surface); font-size: var(--text-sm); }
.ord:first-child { border-top: 0; }
.ord.dragging { opacity: .45; }
.ord.over { box-shadow: inset 0 2px 0 var(--color-accent); }
.ord .grip { cursor: grab; }
.ord .no { width: 26px; font-variant-numeric: tabular-nums; color: var(--color-muted); font-size: var(--text-xs); }
.ord .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: var(--weight-medium); }
/* Command palette */
.pal { width: 560px; max-width: 100%; display: flex; flex-direction: column; max-height: 70vh; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-raised), 0 18px 48px -16px rgb(0 0 0 / .45); overflow: hidden; }
.pal-q { flex: none; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-bottom: 1px solid var(--color-border); }
.pal-q svg { width: 14px; height: 14px; color: var(--color-muted); }
.pal-q input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: var(--text-md); }
.pal-q input::placeholder { color: var(--color-muted); }
.pal-l { overflow: auto; padding: 4px; }
.pal-l .grp { padding: 8px 8px 2px; font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .04em; color: var(--color-muted); }
.pal-l .item { width: 100%; display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 8px; border: 0; border-radius: var(--radius-sm); background: none; font-size: var(--text-sm); text-align: left; cursor: pointer; }
.pal-l .item.on { background: var(--color-accent-soft); }
.pal-l .item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-l .item .k { font-size: var(--text-2xs); color: var(--color-muted); white-space: nowrap; }
.pal-l .item > svg { width: 14px; height: 14px; color: var(--color-muted); }
.pal-l .empty { padding: 18px 8px; text-align: center; font-size: var(--text-sm); color: var(--color-muted); }
.pal-f { flex: none; display: flex; gap: var(--space-3); padding: 6px 12px; border-top: 1px solid var(--color-border); background: var(--color-bg); font-size: var(--text-2xs); color: var(--color-muted); }
@media (max-width: 480px) {
  .ord .status, .dlg-f .hint { display: none; }
  .fields { grid-template-columns: 76px minmax(0, 1fr); }
}
.cover.mini-c { --cover-width: 14px; padding: 0; border-radius: 2px; }
.cover.mini-c > div { display: none; }

/* Toast (same as the book screens) */
#toast { position: fixed; left: 50%; bottom: 16px; z-index: 50; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none; display: flex; align-items: center; gap: var(--space-3); max-width: calc(100vw - 32px); padding: 7px 12px; border-radius: var(--radius-md); background: var(--color-text); color: var(--color-bg); font-size: var(--text-sm); box-shadow: var(--shadow-raised); transition: .18s; }
#toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }

/* Review aid (not part of the design) */
.preview { position: fixed; right: 12px; bottom: 12px; z-index: 10; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); box-shadow: var(--shadow-raised); font-size: var(--text-xs); }
.preview b { color: var(--color-muted); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .05em; }
</style>
</head>
<body>
<header class="appbar">
  <span class="logo"><i></i>Codex</span>
  <nav class="crumbs" id="crumbs"></nav>

  <button class="btn" data-cmd="import"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8m0 0-3-3m3 3 3-3M3 11v2h10v-2"/></svg>Import</button>

</div>

<script>
// Sample data. Covers are [from, to, text] gradient placeholders.
const COVERS = {
  pe: ['#05070d','#0d1a2b','#22d3ee'], sand: ['#d9cfc0','#b9ab97','#5b4f43'], brush: ['#3a3a3a','#555','#eee'],
  fg2: ['#2a1d12','#5c3b1e','#f3d7a4'], fg3: ['#1b2320','#3d4f45','#c9e4d5'],
  ac1: ['#2b0b0b','#7a1d14','#ffb48a'], ac2: ['#1d1d2b','#45306b','#d9c7ff'], ac3: ['#141414','#3b3b3b','#e0b35a'], ac4: ['#3a1406','#a3410f','#ffe1c2'],
  td1: ['#08263a','#155e75','#bae6fd'], td2: ['#0b3b3a','#14706b','#ccfbf1'],
  sl: ['#e8e2d6','#cbbfa9','#2d2a24'], qa: ['#0e0f1a','#283a7a','#a5b4fc'], nb: ['#f1f5f9','#94a3b8','#0f172a'], hm: ['#3b0d1f','#9d174d','#fbcfe8'],
  la1: ['#1a1408','#8a6d1f','#fde68a'], la2: ['#24120b','#a1461f','#fed7aa'], la3: ['#15131f','#4c4470','#ddd6fe'], nr2: ['#0f1c24','#4a6b7d','#e0f2fe'],
  go: ['#1f3a2c','#5f8f6a','#dcfce7'], ps: ['#3d2a14','#b7791f','#fef3c7'],
};
// Shared with you (#80): owner is who shared it, role is your access (the higher of the series and the book grant).
// A partial series is one where only some books are shared with you; the others never reach the client.
const SERIES = [
  { id: 'fg', name: 'Forsaken Gods', desc: 'Tabletop campaign setting: player-facing guide, GM reference and a bestiary.', edited: '2h ago', books: [
    { id: 'players-guide', n: 1, title: 'Players Guide', c: 'brush', words: 48210, target: 60000, status: 'revising', edited: '2h ago' },
    { id: 'gamemasters-codex', n: 2, title: "Gamemaster's Codex", c: 'fg2', words: 61900, target: 90000, status: 'writing', edited: 'Yesterday' },
    { id: 'bestiary-of-the-fallen', n: 3, title: 'Bestiary of the Fallen', c: 'fg3', words: 12400, target: 50000, status: 'planning', edited: 'Sep 30' }] },
  { id: 'la', name: 'The Lantern Archive', owner: 'Mara Lind', role: 'write', desc: 'Gaslamp fantasy: the last lamplighters of a city that has stopped needing them.', edited: 'Yesterday', books: [
    { id: 'lamplighter', n: 1, title: "The Lamplighter's Debt", c: 'la1', author: 'Mara Lind', words: 88400, target: 90000, status: 'published', edited: 'Apr 3' },
    { id: 'wick-and-ember', n: 2, title: 'Wick and Ember', c: 'la2', author: 'Mara Lind', words: 52300, target: 90000, status: 'writing', edited: 'Yesterday' },
    { id: 'moth-hour', n: 3, title: 'The Moth Hour', c: 'la3', author: 'Mara Lind', words: 6100, target: 90000, status: 'planning', edited: 'Oct 1' }] },
  { id: 'ac', name: 'The Ashen Crown', desc: 'Epic fantasy quartet. Books 1–2 published; 3 in revision.', edited: 'Oct 14', books: [
    { id: 'ember-oath', n: 1, title: 'Ember Oath', c: 'ac1', words: 112300, target: 110000, status: 'published', edited: 'Mar 2, 2025' },
    { id: 'iron-litany', n: 2, title: 'Iron Litany', c: 'ac2', words: 124870, target: 120000, status: 'published', edited: 'Jan 11' },
    { id: 'hollow-throne', n: 3, title: 'Hollow Throne', c: 'ac3', words: 98450, target: 120000, status: 'revising', edited: 'Oct 14' },
    { id: 'last-cinder', n: 4, title: 'Last Cinder', c: 'ac4', words: 3100, target: 120000, status: 'planning', edited: 'Oct 2' }] },
  { id: 'nr', name: 'Northern Rites', owner: 'Kofi Mensah', partial: true, desc: '', edited: 'Oct 12', books: [
    { id: 'salt-king', n: 2, title: 'The Salt King', c: 'nr2', author: 'Kofi Mensah', role: 'comment', words: 70950, target: 95000, status: 'revising', edited: 'Oct 12' }] },
  { id: 'td', name: 'Tidewater Chronicles', desc: 'Coastal mystery series.', edited: 'Aug 30', books: [
    { id: 'saltmarsh', n: 1, title: 'Saltmarsh', c: 'td1', words: 81200, target: 85000, status: 'published', edited: 'Jun 4' },
    { id: 'undertow', n: 2, title: 'Undertow', c: 'td2', words: 22950, target: 85000, status: 'writing', edited: 'Aug 30' }] },
];
const STANDALONE = [
  { id: 'pe', title: 'Product Engineering', c: 'pe', author: 'Joel Dickson', words: 72340, target: 80000, status: 'writing', edited: 'Today, 2:42 PM' },
  { id: 'paper-saints', title: 'Paper Saints', c: 'ps', author: 'Sam Okafor', owner: 'Sam Okafor', role: 'write', words: 66800, target: 80000, status: 'revising', edited: 'Today, 9:15 AM' },
  { id: 'glass-orchard', title: 'Glass Orchard', c: 'go', author: 'Mara Lind', owner: 'Mara Lind', role: 'view', words: 41200, target: 75000, status: 'draft', edited: 'Oct 18' },
  { id: 'pe-v1', title: 'Product Engineering (v1)', c: 'sand', words: 38020, target: 80000, status: 'draft', edited: 'Aug 12, 2025' },
  { id: 'quiet-algorithm', title: 'The Quiet Algorithm', c: 'qa', words: 54610, target: 70000, status: 'writing', edited: 'Oct 9' },
  { id: 'saltwater-ledger', title: 'Saltwater Ledger', c: 'sl', words: 91000, target: 90000, status: 'published', edited: 'May 21' },
  { id: 'northbound', title: 'Northbound', c: 'nb', words: 8800, target: 60000, status: 'planning', edited: 'Sep 3' },
  { id: 'hymns-for-machines', title: 'Hymns for Machines', c: 'hm', words: 27300, target: 40000, status: 'draft', edited: 'Jul 18' },
];
const STATUS = { planning: 'Planning', draft: 'Draft', writing: 'Writing', revising: 'Revising', published: 'Published' };

const state = { view: 'grid', series: null, q: '', own: 'all', noneShared: false };
const ROLE_CHIP = { view: ['View only', '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>', 'You can read it. Typing and changes are turned off.'],
  comment: ['Comment', '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg>', 'You can read it and comment.'],
  write: ['Edit', '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10.5 2.5 13.5 5.5 6 13H3v-3z"/></svg>', 'You can change it. Sharing, moving and archiving stay with the owner.'] };
const PERSON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c.5-2.6 2.5-4 5-4s4.5 1.4 5 4"/></svg>';
const rchip = r => `<span class="rchip" title="${ROLE_CHIP[r][2]}" data-testid="library-role-chip">${ROLE_CHIP[r][1]}${ROLE_CHIP[r][0]}</span>`;
const sharedBy = o => `<div class="shr" title="Shared by ${esc(o)}" data-testid="library-shared-by">${PERSON}<span>Shared by ${esc(o)}</span></div>`;
// Your role on a book: its own grant, or the series grant
const roleOf = (b, s) => b.role || s?.role;
// All / Mine / Shared with me
const ownOk = x => !(state.noneShared && x.owner) && (state.own === 'all' || (state.own === 'mine') === !x.owner);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const kw = n => n >= 1000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1) + 'k' : String(n);
const pct = b => Math.min(100, Math.round(b.words / b.target * 100));
const bookNo = n => 'Book ' + String(n).padStart(3, '0');
const matches = text => !state.q || text.toLowerCase().includes(state.q.toLowerCase());
const status = s => `<span class="status st-${s}"><i></i>${STATUS[s]}</span>`;

function cover(b, cls = 'cover') {
  const [from, to, ink] = COVERS[b.c];
  return `<div class="${cls}" style="background:linear-gradient(160deg,${from},${to});color:${ink}"><div class="ct">${esc(b.title)}</div><div class="ca">${esc(b.author || 'J. Dickson')}</div></div>`;
}
function bookTile(b, inSeries, s) {
  const r = roleOf(b, s), owner = b.owner || (s && s.owner);
  return `<div class="tile" tabindex="0" data-book="${b.id}" title="Open ${esc(b.title)}"${owner ? ' data-testid="library-shared-tile"' : ''}>
    ${cover(b)}
    ${inSeries ? `<div class="overline">${bookNo(b.n)}</div>` : ''}
    <div class="title">${esc(b.title)}</div>
    <div class="prog"><i style="width:${pct(b)}%"></i></div>
    <div class="meta">${kw(b.words)} words · ${esc(b.edited)}</div>
    ${status(b.status)}
    ${owner && !inSeries ? sharedBy(owner) : ''}${r ? rchip(r) : ''}
  </div>`;
}
function seriesTile(s) {
  const words = s.books.reduce((t, b) => t + b.words, 0);
  return `<div class="tile stack" tabindex="0" data-series="${s.id}" title="Open series">
    <div class="stackwrap">${s.books.slice(0, 3).map(b => cover(b)).join('')}<span class="count">${s.books.length}</span></div>
    <div class="overline">Series · ${s.books.length} ${s.books.length === 1 ? 'book' : 'books'}</div>
    <div class="title">${esc(s.name)}</div>
    <div class="meta">${kw(words)} words · ${esc(s.edited)}</div>
    ${s.owner ? sharedBy(s.owner) + rchip(s.role || s.books[0].role) : ''}
  </div>`;
}
function row(b, s) {
  const r = roleOf(b, s), owner = b.owner || s?.owner;
  return `<tr tabindex="0" data-book="${b.id}" title="Open ${esc(b.title)}"><td><div class="ttl">${cover(b, 'cover thumb')}<span class="title">${esc(b.title)}</span>${r ? rchip(r) : ''}</div></td>
    <td class="${owner ? '' : 'dim'}">${owner ? esc(owner) : 'You'}</td><td class="dim">${s ? esc(s.name) : '—'}</td><td class="num dim">${s ? String(b.n).padStart(3, '0') : ''}</td>
    <td class="num">${b.words.toLocaleString()}</td><td style="width:110px"><div class="prog"><i style="width:${pct(b)}%"></i></div></td>
    <td>${status(b.status)}</td><td class="dim">${esc(b.edited)}</td></tr>`;
}
function table(groups, withStandalone) {
  let body = '';
  for (const s of groups) {
    const books = s.books.filter(b => matches(b.title) || matches(s.name));
    if (!books.length || (withStandalone && !ownOk(s))) continue;
    if (withStandalone) body += `<tr class="grp"><td colspan="8">${esc(s.name)} · ${books.length}${s.owner ? ` · Shared by ${esc(s.owner)}` : ''}</td></tr>`;
    body += books.map(b => row(b, s)).join('');
  }
  if (withStandalone) {
    const solo = STANDALONE.filter(b => matches(b.title) && ownOk(b));
    if (solo.length) body += `<tr class="grp"><td colspan="8">Standalone · ${solo.length}</td></tr>` + solo.map(b => row(b)).join('');
  }
  if (!body) return emptyShelf();
  return `<div class="tbl-wrap"><table><thead><tr><th>Title</th><th>Owner</th><th>Series</th><th class="num">#</th><th class="num">Words</th><th>Progress</th><th>Status</th><th>Edited</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
function emptyShelf() {
  return state.own === 'shared' && !state.q
    ? `<div class="empty-shelf" data-testid="library-shared-empty"><b>Nothing is shared with you yet.</b>When someone shares a book or a series with you, it shows up here.</div>`
    : `<div class="empty-shelf"><b>No books match.</b>Try another search${state.own !== 'all' ? ', or show All' : ''}.</div>`;
}
function library() {
  if (state.view === 'list') return table(SERIES, true);
  const series = SERIES.filter(s => ownOk(s) && (matches(s.name) || s.books.some(b => matches(b.title))));
  const solo = STANDALONE.filter(b => ownOk(b) && matches(b.title));
  if (!series.length && !solo.length) return emptyShelf();
  const n = series.reduce((t, s) => t + s.books.length, 0);
  return (series.length ? `<section class="group"><div class="group-h"><h2>Series</h2><span>${series.length} series · ${n} ${n === 1 ? 'book' : 'books'}</span></div>
      <div class="shelf">${series.map(seriesTile).join('')}</div></section>` : '')
    + (solo.length || state.own !== 'shared' ? `<section class="group"><div class="group-h"><h2>Standalone</h2><span>${solo.length} ${solo.length === 1 ? 'book' : 'books'}</span></div>
      <div class="shelf">${solo.map(b => bookTile(b, false)).join('')}${state.own === 'shared' ? '' : '<button class="addtile" data-cmd="new-book">+ New book</button>'}</div></section>` : '');
}
function seriesScreen(s) {
  const words = s.books.reduce((t, b) => t + b.words, 0);
  return `<div class="series-head">
      <div class="stackwrap">${s.books.slice(0, 3).map(b => cover(b)).join('')}</div>
      <div style="flex:1;min-width:200px"><h1>${esc(s.name)}</h1>${s.desc ? `<p>${esc(s.desc)}</p>` : ''}
        <div class="stats"><div><b>${s.books.length}</b><span>Books</span></div><div><b>${words.toLocaleString()}</b><span>Words</span></div>
          <div><b>${s.books.filter(b => b.status === 'published').length}</b><span>Published</span></div><div><b>${esc(s.edited)}</b><span>Last edit</span></div></div>
        ${s.owner ? `<div class="shared-h" data-testid="library-series-shared">${PERSON}<span>Shared by <b>${esc(s.owner)}</b></span>${s.role ? rchip(s.role) : ''}</div>` : ''}</div>
      ${s.owner ? '' : `<div style="display:flex;gap:6px"><button class="btn" data-cmd="series-settings">Series settings</button><button class="btn primary" data-cmd="new-book" data-sid="${s.id}">+ Add book</button></div>`}
    </div>
    ${s.partial ? `<div class="note" style="margin-bottom:var(--space-3)">${IC.info}<span>${esc(s.owner)} shared ${s.books.length === 1 ? 'one book' : 'some books'} in this series with you. Only ${s.books.length === 1 ? 'that book appears' : 'those books appear'} here.</span></div>` : ''}
    ${state.view === 'list' ? table([s], false) : `<div class="shelf">${s.books.map(b => bookTile(b, true, s)).join('')}${s.owner ? '' : `<button class="addtile" data-cmd="new-book" data-sid="${s.id}">+ Add book</button>`}</div>`}`;
}
function render() {
  const s = SERIES.find(x => x.id === state.series);
  document.getElementById('crumbs').innerHTML = s ? `<a data-nav="library">Library</a><span>/</span><b>${esc(s.name)}</b>` : '<b>Library</b>';
  document.getElementById('content').innerHTML = s ? seriesScreen(s) : library();
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === state.view));
  document.querySelectorAll('[data-own]').forEach(b => b.setAttribute('aria-pressed', b.dataset.own === state.own));
  document.querySelector('[data-none-shared]').setAttribute('aria-pressed', state.noneShared);
  const html = document.documentElement;
  document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeSet === (html.dataset.theme || 'system')));
  document.querySelectorAll('[data-dens-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.densSet === (html.dataset.density || 'compact')));
}

// ---------- Navigation: open a book (G1, G2), Series screen in the hash (G3) ----------
const ALL = () => [...SERIES.flatMap(s => s.books.map(b => ({ b, s }))), ...STANDALONE.map(b => ({ b, s: null }))];
// A book opens on the screen it was last left on (each book screen writes codex.last.<id>), else Plan
function openBook(id) {
  // A book shared with you opens in Write, the reference screen that shows your role (#80)
  if (ALL().find(x => x.b.id === id && (x.b.owner || x.s?.owner))) { location.href = `write.html?book=${encodeURIComponent(id)}`; return; }
  let last = null;
  try { last = localStorage.getItem('codex.last.' + id); } catch {}
  location.href = `${['plan', 'write', 'references'].includes(last) ? last : 'plan'}.html?book=${encodeURIComponent(id)}`;
}
// library.html#series=<sid> shows that Series screen, so a book's Back link and the browser Back button land on it
function fromHash() {
  const h = new URLSearchParams(location.hash.slice(1)), id = h.get('series');
  state.own = ['mine', 'shared'].includes(h.get('filter')) ? h.get('filter') : 'all';
  const next = SERIES.some(s => s.id === id) ? id : null;
  if (next !== state.series) { state.series = next; scrollTo(0, 0); }
  render();
}
function goSeries(id) {
  if (id) { location.hash = 'series=' + id + (state.own !== 'all' ? '&filter=' + state.own : ''); return; }   // hashchange renders
  if (location.hash) { const f = state.own !== 'all' ? '#filter=' + state.own : ''; try { history.pushState(null, '', location.pathname + location.search + f); } catch { location.hash = f; } }
  fromHash();
}
addEventListener('hashchange', fromHash);
addEventListener('popstate', fromHash);

// ---------- Toast (same look as the book screens) ----------
let toastT;
function toast(html) {
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${html}</span>`;
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 4200);
}

// ---------- Overlay: one dialog (New book, Import, Series settings) or the ⌘K palette at a time ----------
const IC = {
  x: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4 4 8 8M12 4l-8 8"/></svg>',
  ok: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3.5 8.5 3 3 6-7"/></svg>',

  drop: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 10V2m0 0L5 5m3-3 3 3M3 10v3h10v-3"/></svg>',
  grip: '<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="6" cy="4" r="1.1"/><circle cx="10" cy="4" r="1.1"/><circle cx="6" cy="8" r="1.1"/><circle cx="10" cy="8" r="1.1"/><circle cx="6" cy="12" r="1.1"/><circle cx="10" cy="12" r="1.1"/></svg>',
  up: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4 10 4-4 4 4"/></svg>',
  down: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4 6 4 4 4-4"/></svg>',
  search: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>',
  stack: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="2.5" width="7" height="10" rx="1"/><path d="M11.5 4.5v9h-6"/></svg>',
  plus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3v10M3 8h10"/></svg>',
  import: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8m0 0-3-3m3 3 3-3M3 11v2h10v-2"/></svg>',
  list: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4h12M2 8h12M2 12h12"/></svg>',
  grid: '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>',
  theme: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 0 0 11z" fill="currentColor"/></svg>',
};
const ov = { kind: null };
const $ov = document.getElementById('ov');
let returnTo = null;
const closeBtn = `<button type="button" class="ib" data-cmd="close" aria-label="Close">${IC.x}</button>`;
const nextNo = s => String(s.books.length + 1).padStart(3, '0');
const nHint = s => `Next in the series · ${s.books.length} books so far`;
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };

function openOv(kind, data = {}) {
  if (!ov.kind) returnTo = document.activeElement;   // a palette action opening a dialog keeps the original focus to return to
  for (const k in ov) delete ov[k];
  Object.assign(ov, { kind }, data);
  $ov.classList.add('open');
  renderOv();
}
function closeOv() {
  ov.kind = null; $ov.classList.remove('open'); $ov.innerHTML = '';
  if (returnTo?.isConnected) returnTo.focus();
  returnTo = null;
}
function renderOv() {
  $ov.innerHTML = { palette, new: newBook, import: importDlg, settings: seriesSettings }[ov.kind]();
  $ov.querySelector('[data-focus]')?.focus();
}
// Tab and Shift+Tab stay inside the open dialog
function trap(e) {
  const f = [...$ov.querySelectorAll('button:not([disabled]), input, select, textarea, [tabindex="0"]')].filter(x => x.tabIndex >= 0 && x.getClientRects().length);
  const i = f.indexOf(document.activeElement);
  if (!f.length) return e.preventDefault();
  if (i === -1 || (e.shiftKey && i === 0) || (!e.shiftKey && i === f.length - 1)) { e.preventDefault(); (e.shiftKey && i <= 0 ? f.at(-1) : f[0]).focus(); }
}
function invalid(id, msg) {
  const el = document.getElementById(id);
  el.setAttribute('aria-invalid', 'true'); el.focus(); toast(msg);
}

// New book (J3): from Create Novel, the + New book tile, and + Add book on a Series screen (pre-fills that series)
function newBook() {
  const s = SERIES.find(x => x.id === ov.sid);
  const nrow = s ? '' : ' hidden';
  return `<form class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT" data-form="new" novalidate>
    <div class="dlg-h"><h3 id="dlgT">New book</h3>${closeBtn}</div>
    <div class="dlg-b fields">
      <label for="nbTitle">Title</label><input class="inp" id="nbTitle" placeholder="Untitled" autocomplete="off" data-focus>
      <label for="nbAuthor">Author</label><input class="inp" id="nbAuthor" value="Joel Dickson" autocomplete="off">
      <label for="nbSeries">Series</label><select class="inp" id="nbSeries"><option value="">None (standalone)</option>${SERIES.filter(x => !x.owner).map(x => `<option value="${x.id}"${x === s ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
      <label for="nbN" data-nrow${nrow}>Number</label><div class="inrow" data-nrow${nrow}><input class="inp short" id="nbN" inputmode="numeric" autocomplete="off" value="${s ? nextNo(s) : ''}"><span class="hint" id="nbNHint">${s ? esc(nHint(s)) : ''}</span></div>
      <label for="nbTarget">Target words</label><div class="inrow"><input class="inp short" id="nbTarget" inputmode="numeric" autocomplete="off" value="80,000" style="width:96px"><span class="hint">You can change it later</span></div>
    </div>
    <div class="dlg-f"><span class="hint">Opens on Plan with one empty act</span><span class="spacer"></span><button type="button" class="btn" data-cmd="close">Cancel</button><button class="btn primary">Create book</button></div>
  </form>`;
}

// Import (J3 variant): pick a source, then a summary of what the import mapping (#10) will create
const IMPORTS = {
  md: { name: 'Markdown folder', sub: 'One file per chapter. Front matter sets the title and author.', drop: 'Drop a folder of .md files', file: 'product-engineering/ · 10 files',
    rows: [['1 act', 'Act 1', 'Markdown has no acts'], ['10 files', 'Chapters', 'One per file, in file-name order'], ['18 scenes', 'Scenes', 'Split on *** or ---'], ['2 fields', 'Book details', 'Title and author from front matter'], ['3 images', 'Skipped', 'Images are not imported yet', 1]] },
  nc: { name: 'Novelcrafter export', sub: 'The .zip from Novelcrafter: acts, chapters, scenes and the Codex.', drop: 'Drop a Novelcrafter .zip export', file: 'Product Engineering.novelcrafter.zip · 2.4 MB',
    rows: [['3 acts', 'Acts', 'Titles and order kept'], ['10 chapters', 'Chapters', 'Numbered across acts'], ['18 scenes', 'Scenes', 'Prose, summaries and Codex links'], ['12 Codex entries', 'Knowledge base', 'Categories, aliases and additions'], ['4 labels', 'Scene labels', 'Colours mapped to ok, info, warn, danger'], ['9 snippets', 'Skipped', 'Codex has no snippets yet', 1]] },
  docx: { name: 'Word document (.docx)', sub: 'Heading 1 starts a chapter. Section breaks split scenes.', drop: 'Drop a .docx file', file: 'Product Engineering.docx · 410 KB',
    rows: [['1 act', 'Act 1', 'Word has no acts'], ['10 headings', 'Chapters', 'Every Heading 1'], ['18 sections', 'Scenes', 'Section breaks and centred ***'], ['23 comments', 'Skipped', 'Word comments are not imported', 1]] },
};
function importDlg() {
  const src = IMPORTS[ov.src];
  const head = `<div class="dlg-h"><h3 id="dlgT">Import a book</h3><span class="step">Step ${ov.step} of 2</span>${closeBtn}</div>`;
  if (ov.step === 1) return `<form class="dlg wide" role="dialog" aria-modal="true" aria-labelledby="dlgT" data-form="import">${head}
    <div class="dlg-b">
      <div class="opts" role="radiogroup" aria-label="Import from">${Object.entries(IMPORTS).map(([k, x]) => `<button type="button" class="opt" role="radio" aria-checked="${k === ov.src}" data-cmd="imp-src" data-src="${k}"${k === ov.src && !ov.file ? ' data-focus' : ''}><span class="rd"></span><span><b>${x.name}</b><small>${x.sub}</small></span></button>`).join('')}</div>
      ${ov.file ? `<div class="file"><span class="ok">${IC.ok}</span><span class="fn">${esc(ov.file)}</span><button type="button" class="mini" data-cmd="imp-clear">Remove</button></div>`
        : `<div class="drop" tabindex="0" role="button" data-cmd="imp-pick">${IC.drop}<b>${src.drop}</b><span>or click to choose a file</span></div>`}
    </div>
    <div class="dlg-f"><span class="hint">Nothing is imported until step 2</span><span class="spacer"></span><button type="button" class="btn" data-cmd="close">Cancel</button><button class="btn primary"${ov.file ? ' data-focus' : ' disabled'}>Next</button></div></form>`;
  return `<form class="dlg wide" role="dialog" aria-modal="true" aria-labelledby="dlgT" data-form="import">${head}
    <div class="dlg-b">
      <div class="map"><div class="map-h"><b>Product Engineering (v1)</b><span>Joel Dickson · 38,020 words · Standalone · from ${src.name}</span></div>
        ${src.rows.map(([n, dest, why, skip]) => `<div class="map-r${skip ? ' skip' : ''}"><span class="n">${n}</span><span class="to">→</span><span><span class="dest">${dest}</span><small>${why}</small></span></div>`).join('')}
      </div>
      <div class="note">${IC.info}<span>Each field's mapping is in the <a href="https://github.com/codexsuite/codex/blob/main/docs/import.md" target="_blank" rel="noopener">import docs</a>. The export itself is not changed. The new book opens on Plan.</span></div>
    </div>
    <div class="dlg-f"><button type="button" class="btn" data-cmd="imp-back">Back</button><span class="spacer"></span><button type="button" class="btn" data-cmd="close">Cancel</button><button class="btn primary" data-focus>Import book</button></div></form>`;
}

// Series settings: name, description, book order (drag the grip, Alt+↑/↓ on it, or the arrows)
function seriesSettings() {
  const s = SERIES.find(x => x.id === ov.sid);
  return `<form class="dlg wide" role="dialog" aria-modal="true" aria-labelledby="dlgT" data-form="settings">
    <div class="dlg-h"><h3 id="dlgT">Series settings</h3>${closeBtn}</div>
    <div class="dlg-b fields">
      <label for="ssName">Name</label><input class="inp" id="ssName" value="${esc(s.name)}" autocomplete="off" data-focus>
      <label for="ssDesc" class="top">Description</label><textarea class="inp" id="ssDesc" rows="2">${esc(s.desc)}</textarea>
      <label class="top">Book order</label><div><ol class="order" id="ord" aria-label="Book order">${orderRows()}</ol><div class="hint" style="margin-top:4px">Book numbers follow this order.</div></div>
    </div>
    <div class="dlg-b" style="padding-top:0"><div class="note">${IC.info}<span>Knowledge base categories on the series, like <b>Characters</b> and <b>Places</b>, are shared by every book in the series. Each book can add its own.</span></div></div>
    <div class="dlg-f"><span class="spacer"></span><button type="button" class="btn" data-cmd="close">Cancel</button><button class="btn primary">Save</button></div>
  </form>`;
}
function orderRows() {
  const last = ov.order.length - 1;
  return ov.order.map((b, i) => `<li class="ord" draggable="true" data-i="${i}">
    <button type="button" class="ib grip" data-i="${i}" title="Drag to reorder" aria-label="Move ${esc(b.title)} (Alt+Up or Alt+Down)">${IC.grip}</button>
    <span class="no">${String(i + 1).padStart(3, '0')}</span>${cover(b, 'cover mini-c')}<span class="t">${esc(b.title)}</span>${status(b.status)}
    <button type="button" class="ib" data-cmd="ord-move" data-i="${i}" data-d="-1" aria-label="Move ${esc(b.title)} up"${i ? '' : ' disabled'}>${IC.up}</button>
    <button type="button" class="ib" data-cmd="ord-move" data-i="${i}" data-d="1" aria-label="Move ${esc(b.title)} down"${i < last ? '' : ' disabled'}>${IC.down}</button></li>`).join('');
}
function moveOrd(i, d, viaGrip) {
  const j = i + d;
  if (!d || j < 0 || j >= ov.order.length) return;
  ov.order.splice(j, 0, ov.order.splice(i, 1)[0]);
  document.getElementById('ord').innerHTML = orderRows();
  const btn = !viaGrip && document.querySelector(`#ord [data-cmd="ord-move"][data-i="${j}"][data-d="${d}"]:not([disabled])`);
  (btn || document.querySelector(`#ord .grip[data-i="${j}"]`)).focus();
}

// Command palette (⌘K / Ctrl+K): books, series, actions
function palResults() {
  const q = (ov.q || '').trim().toLowerCase(), m = t => !q || t.toLowerCase().includes(q);
  const books = ALL().filter(({ b, s }) => m(b.title) || (s && m(s.name))).sort((x, y) => m(y.b.title) - m(x.b.title));
  const actions = [
    { id: 'new-book', icon: IC.plus, label: 'Create novel' },
    { id: 'import', icon: IC.import, label: 'Import a book…' },
    { id: 'view', icon: state.view === 'list' ? IC.grid : IC.list, label: state.view === 'list' ? 'Switch to Grid view' : 'Switch to List view' },
    { id: 'theme', icon: IC.theme, label: 'Toggle theme', k: isDark() ? 'Dark → Light' : 'Light → Dark' },
  ];
  return [
    ...books.map(({ b, s }) => ({ g: 'Books', run: () => openBook(b.id),
      html: `${cover(b, 'cover mini-c')}<span class="t">${esc(b.title)}</span><span class="k">${s ? `${esc(s.name)} · ${bookNo(b.n)}` : 'Standalone'}${b.owner || s?.owner ? ` · ${esc(b.owner || s.owner)}` : ''}</span>` })),
    ...SERIES.filter(s => m(s.name)).map(s => ({ g: 'Series', run: () => { closeOv(); goSeries(s.id); },
      html: `${IC.stack}<span class="t">${esc(s.name)}</span><span class="k">${s.books.length} books</span>` })),
    ...actions.filter(a => m(a.label)).map(a => ({ g: 'Actions', run: () => command(a.id),
      html: `${a.icon}<span class="t">${a.label}</span>${a.k ? `<span class="k">${a.k}</span>` : ''}` })),
  ];
}
function palette() {
  return `<div class="pal" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="pal-q">${IC.search}<input id="palQ" placeholder="Search books, series and actions…" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="palL" aria-activedescendant="pal-0" value="${esc(ov.q)}" data-focus><span class="kbd">Esc</span></div>
    <div class="pal-l" id="palL" role="listbox">${palList()}</div>
    <div class="pal-f"><span>↑↓ to move</span><span>Enter to open</span><span>Esc to close</span></div>
  </div>`;
}
function palList() {
  ov.items = palResults(); ov.i = Math.min(ov.i, Math.max(0, ov.items.length - 1));
  if (!ov.items.length) return `<div class="empty">Nothing matches “${esc(ov.q)}”</div>`;
  let g = '';
  return ov.items.map((it, i) => (it.g !== g ? `<div class="grp">${g = it.g}</div>` : '')
    + `<button type="button" class="item${i === ov.i ? ' on' : ''}" role="option" id="pal-${i}" aria-selected="${i === ov.i}" data-pal="${i}" tabindex="-1">${it.html}</button>`).join('');
}
function palHi(i, scroll = true) {
  ov.i = i;
  $ov.querySelectorAll('[data-pal]').forEach(b => { const on = +b.dataset.pal === i; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  document.getElementById('palQ').setAttribute('aria-activedescendant', 'pal-' + i);
  if (scroll) document.getElementById('pal-' + i)?.scrollIntoView({ block: 'nearest' });
}

function command(cmd, t) {
  const html = document.documentElement;
  switch (cmd) {
    case 'palette': return ov.kind === 'palette' ? closeOv() : openOv('palette', { q: '', i: 0 });
    case 'close': return closeOv();
    case 'new-book': return openOv('new', { sid: t?.dataset.sid || state.series || '' });
    case 'import': return openOv('import', { step: 1, src: 'nc', file: null });
    case 'series-settings': { const s = SERIES.find(x => x.id === state.series); return openOv('settings', { sid: s.id, order: [...s.books] }); }
    case 'imp-src': ov.src = t.dataset.src; ov.file = null; return renderOv();
    case 'imp-pick': ov.file = IMPORTS[ov.src].file; return renderOv();   // stands in for the file picker
    case 'imp-clear': ov.file = null; return renderOv();
    case 'imp-back': ov.step = 1; return renderOv();
    case 'ord-move': return moveOrd(+t.dataset.i, +t.dataset.d);
    case 'view': closeOv(); state.view = state.view === 'list' ? 'grid' : 'list'; return render();
    case 'theme': closeOv(); html.dataset.theme = isDark() ? 'light' : 'dark'; return render();
  }
}

document.addEventListener('submit', e => {
  e.preventDefault();
  const kind = e.target.dataset.form, v = id => document.getElementById(id).value.trim();
  if (kind === 'new') {
    const title = v('nbTitle'), sid = v('nbSeries'), n = parseInt(v('nbN'), 10);
    if (!title) return invalid('nbTitle', 'Give the book a title');
    if (sid && !(n > 0)) return invalid('nbN', 'Give the book a number in the series');
    location.href = `plan.html?book=new&title=${encodeURIComponent(title)}${sid ? `&series=${sid}&n=${n}` : ''}`;
  } else if (kind === 'import') {
    if (ov.step === 1) { if (ov.file) { ov.step = 2; renderOv(); } return; }
    location.href = 'plan.html?book=pe-v1&imported=1';
  } else if (kind === 'settings') {
    const name = v('ssName') || SERIES.find(x => x.id === ov.sid).name;
    closeOv(); toast(`Saved settings for <b>${esc(name)}</b>`);
  }
});
document.addEventListener('change', e => {
  if (e.target.id !== 'nbSeries') return;
  const s = SERIES.find(x => x.id === e.target.value);
  $ov.querySelectorAll('[data-nrow]').forEach(x => { x.hidden = !s; });
  document.getElementById('nbN').value = s ? nextNo(s) : '';
  document.getElementById('nbNHint').textContent = s ? nHint(s) : '';
});
document.addEventListener('input', e => {
  if (e.target.id === 'palQ') { ov.q = e.target.value; ov.i = 0; document.getElementById('palL').innerHTML = palList(); return; }
  e.target.removeAttribute?.('aria-invalid');
});
document.addEventListener('pointermove', e => {
  const p = ov.kind === 'palette' && e.target.closest?.('[data-pal]');
  if (p && +p.dataset.pal !== ov.i) palHi(+p.dataset.pal, false);
});

// Drag: book order rows in Series settings, files onto the Import drop zone
let dragI = null;
document.addEventListener('dragstart', e => {
  const li = e.target.closest?.('.ord'); if (!li) return;
  dragI = +li.dataset.i; li.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', li.querySelector('.t').textContent);
});
document.addEventListener('dragover', e => {
  const li = e.target.closest?.('.ord'), drop = e.target.closest?.('.drop');
  if (li && dragI !== null) {
    e.preventDefault();
    document.querySelectorAll('.ord.over').forEach(x => x.classList.remove('over'));
    li.classList.add('over'); li.style.boxShadow = +li.dataset.i > dragI ? 'inset 0 -2px 0 var(--color-accent)' : '';
  } else if (drop) { e.preventDefault(); drop.classList.add('over'); }
  else if (ov.kind === 'import') e.preventDefault();   // a file dropped beside the zone shouldn't navigate away
});
document.addEventListener('dragleave', e => { const d = e.target.closest?.('.drop'); if (d && !d.contains(e.relatedTarget)) d.classList.remove('over'); });
document.addEventListener('drop', e => {
  const li = e.target.closest?.('.ord'), drop = e.target.closest?.('.drop');
  if (li && dragI !== null) { e.preventDefault(); moveOrd(dragI, +li.dataset.i - dragI, true); }
  else if (ov.kind === 'import') {
    e.preventDefault();
    const f = drop && e.dataTransfer.files?.[0];
    if (f) { ov.file = `${f.name} · ${f.size >= 1e6 ? (f.size / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(f.size / 1e3)) + ' KB'}`; renderOv(); }
  }
});
document.addEventListener('dragend', () => { dragI = null; document.querySelectorAll('.ord').forEach(x => { x.classList.remove('dragging', 'over'); x.style.boxShadow = ''; }); });

let downOnScrim = false;
document.addEventListener('pointerdown', e => { downOnScrim = e.target === $ov; });
document.addEventListener('click', e => {
  if (e.target === $ov) return downOnScrim && closeOv();   // click on the scrim (not a drag that started in the dialog)
  const p = e.target.closest('[data-pal]');
  if (p) return ov.items[+p.dataset.pal]?.run();
  const t = e.target.closest('[data-cmd],[data-book],[data-view],[data-series],[data-nav],[data-theme-set],[data-dens-set],[data-own],[data-none-shared]');
  if (!t) return;
  if (t.dataset.own) {
    state.own = t.dataset.own;
    const h = new URLSearchParams(location.hash.slice(1)); state.own === 'all' ? h.delete('filter') : h.set('filter', state.own);
    history.replaceState(null, '', location.pathname + location.search + (h.toString() ? '#' + h : ''));
    return render();
  }
  if (t.hasAttribute('data-none-shared')) { state.noneShared = !state.noneShared; return render(); }
  if (t.dataset.cmd) return command(t.dataset.cmd, t);
  if (t.dataset.book) return openBook(t.dataset.book);
  if (t.dataset.series) return goSeries(t.dataset.series);
  if (t.dataset.nav) return goSeries(null);
  const html = document.documentElement;
  if (t.dataset.view) state.view = t.dataset.view;
  else if (t.dataset.themeSet) t.dataset.themeSet === 'system' ? delete html.dataset.theme : html.dataset.theme = t.dataset.themeSet;
  else if (t.dataset.densSet) t.dataset.densSet === 'compact' ? delete html.dataset.density : html.dataset.density = t.dataset.densSet;
  render();
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (!ov.kind || ov.kind === 'palette') command('palette'); return; }
  if (ov.kind) {
    if (e.key === 'Escape') { e.preventDefault(); return closeOv(); }
    if (e.key === 'Tab') return trap(e);
    if (ov.kind === 'palette') {
      const n = ov.items.length;
      if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && n) { e.preventDefault(); palHi((ov.i + (e.key === 'ArrowDown' ? 1 : -1) + n) % n); }
      else if (e.key === 'Enter') { e.preventDefault(); ov.items[ov.i]?.run(); }
      return;
    }
    const g = e.target.closest?.('.grip');
    if (g && e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); moveOrd(+g.dataset.i, e.key === 'ArrowUp' ? -1 : 1, true); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.drop')) { e.preventDefault(); e.target.click(); }
    return;
  }
  if (e.key === 'Enter' && e.target.dataset?.book) openBook(e.target.dataset.book);
  else if (e.key === 'Enter' && e.target.dataset?.series) goSeries(e.target.dataset.series);
});
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; render(); });
fromHash();
</script>
</body>
</html>
