<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex · Book settings (reference)</title>
<!--
  Reference implementation of Book settings (⚙, gap G8 in #16, screen "Book Settings" in #8), inside the book
  workspace chrome. Open directly in a browser. Uses ../tokens.css only; no build step.
  Any book in the Library catalogue opens with ?book=<id> (default Product Engineering), including the books shared
  with you (glass-orchard, paper-saints, lamplighter, wick-and-ember, moth-hour, salt-king). ?role=owner|write|comment|view
  previews the page as someone with that access (#80). Sections deep link with #book, #series, #writing, #citations,
  #rules, #letters, #layout, #sharing and #archive.
  Working: autosave, series membership and number with the copy-down confirm step (#10 decision 4), the style
  guide with the series guide beside it, citation style with live examples, publisher rules with their effect on
  References, permission letter details with a live letter, series-inherited publication settings (book values win),
  the layout template, pinned version and trim, Duplicate, Export source and Archive, and Sharing (#80): the owner,
  one row per person with a role menu and Remove, Add people by exact email with a debounced lookup (match, no
  match, already has access, already covered by the series), This book and Whole series lists for a book in a
  series, the read-only list for everyone else, who gains or loses the book in the move dialog, and the page
  read-only (View only / Comment only chip) or owner-only actions disabled (Editor) by role.
  The "Preview" panel bottom-left is a review aid, not part of the design: book, theme, density, View as
  (Owner / Editor / Commenter / Viewer) and sample addresses for Add people.
-->
<link rel="stylesheet" href="../tokens.css">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--color-bg); color: var(--color-text); font: var(--text-base)/var(--leading) var(--font-sans); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
svg { flex: none; }
a { color: inherit; }
.spacer { flex: 1; }
[hidden] { display: none !important; }
.dim-t { color: var(--color-muted); }

/* Shared controls (same as references.html and print.html) */
.btn { display: inline-flex; align-items: center; gap: 5px; height: var(--control-height); padding: 0 10px; border-radius: var(--radius-sm); border: 1px solid var(--color-border); background: var(--color-surface); font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--color-surface-2); }
.btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-fg); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--color-danger); border-color: color-mix(in srgb, var(--color-danger) 40%, var(--color-border)); }
.btn.danger:hover { background: color-mix(in srgb, var(--color-danger) 8%, var(--color-surface)); }
.btn.danger.solid { background: var(--color-danger); border-color: var(--color-danger); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--color-surface-2); }
.btn.sm { height: 24px; padding: 0 8px; font-size: var(--text-xs); }
.btn svg, .seg svg, .ib svg, .mini svg { width: 13px; height: 13px; }
.btn:focus-visible, .seg button:focus-visible, .ib:focus-visible, .mini:focus-visible, .tab:focus-visible, .nav a:focus-visible, .chipck:focus-within { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.seg { display: inline-flex; height: var(--control-height); border: 1px solid var(--color-border); border-radius: var(--radius-sm); overflow: hidden; background: var(--color-surface); flex: none; max-width: 100%; }
.seg button { display: inline-flex; align-items: center; gap: 5px; padding: 0 9px; border: 0; border-right: 1px solid var(--color-border); background: transparent; color: var(--color-muted); font-size: var(--text-sm); cursor: pointer; white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--color-accent-soft); color: var(--color-text); font-weight: var(--weight-semibold); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.seg.sm { height: 24px; }
.seg.sm button { padding: 0 8px; font-size: var(--text-xs); }
.overline { font-size: var(--text-2xs); font-weight: var(--weight-medium); color: var(--color-muted); text-transform: uppercase; letter-spacing: .02em; }
.ib { display: inline-grid; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: var(--radius-xs); background: transparent; color: var(--color-muted); cursor: pointer; flex: none; text-decoration: none; }
.ib:hover { background: var(--color-surface-2); color: var(--color-text); }
.ib[aria-current="page"] { background: var(--color-accent-soft); color: var(--color-accent); }
.mini { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; border: 0; border-radius: var(--radius-xs); background: none; color: var(--color-muted); font-size: var(--text-xs); font-weight: var(--weight-medium); cursor: pointer; white-space: nowrap; text-decoration: none; }
.mini:hover { background: var(--color-surface-2); color: var(--color-text); }
.mini.go { color: var(--color-accent); }
.mini svg { width: 11px; height: 11px; }
.badge { display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: color-mix(in srgb, var(--tone) 16%, transparent); color: var(--tone); font-size: var(--text-2xs); font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-xs); font-weight: var(--weight-medium); white-space: nowrap; }
.st i { width: 6px; height: 6px; border-radius: 50%; background: var(--tone); flex: none; }

/* Book header (#6 shared chrome). On this screen no tab is selected and ⚙ shows as current. */
.bookbar { height: var(--bar-height); flex: none; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-2); background: var(--color-surface); border-bottom: 1px solid var(--color-border); min-width: 0; }
.book-id { display: flex; align-items: center; gap: 7px; min-width: 0; padding-right: var(--space-2); border-right: 1px solid var(--color-border); height: 100%; }
.book-id .t { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
.book-id b { font-size: var(--text-sm); font-weight: var(--weight-semibold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
.book-id span { font-size: var(--text-2xs); color: var(--color-muted); white-space: nowrap; }
.cover { border-radius: 2px; box-shadow: 0 0 0 1px rgb(0 0 0 / .15); flex: none; aspect-ratio: 2 / 3; background: linear-gradient(160deg, var(--c1), var(--c2) 70%); }
.cover.thumb { width: 20px; }
.tabs { display: flex; align-items: center; height: 100%; }
.tab { position: relative; display: inline-flex; align-items: center; gap: 5px; height: 100%; padding: 0 10px; border: 0; background: none; color: var(--color-muted); font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer; text-decoration: none; white-space: nowrap; }
.tab:hover { color: var(--color-text); }
.tabs .vr { width: 1px; height: 16px; margin: 0 4px; background: var(--color-border); }
.sync { display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; }
.sync i { width: 6px; height: 6px; border-radius: 50%; background: var(--color-ok); }
.sync[data-s="unsaved"] i { background: var(--color-warn); }
.sync[data-s="saving"] i { background: var(--color-accent); animation: pulse .7s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: .25; } }
.avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--color-accent-soft); color: var(--color-accent); font-size: 10px; font-weight: 700; display: grid; place-items: center; flex: none; }

/* Settings page: section nav + one column of section cards */
.page { flex: 1; min-height: 0; overflow: auto; scroll-behavior: smooth; }
.wrap { display: grid; grid-template-columns: 196px minmax(0, 760px); gap: var(--space-5); justify-content: center; padding: var(--space-4) var(--space-4) 120px; }
.nav { position: sticky; top: var(--space-4); align-self: start; display: grid; gap: 1px; }
.nav h1 { margin: 0 0 var(--space-2) 8px; font-size: var(--text-lg); font-weight: var(--weight-semibold); }
.nav a { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 8px; border-radius: var(--radius-sm); color: var(--color-muted); font-size: var(--text-sm); font-weight: var(--weight-medium); text-decoration: none; white-space: nowrap; }
.nav a:hover { background: var(--color-surface-2); color: var(--color-text); }
.nav a[aria-current="true"] { background: var(--color-accent-soft); color: var(--color-text); font-weight: var(--weight-semibold); }
.nav a svg { width: 14px; height: 14px; }
.nav a .badge { margin-left: auto; }
.nav .foot { margin: var(--space-3) 8px 0; font-size: var(--text-xs); color: var(--color-muted); line-height: 1.45; }
.col { display: grid; gap: var(--space-4); min-width: 0; }

.card { scroll-margin-top: var(--space-4); border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-surface); min-width: 0; }
.card-h { display: flex; align-items: flex-start; gap: var(--space-2); padding: var(--space-3) var(--space-4) 0; }
.card-h > div { flex: 1; min-width: 0; }
.card-h h2 { margin: 0; font-size: var(--text-md); font-weight: var(--weight-semibold); }
.card-h p { margin: 2px 0 0; font-size: var(--text-xs); color: var(--color-muted); }
.card-b { padding: var(--space-2) var(--space-4) var(--space-4); }
.sub { scroll-margin-top: var(--space-4); margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--color-border); }
.sub-h { display: flex; align-items: center; gap: var(--space-2); margin-bottom: 6px; }
.sub-h h3 { margin: 0; font-size: var(--text-sm); font-weight: var(--weight-semibold); }
.sub-h .spacer + * { flex: none; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-accent) 45%, transparent); } 100% { box-shadow: 0 0 0 3px transparent; } }

/* Field rows: label column, control, help under the control */
.row { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 4px var(--space-3); align-items: start; padding: 7px 0; }
.row + .row { border-top: 1px dashed var(--color-border); }
.row > .lbl { display: flex; flex-wrap: wrap; align-items: center; align-content: center; gap: 2px 6px; min-height: var(--control-height); font-size: var(--text-sm); color: var(--color-muted); }
.row > .ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--space-2); min-width: 0; min-height: var(--control-height); }
.help { flex-basis: 100%; margin: 0; font-size: var(--text-xs); color: var(--color-muted); line-height: 1.45; }
.help b { color: var(--color-text); font-weight: var(--weight-medium); }
.input, .select { height: var(--control-height); min-width: 0; padding: 0 8px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-bg); font-size: var(--text-sm); }
.input:focus, .select:focus, .area:focus { outline: 2px solid var(--color-accent); outline-offset: -1px; border-color: transparent; }
.input.w-full { flex: 1 1 260px; }
.input.num { width: 104px; text-align: right; font-variant-numeric: tabular-nums; }
.input.yr { width: 80px; font-variant-numeric: tabular-nums; }
.select { padding-right: 4px; cursor: pointer; }
.area { width: 100%; min-height: 104px; padding: 7px 9px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-bg); font: var(--text-sm)/1.5 var(--font-sans); resize: vertical; }
.unit { font-size: var(--text-xs); color: var(--color-muted); }

/* Where a value comes from: the series (inherited) or this book (an override, with reset) */
.inh { display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 6px; border-radius: 9px; font-size: var(--text-2xs); font-weight: var(--weight-medium); white-space: nowrap; background: var(--color-surface-2); color: var(--color-muted); border: 0; cursor: default; }
.inh.own { background: var(--color-accent-soft); color: var(--color-accent); cursor: pointer; }
.inh.own:hover { text-decoration: line-through; }
.inh svg { width: 9px; height: 9px; }

/* Progress (words ÷ target, the Library tile bar) */
.prog { display: flex; align-items: center; gap: 8px; flex-basis: 100%; font-size: var(--text-xs); color: var(--color-muted); font-variant-numeric: tabular-nums; }
.prog > span:last-child { white-space: nowrap; }
.prog .bar { flex: 0 1 220px; height: 3px; border-radius: 2px; background: var(--color-surface-2); overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--color-accent); }

/* Status segmented control: dot + label */
.seg.status button i { width: 6px; height: 6px; border-radius: 50%; background: var(--tone); }

/* Cover */
.cover-ed { display: flex; align-items: flex-end; gap: var(--space-3); }
.cover.big { width: 64px; display: grid; place-items: end start; padding: 5px; color: rgb(255 255 255 / .85); font: 600 7px/1.2 var(--font-sans); }
.cover-ed .acts { display: flex; flex-wrap: wrap; gap: 6px; }

/* Notes, callouts and pending changes */
.note { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; padding: 8px 10px; border-radius: var(--radius-md); border: 1px solid color-mix(in srgb, var(--tone) 35%, var(--color-border)); background: color-mix(in srgb, var(--tone) 7%, var(--color-surface)); font-size: var(--text-xs); }
.note > svg { width: 14px; height: 14px; color: var(--tone); margin-top: 1px; }
.note b { font-weight: var(--weight-semibold); }
.note .acts { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.note ul { margin: 2px 0 0; padding-left: 16px; }

/* Series: who is in it and the numbers that follow */
.order { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; flex-basis: 100%; }
.order li { display: grid; grid-template-columns: 66px 20px minmax(0, 1fr) auto; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: var(--radius-sm); font-size: var(--text-sm); }
.order li .no { white-space: nowrap; font-size: var(--text-2xs); color: var(--color-muted); font-variant-numeric: tabular-nums; text-transform: uppercase; letter-spacing: .02em; }
.order li .cover { width: 14px; }
.order li .t { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.order li.me { background: var(--color-accent-soft); font-weight: var(--weight-semibold); }
.order li .chg { font-size: var(--text-2xs); color: var(--color-muted); font-variant-numeric: tabular-nums; }
.order li .chg b { color: var(--tone); font-weight: var(--weight-semibold); }

/* Read-only series guide beside the book's own */
.inherited { margin-top: 8px; padding: 8px 10px; border-left: 2px solid var(--color-border); background: var(--color-bg); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; font-size: var(--text-sm); color: var(--color-muted); line-height: 1.5; white-space: pre-line; }
.inherited .overline { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; white-space: normal; }

/* Citation examples */
.cites { flex-basis: 100%; display: grid; gap: 6px; padding: 9px 12px; border-radius: var(--radius-sm); background: var(--color-bg); }
.cites .k { font-size: var(--text-2xs); color: var(--color-muted); text-transform: uppercase; letter-spacing: .02em; }
.cites .c { font-size: var(--text-sm); line-height: 1.5; padding-left: 16px; text-indent: -16px; }
.cites .intext { font-size: var(--text-sm); }
.cites .intext sup { color: var(--color-ok); font-weight: var(--weight-semibold); font-size: .72em; }

/* Publisher rules: the limit and what it does to References right now */
.impact { flex-basis: 100%; display: grid; gap: 6px; padding: 8px 10px; border-radius: var(--radius-md); border: 1px solid color-mix(in srgb, var(--tone) 35%, var(--color-border)); background: color-mix(in srgb, var(--tone) 6%, var(--color-surface)); font-size: var(--text-xs); }
.impact > b { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--tone); }
.impact ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.impact li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.impact li .src { font-weight: var(--weight-medium); color: var(--color-text); }
.impact li .why { color: var(--color-muted); }
.impact li .arrow { color: var(--color-muted); }
.wbar { position: relative; flex-basis: 100%; height: 30px; margin: 2px 10px 0; }
.wbar .track { position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: var(--color-surface-2); }
.wbar .lim { position: absolute; top: 2px; bottom: 2px; width: 2px; margin-left: -1px; background: var(--color-text); border-radius: 1px; }
.wbar .dot { position: absolute; top: 6px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--tone); box-shadow: 0 0 0 2px var(--color-surface); }
.wbar .scale { position: absolute; top: 16px; font-size: var(--text-2xs); color: var(--color-muted); font-variant-numeric: tabular-nums; transform: translateX(-50%); }
.fixed { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); font-weight: var(--weight-medium); }

/* Permission letters: formats as check chips, then the letter as it will read */
.chipck { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px 0 7px; border: 1px solid var(--color-border); border-radius: 13px; background: var(--color-surface); font-size: var(--text-sm); cursor: pointer; user-select: none; }
.chipck input { margin: 0; accent-color: var(--color-accent); }
.chipck:has(input:checked) { background: var(--color-accent-soft); border-color: color-mix(in srgb, var(--color-accent) 40%, var(--color-border)); }
.letter { flex-basis: 100%; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--color-bg); border: 1px dashed var(--color-border); font-size: var(--text-sm); line-height: 1.55; }
.letter mark { background: color-mix(in srgb, var(--color-accent) 16%, transparent); color: inherit; border-radius: 2px; padding: 0 2px; }
.letter mark.miss { background: color-mix(in srgb, var(--color-warn) 18%, transparent); color: var(--color-warn); }

/* Layout template */
.tplcard { display: flex; align-items: center; gap: var(--space-3); flex-basis: 100%; padding: 8px 10px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); }
.tplcard > div { flex: 1; min-width: 0; }
.tplcard b { display: block; font-size: var(--text-sm); font-weight: var(--weight-semibold); }
.tplcard span { display: block; font-size: var(--text-xs); color: var(--color-muted); }
.pin { display: inline-flex !important; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
.pin svg { width: 10px; height: 10px; }
.tth { position: relative; width: 34px; height: 44px; border-radius: 2px; box-shadow: 0 0 0 1px rgb(0 0 0 / .12), 0 1px 3px rgb(0 0 0 / .15); overflow: hidden; flex: none; }
.tth.r { background: #f6efdd; }
.tth.r::before { content: ""; position: absolute; left: 4px; right: 4px; top: 5px; height: 3px; background: #58180d; }
.tth.r::after { content: ""; position: absolute; left: 4px; right: 4px; top: 10px; bottom: 5px; background: repeating-linear-gradient(#7a6a55 0 1px, transparent 1px 3px) left / 45% 100% no-repeat, repeating-linear-gradient(#7a6a55 0 1px, transparent 1px 3px) right / 45% 70% no-repeat; opacity: .8; }
.tth.n { background: #fbf8f1; }
.tth.n::before { content: ""; position: absolute; left: 10px; right: 10px; top: 11px; height: 2px; background: #3a3530; }
.tth.n::after { content: ""; position: absolute; left: 6px; right: 6px; top: 17px; bottom: 5px; background: repeating-linear-gradient(#8d857a 0 1px, transparent 1px 3px); opacity: .8; }
.tth.m { background: #fff; }
.tth.m::after { content: ""; position: absolute; left: 5px; right: 5px; top: 8px; bottom: 5px; background: repeating-linear-gradient(#555 0 1px, transparent 1px 5px); opacity: .7; }

/* Archive and other book-level actions */
.act-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px var(--space-3); align-items: center; padding: 9px 0; }
.act-row + .act-row { border-top: 1px dashed var(--color-border); }
.act-row b { display: block; font-size: var(--text-sm); font-weight: var(--weight-medium); }
.act-row span { display: block; font-size: var(--text-xs); color: var(--color-muted); }
.card.danger { border-color: color-mix(in srgb, var(--color-danger) 35%, var(--color-border)); }
.archived-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--space-3); padding: 7px var(--space-4); border-bottom: 1px solid color-mix(in srgb, var(--color-warn) 40%, var(--color-border)); background: color-mix(in srgb, var(--color-warn) 9%, var(--color-surface)); font-size: var(--text-xs); }
.archived-bar svg { width: 14px; height: 14px; color: var(--color-warn); }
.archived-bar .btn { margin-left: auto; }

/* Sharing (#80): the owner, then one row per person, then the exact-email lookup */
.people { list-style: none; margin: 0; padding: 0; display: grid; }
.person { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto auto; align-items: center; gap: 4px 10px; min-height: 42px; padding: 6px 0; }
.person + .person { border-top: 1px dashed var(--color-border); }
.person .avatar { width: 26px; height: 26px; background: var(--color-surface-2); color: var(--color-text); }
.person.me .avatar { background: var(--color-accent-soft); color: var(--color-accent); }
.person .who { min-width: 0; }
.person .who b { display: flex; align-items: center; gap: 6px; font-size: var(--text-sm); font-weight: var(--weight-medium); white-space: nowrap; }
.person .who b > span { overflow: hidden; text-overflow: ellipsis; }
.person .who b em { font-style: normal; font-weight: var(--weight-regular, 400); color: var(--color-muted); }
.person .who > span { display: block; font-size: var(--text-xs); color: var(--color-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person .select { height: 26px; font-size: var(--text-xs); }
.person .role-t { font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; }

const roleOf = u => u === OWNER_ID ? 'owner' : [grantOf(SH.book, u), S.series ? grantOf(SH.series[S.series], u) : 'none'].sort((a, b) => RANK[b] - RANK[a])[0];

function setViewer(r) {
  if (standIn) { SH.book.splice(SH.book.indexOf(standIn), 1); standIn = null; }

  const all = [...SH.book, ...(S.series ? SH.series[S.series] : [])];
  ME = all.find(g => roleOf(g.u) === ROLE)?.u;
  if (!ME) { ME = STAND_IN[ROLE]; standIn = { u: ME, role: ROLE }; SH.book.push(standIn); }   // nobody has that role here yet: preview with a stand-in grant

// ---------- Series ----------
// Numbers follow the order; picking a number puts the book there and the others move along (as in Series settings)
function orderFor(sid, n) {
  const others = SERIES[sid].books.filter(id => id !== BOOK_ID);
  const list = [...others]; list.splice(Math.min(n, list.length + 1) - 1, 0, BOOK_ID);
  return list;
}
function numOptions() {
  const sid = S.pending ? S.pending.series : S.series, cur = S.pending ? S.pending.n : S.n;
  const others = SERIES[sid].books.filter(id => id !== BOOK_ID);
  return Array.from({ length: others.length + 1 }, (_, i) => i + 1).map(n => {
    const at = others[n - 1];
    return `<option value="${n}" ${cur === n ? 'selected' : ''}>Book ${bookNo(n)}${n === others.length + 1 ? ' · last' : at && !BOOKS[at].hidden ? ` · before ${esc(BOOKS[at].title)}` : ''}</option>`;
  }).join('');
}
function orderHTML() {
  const sid = S.pending ? S.pending.series : S.series;
  if (!sid) return `<p class="help" style="margin-top:6px">Standalone. Pick a series to share its Knowledge base and settings with its other books.</p>`;
  const n = S.pending ? S.pending.n : S.n, list = orderFor(sid, n);
  const was = id => SERIES[sid].books.indexOf(id) + 1;
  // Books in someone else's series that aren't shared with you are left out (#80), but keep their numbers
  return `<ol class="order">${list.map((id, i) => {
    if (BOOKS[id].hidden) return '';
    const me = id === BOOK_ID, b = BOOKS[id], old = me ? (S.series === sid ? S.n : 0) : was(id), moved = old && old !== i + 1;
    const pubd = b.status === 'published' && !me;
    return `<li class="${me ? 'me' : ''}"><span class="no">Book ${bookNo(i + 1)}</span><span class="cover" style="--c1:${b.cover[0]};--c2:${b.cover[1]}"></span><span class="t">${esc(me ? S.title : b.title)}</span><span class="chg" style="--tone:${tone(pubd && moved ? 'warn' : 'accent')}">${me && !old ? '<b>joins</b>' : moved ? `was ${bookNo(old)}${pubd ? ' · <b>published</b>' : ''}` : ''}</span></li>`;
  }).join('')}</ol>`;
}
// Changing series is held until the confirm step, because it copies the Knowledge base down (#10)

  return `<div class="note" style="--tone:${tone('accent')};margin-top:6px">${I.info}<div><b>Not moved yet.</b> ${esc(S.title)} ${what}.${from && from.kb.entries ? ` Its links to ${esc(from.name)}’s Knowledge base are copied onto the book first.` : ''}</div>
    <div class="acts"><button class="btn sm primary" data-cmd="review-move">Review move…</button><button class="btn sm ghost" data-cmd="cancel-move">Cancel</button></div></div>`;
}
function moveDialog() {
  const p = S.pending, from = S.series && SERIES[S.series], to = p.series && SERIES[p.series];
  const fromPub = from ? SERIES_PUB[S.series] : null;
  const pubKeys = Object.keys(PUB_DEFAULT).filter(k => !(k in S.own));
  const shifts = to ? orderFor(p.series, p.n).map((id, i) => [id, SERIES[p.series].books.indexOf(id) + 1, i + 1]).filter(([id, a, b]) => id !== BOOK_ID && a !== b) : [];
  const leaveShifts = from && S.series !== p.series ? SERIES[S.series].books.filter(id => id !== BOOK_ID).map((id, i) => [id, SERIES[S.series].books.indexOf(id) + 1, i + 1]).filter(([, a, b]) => a !== b) : [];
  const allShifts = [...leaveShifts, ...shifts], pubShift = allShifts.some(([id]) => BOOKS[id].status === 'published');
  const step = (t, title, body, icon) => `<li><span class="ic" style="--tone:${tone(t)}">${icon || (t === 'warn' ? I.warn : I.check)}</span><div><b>${title}</b><span>${body}</span></div></li>`;

  if (from && from.kb.links) steps.push(step('accent', `Repoint ${from.kb.links} links to the copies`, 'Mentions, scene links, beat context, timeline notes and labels in this book, plus sources in References linked to a series entry.'));
  if (from && !to && pubKeys.length) steps.push(step('accent', 'Keep its publication settings', `${pubKeys.length} values it took from ${esc(from.name)} (${fmtPub('style', fromPub.style)}, ${fmtPub('proseWords', fromPub.proseWords)}…) are copied onto the book, so no source changes status.`));
  const keep = to ? Object.keys(PUB_DEFAULT).filter(k => JSON.stringify(pub(k)) !== JSON.stringify(SERIES_PUB[p.series][k])) : [];
  if (to && keep.length) steps.push(step('accent', `Keep ${keep.length} of its own publication settings`, `${keep.map(k => `${{ style: 'citation style', proseWords: 'quote limit', publisher: 'publisher', year: 'year', formats: 'formats', run: 'print run', rights: 'territory' }[k]} ${esc(fmtPub(k, pub(k)))}`).join(', ')} stay for this book only. The rest now come from ${esc(to.name)}.`));

  if (allShifts.length) steps.push(step(pubShift ? 'warn' : 'accent', 'Renumber the other books', allShifts.map(([id, a, b]) => `${esc(BOOKS[id].title)} ${bookNo(a)} → ${bookNo(b)}${BOOKS[id].status === 'published' ? ' (published)' : ''}`).join(' · ') + (pubShift ? '. A published book’s printed number won’t change; Codex shows the new one.' : '')));

  }

    if (lose.length) steps.push(step('warn', `${plural(lose.length, 'person', 'people')} with access to ${esc(from.name)} will no longer see this book`, `${nameList(lose.map(g => esc(USERS[g.u].name)))}. People you shared this book with directly keep their access.`, I.people));
  }

  $('#dlg').innerHTML = `<div class="dlg"><div class="dlg-h"><h2 id="dlgTitle">Move ${esc(S.title)}</h2><button class="ib" data-cmd="dlg-close" aria-label="Close">${I.x}</button></div>
    <div class="dlg-b">
      <div class="move"><div><span class="overline">From</span><b>${from ? `${esc(from.name)} · ${bookNo(S.n)}` : 'Standalone'}</b></div>${I.arrow}<div><span class="overline">To</span><b>${to ? `${esc(to.name)} · ${bookNo(p.n)}` : 'Standalone'}</b></div></div>
      <ul class="steps">${steps.join('')}</ul>
      ${from && from.kb.entries ? `<div class="note" style="--tone:${tone('warn')}">${I.warn}<div>Moving it back later won’t merge the copies into the series again. You’d see this book’s copies beside the series entries until you delete them.</div></div>` : ''}
    </div>
    <div class="dlg-f"><span class="hint">Runs in one transaction</span><button class="btn" data-cmd="dlg-close">Cancel</button><button class="btn primary" data-cmd="confirm-move">${to ? `Move to ${esc(to.name)}` : 'Make standalone'}</button></div></div>`;

}
function confirmMove() {
  const p = S.pending, from = S.series;

// Add people: one exact lookup per complete address, debounced (POST /api/books/{id}/sharing/lookup).
// Nothing is looked up or shown while the field isn't a whole address.
const LK = { book: { q: '', st: 'idle', u: null, role: 'view', seq: 0 }, series: { q: '', st: 'idle', u: null, role: 'view', seq: 0 } };
const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@.]{2,}$/;
const findUser = email => Object.keys(USERS).find(k => !USERS[k].disabled && USERS[k].email.toLowerCase() === email.trim().toLowerCase()) || null;

// ---------- Citations ----------
function cite(r, style) {
  const n = r.authors.split(' '), last = n.at(-2) === 'Brooks' ? 'Brooks' : n.at(-1), first = n.slice(0, n.indexOf(last)).join(' ');
  const t = esc(r.title), ed = r.edition ? `${r.edition} ed.` : '';
  if (style === 'chicago') return r.kind === 'book' ? `${last}, ${first}${last === 'Brooks' ? ', Jr' : ''}. <i>${t}</i>. ${ed} ${esc(r.publisher)}, ${r.year}.` : `${last}, ${first.replace(/\.$/, '')}. “${t}${/[?!]$/.test(r.title) ? '' : '.'}” ${esc(r.publisher)} (${r.year}).`;
  const ini = first.split(' ').map(x => x[0] + '.').join(' ');
  if (style === 'apa') return r.kind === 'book' ? `${last}, ${ini}${last === 'Brooks' ? ', Jr.' : ''} (${r.year}). <i>${t}</i> (${ed}). ${esc(r.publisher)}.` : `${last}, ${ini} (${r.year}). ${t} <i>${esc(r.publisher)}</i>.`;
  return r.kind === 'book' ? `${last}, ${ini.replace(/ /g, '')} (${r.year}) <i>${t}</i>. ${ed.replace('ed.', 'edn.')} ${esc(r.publisher)}.` : `${last}, ${ini.replace(/ /g, '')} (${r.year}) ‘${t}’, <i>${esc(r.publisher)}</i>.`;
}
function citesHTML() {
  const s = pub('style');
  const intext = s === 'chicago' ? `…makes it later.<sup>10</sup> <span class="dim-t">→ note: Brooks, <i>Mythical Man-Month</i>, 25.</span>` : `…makes it later (Brooks, 1995, p. 25).`;
  return `<span class="k">In the text</span><span class="intext">${intext}</span><span class="k">Bibliography</span><span class="c">${cite(EX.brooks, s)}</span><span class="c">${cite(EX.conway, s)}</span>`;
}

// ---------- Publisher rules: the effect on References, worked out live ----------
function riskCount() { if (BOOK_ID !== 'pe') return 0; const lim = pub('proseWords'); return RISKS.filter(r => r.kind !== 'quote' || r.words > lim).length; }
function impactHTML() {
  const lim = pub('proseWords');
  if (BOOK_ID !== 'pe') return `<p class="help">${S.series === 'ac' ? `${esc(SERIES.ac.name)}’s publisher allows 250 words. ` : ''}Every source in this book is rechecked when this changes; nothing is written, so changing it back undoes it.</p>`;
  const max = 400, pos = v => Math.min(100, v / max * 100);
  const atRisk = RISKS.filter(r => r.kind !== 'quote' || r.words > lim);
  const vel = RISKS[0], velRisk = vel.words > lim, base = pub('proseWords') === 300;
  const bar = `<div class="wbar" aria-hidden="true"><span class="track"></span>${QUOTED.map(([, t, w]) => `<span class="dot" style="left:${pos(w)}%;--tone:${tone(w > lim ? 'danger' : 'ok')}" title="${esc(t)}: ${w} words"></span>`).join('')}<span class="lim" style="left:${pos(lim)}%" title="Limit: ${lim} words"></span>${[0, 100, 200, 300, 400].map(v => `<span class="scale" style="left:${pos(v)}%">${v}</span>`).join('')}</div>`;
  return `<div class="impact" style="--tone:${tone(atRisk.length ? 'danger' : 'ok')}"><b>${atRisk.length ? `${atRisk.length} sources at copyright risk${atRisk.length ? ', blocking print export' : ''}` : 'No sources at risk'}</b>
    ${bar}
    <ul>
      <li><span class="st" style="--tone:${tone(velRisk ? 'danger' : 'warn')}"><i></i>${velRisk ? 'Copyright risk' : 'Needs check'}</span><span class="src">The Velocity Trap</span><span class="why">${vel.words} of ${lim} words quoted${velRisk ? '' : ' · within the limit, ready to sign off'}</span></li>
      ${RISKS.slice(1).map(r => `<li><span class="st" style="--tone:${tone('danger')}"><i></i>Copyright risk</span><span class="src">${r.t}</span><span class="why">${r.why}; not affected by the limit</span></li>`).join('')}
    </ul>
    <span class="dim-t">The longest quote from any other source is 41 words (Goodhart). ${base ? '' : 'Changing the limit back restores every status.'} <a class="mini go" style="margin-left:-6px" href="references.html${BQ}">Open References</a></span></div>`;
}

// ---------- Permission letters: the sentence References puts in every request ----------
function letterHTML() {
  const m = (v, miss) => v ? `<mark>${esc(v)}</mark>` : `<mark class="miss">${miss}</mark>`;
  const f = pub('formats').map(k => FORMATS[k].toLowerCase()), fl = f.length > 1 ? f.slice(0, -1).join(', ') + ' and ' + f.at(-1) : f[0];
  const by = pub('publisher') ? ` by ${m(pub('publisher'))}` : '';
  return `I am writing to ask permission to reproduce material from “<i>The Velocity Trap</i>” (Dana Whitlock, 2021) in my book “${esc(S.title)}”, to be published${by} in ${m(fl, 'no format chosen')} in ${m(String(pub('year') || ''), 'year')} (first print run ${m(pub('run') ? fmt(pub('run')) + ' copies' : '', 'print run')}, ${m(pub('rights').replace(/^World /, 'world ').replace(/^World,/, 'world,'))} rights).`;
}

// ---------- Layout ----------
function tplHTML() {
  const t = TPL[S.tpl];
  return `<span class="tth ${t.th}"></span><div><b>${esc(t.name)}</b><span>${esc(t.desc)}</span><span class="pin">${I.pin}Pinned to v${t.ver}${t.latest ? ` · v${t.latest} available, preview it in Layout` : ''}</span></div>`;
}
function trimHTML() {
  const t = TPL[S.tpl];
  if (!t.trims.includes(S.trim)) S.trim = t.trims[0];
  return `<div class="seg" role="group" aria-label="Trim size">${t.trims.map(v => `<button data-trim="${v}" aria-pressed="${S.trim === v}">${v}</button>`).join('')}</div><p class="help">Sizes ${esc(t.name)} supports. Bleed, crop marks and image quality are chosen for each export.</p>`;
}
function gateHTML() {
  const n = riskCount();
  if (BOOK_ID !== 'pe') return `<span class="st" style="--tone:${tone('ok')}"><i></i>Nothing blocks export</span><p class="help">Copyright risks in References and preflight issues in Layout block print export.</p>`;
  return n ? `<span class="st" style="--tone:${tone('danger')}"><i></i>${n} copyright risks block print export</span><a class="mini go" href="references.html${BQ}">Open References</a><p class="help">They come from References and the publisher rules above. Preflight in Layout checks the rest.</p>`
    : `<span class="st" style="--tone:${tone('ok')}"><i></i>No copyright risks</span><p class="help">Preflight in Layout checks images, directives and raw LaTeX.</p>`;
}

// ---------- Live updates (no re-render while typing) ----------
function refresh() {
  $('#cites').innerHTML = citesHTML();
  $('#impact').innerHTML = impactHTML();
  $('#letter').innerHTML = letterHTML();
  $('#gate').innerHTML = gateHTML();
  $('#guideHelp').innerHTML = guideHelp();
  const pct = Math.min(100, Math.round(S.words / Math.max(1, S.target) * 100));
  $('#prog').innerHTML = `<span class="bar"><i style="width:${pct}%"></i></span><span>${fmt(S.words)} of ${fmt(S.target || 0)} · ${pct}%</span>`;
  const wd = $('[data-cmd="words-default"]'); if (wd) wd.hidden = pub('proseWords') === 300;
  chrome();
}
// Re-draw the Series / This book chips after a value changes source, keeping focus where it is
function refreshInh() { $$('[data-inh]').forEach(w => w.innerHTML = inhInner(w.dataset.inh)); }
function setPub(k, v) { if (S.series && JSON.stringify(v) === JSON.stringify(sPub()[k])) delete S.own[k]; else S.own[k] = v; refreshInh(); refresh(); }

// ---------- Scroll spy and deep links ----------
function spy() {
  const page = $('#page'), top = page.getBoundingClientRect().top;
  let cur = 'book';
  $$('.card').forEach(c => { if (c.getBoundingClientRect().top - top < 140) cur = c.dataset.sec; });
  // At the bottom the last card wins, unless the deep-linked card (e.g. #sharing, one above it) is in view
  if (page.scrollTop + page.clientHeight >= page.scrollHeight - 4) {
    const hc = location.hash.length > 1 && document.getElementById(location.hash.slice(1))?.closest('.card');
    cur = hc && hc.getBoundingClientRect().bottom - top > 140 ? hc.dataset.sec : $$('.card').at(-1).dataset.sec;
  }
  $$('#nav a').forEach(a => a.setAttribute('aria-current', String(a.dataset.sec === cur)));
}
function flashEl(sel) { const e = $(sel); if (!e) return; e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); }
function goHash(smooth) {
  const id = location.hash.slice(1); if (!id || !document.getElementById(id)) return;
  const e = document.getElementById(id);
  $('#page').scrollTo({ top: e.offsetTop - ($('.nav').offsetHeight > 60 && innerWidth <= 860 ? 52 : 16), behavior: smooth ? 'smooth' : 'auto' });
  flashEl('#' + id);
  const f = e.querySelector('input, select'); if (id === 'rules' || id === 'letters') setTimeout(() => f?.focus({ preventScroll: true }), smooth ? 350 : 0);
}

// ---------- Dialog and toast ----------
let lastFocus = null;
function openDlg() { lastFocus = document.activeElement; $('#dlg').classList.add('open'); setTimeout(() => $('#dlg .btn.primary, #dlg .btn.danger.solid')?.focus(), 0); }
function closeDlg() { $('#dlg').classList.remove('open'); lastFocus?.focus?.(); }
let toastT;
function toast(html, extra) {
  const t = $('#toast');
  t.innerHTML = `<span>${html}</span>${extra || ''}`;
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 4800);
}
function archiveDialog() {
  $('#dlg').innerHTML = `<div class="dlg"><div class="dlg-h"><h2 id="dlgTitle">Archive ${esc(S.title)}?</h2><button class="ib" data-cmd="dlg-close" aria-label="Close">${I.x}</button></div>
    <div class="dlg-b"><p>It leaves Library and ⌘K. Its text, Knowledge base, References and exports are kept, and you can restore it from <b>Archived</b> in Library at any time.</p>
      ${S.series ? `<p class="dim-t" style="font-size:var(--text-xs)">${esc(SERIES[S.series].name)} keeps its number for it, so the other books aren’t renumbered.</p>` : ''}
      ${SH.book.length ? `<div class="note" style="--tone:${tone('warn')}">${I.people}<div>${nameList(SH.book.map(g => esc(USERS[g.u].name)))} ${SH.book.length === 1 ? 'loses' : 'lose'} access. Restoring the book doesn’t share it again.</div></div>` : ''}</div>
    <div class="dlg-f"><button class="btn" data-cmd="dlg-close">Cancel</button><button class="btn danger solid" data-cmd="confirm-archive">Archive book</button></div></div>`;
  openDlg();
}
function duplicateDialog() {
  $('#dlg').innerHTML = `<div class="dlg"><div class="dlg-h"><h2 id="dlgTitle">Duplicate book</h2><button class="ib" data-cmd="dlg-close" aria-label="Close">${I.x}</button></div>
    <div class="dlg-b"><div class="row" style="padding:0"><label class="lbl" for="dupT">Title</label><div class="ctl"><input class="input w-full" id="dupT" value="${esc(S.title)} (copy)"></div></div>
      <p class="dim-t" style="font-size:var(--text-xs)">Copies the structure, prose, beats, this book’s Knowledge base and labels, and these settings${S.series ? `. It stays in ${esc(SERIES[S.series].name)} as the last book` : ''}. References start empty: permission and sign-off cover one book’s print run.</p></div>
    <div class="dlg-f"><button class="btn" data-cmd="dlg-close">Cancel</button><button class="btn primary" data-cmd="confirm-dup">Duplicate</button></div></div>`;
  openDlg();
}

// ---------- Events ----------
document.addEventListener('click', e => {
  const t = e.target;
  if (t === $('#dlg')) return closeDlg();
  const c = t.closest('[data-cmd]')?.dataset.cmd;
  if (c === 'dlg-close') return closeDlg();
  if (c === 'review-move') return moveDialog();
  if (c === 'cancel-move') { S.pending = null; return render(); }
  if (c === 'confirm-move') return confirmMove();
  if (c === 'words-default') { setPub('proseWords', 300); $('#fWords').value = 300; save(); return; }
  if (c === 'archive') return archiveDialog();
  // Archiving removes the book's own grants (#80); Undo straight away puts them back, a later Restore doesn't
  if (c === 'confirm-archive') { closeDlg(); snapShare(); S.archived = true; SH.book = []; render(); save(); return toast(`${esc(S.title)} archived`, '<button data-cmd="archive-undo">Undo</button>'); }
  if (c === 'archive-undo') { S.archived = false; SH.book = JSON.parse(shareSnap).book; render(); save(); return $('#toast').classList.remove('show'); }
  if (c === 'share-add') return shareAdd(t.closest('[data-scope]').dataset.scope);
  if (c === 'unshare') return unshare(t.closest('[data-g]').dataset.g);
  if (c === 'share-undo') { const s = JSON.parse(shareSnap); SH.book = s.book; SH.series = s.series; drawShare(); save(); return $('#toast').classList.remove('show'); }
  if (t.closest('#roChip')) return toast(esc(roleChip(ROLE).why));
  const va = t.closest('[data-view-as]'); if (va) return viewAs(va.dataset.viewAs);
  if (c === 'restore') { S.archived = false; render(); save(); return toast(`${esc(S.title)} is back in Library`); }
  if (c === 'duplicate') return duplicateDialog();
  if (c === 'confirm-dup') { const tt = $('#dupT').value.trim() || S.title + ' (copy)'; closeDlg(); return toast(`Duplicating… <b>${esc(tt)}</b> opens on Plan when it’s ready`, `<a href="plan.html?book=new&title=${encodeURIComponent(tt)}">Open</a>`); }
  if (c === 'export-src') return toast(`Preparing ${esc(S.title)}.zip · you’ll be notified when it’s ready to download`);
  const st = t.closest('[data-status]'); if (st) { S.status = st.dataset.status; $$('[data-status]').forEach(b => b.setAttribute('aria-pressed', String(b === st))); save(); return; }
  const sy = t.closest('[data-style]'); if (sy) { setPub('style', sy.dataset.style); $$('[data-style]').forEach(b => b.setAttribute('aria-pressed', String(b === sy))); save(); return toast(`Citations now in ${STYLES[sy.dataset.style]} across References, the bibliography and print`); }
  const tr = t.closest('[data-trim]'); if (tr) { S.trim = tr.dataset.trim; $('#trimBox').innerHTML = trimHTML(); save(); return; }
  const rs = t.closest('[data-reset]'); if (rs) { const k = rs.dataset.reset, old = S.own[k]; delete S.own[k]; render(); save(); return toast(`Back to ${esc(SERIES[S.series].name)}’s ${fmtPub(k, sPub()[k])}`, `<button data-undo-own="${k}" data-v='${esc(JSON.stringify(old))}'>Undo</button>`); }
  const uo = t.closest('[data-undo-own]'); if (uo) { S.own[uo.dataset.undoOwn] = JSON.parse(uo.dataset.v); render(); save(); return $('#toast').classList.remove('show'); }
  const ts = t.closest('[data-toast]'); if (ts) return toast(esc(ts.dataset.toast));
  const nv = t.closest('#nav a'); if (nv) { e.preventDefault(); history.replaceState(null, '', '#' + nv.dataset.sec); return goHash(true); }
  const thm = t.closest('[data-theme-set]'); if (thm) { const h = document.documentElement; thm.dataset.themeSet === 'system' ? delete h.dataset.theme : h.dataset.theme = thm.dataset.themeSet; return aid(); }
  const den = t.closest('[data-density-set]'); if (den) { document.documentElement.dataset.density = den.dataset.densitySet; return aid(); }
});
// Typing: update the preview straight away, save 3s after the first edit and on blur
document.addEventListener('input', e => {
  const f = e.target.dataset?.f, v = e.target.value;
  if (e.target.dataset?.lookup) return lookupInput(e.target.dataset.lookup, v);
  if (e.target.dataset?.fmt) {
    const fm = $$('[data-fmt]').filter(x => x.checked).map(x => x.dataset.fmt);
    setPub('formats', fm); return save();
  }
  if (!f || ['series', 'n', 'tpl', 'rights'].includes(f)) return;
  if (f === 'title') { S.title = v; }
  else if (f === 'author') S.author = v;
  else if (f === 'target') S.target = Math.max(0, +v || 0);
  else if (f === 'guide') S.guide = v;
  else if (f === 'proseWords') setPub('proseWords', Math.max(0, +v || 0));
  else if (f === 'year') setPub('year', +v || '');
  else if (f === 'run') setPub('run', Math.max(0, +v || 0));
  else if (f === 'publisher') setPub('publisher', v);
  refresh(); dirty();
});
document.addEventListener('focusout', e => { if (e.target.dataset?.f && saveT) save(); });
document.addEventListener('change', e => {
  const f = e.target.dataset?.f, v = e.target.value;
  if (e.target.dataset?.grant) return shareRole(e.target.dataset.grant, v);
  if (e.target.dataset?.lkrole) { LK[e.target.dataset.lkrole].role = v; return; }
  if (f === 'series') {
    const sid = v || null;
    if (sid === S.series) S.pending = null;
    else S.pending = { series: sid, n: sid ? SERIES[sid].books.length + 1 - (SERIES[sid].books.includes(BOOK_ID) ? 1 : 0) : null };
    render(); return $('#fSeries').focus();
  }
  if (f === 'n') {
    const n = +v;
    if (S.pending) { S.pending.n = n; $('#orderBox').innerHTML = orderHTML(); $('#pendingBox').innerHTML = pendingHTML(); return; }
    const old = S.n; S.n = n; $('#orderBox').innerHTML = orderHTML(); chrome(); save();
    return toast(`${esc(S.title)} is now Book ${bookNo(n)} in ${esc(SERIES[S.series].name)}`, `<button data-undo-n="${old}">Undo</button>`);
  }
  if (f === 'tpl') { S.tpl = v; $('#tplcard').innerHTML = tplHTML(); $('#trimBox').innerHTML = trimHTML(); save(); return toast(`Layout set to ${esc(TPL[v].name)} v${TPL[v].ver} · ${S.trim}. Your text didn’t change.`); }
  if (f === 'rights') { setPub('rights', v); return save(); }
});
document.addEventListener('click', e => { const u = e.target.closest('[data-undo-n]'); if (!u) return; S.n = +u.dataset.undoN; render(); save(); $('#toast').classList.remove('show'); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#dlg').classList.contains('open')) return closeDlg();
  // Keep Tab inside an open dialog
  if (e.key === 'Tab' && $('#dlg').classList.contains('open')) {
    const f = $$('#dlg button, #dlg input, #dlg select').filter(x => !x.disabled); if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus(); }
    else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus(); }
  }
  if (e.key === 'Enter' && $('#dlg').classList.contains('open') && e.target.tagName === 'INPUT') { e.preventDefault(); $('#dlg .btn.primary')?.click(); }
  // Enter in Add people adds the person found, once the lookup has shown them
  if (e.key === 'Enter' && e.target.dataset?.lookup) { e.preventDefault(); $(`[data-cmd="share-add"][data-scope="${e.target.dataset.lookup}"]`)?.click(); }
});
$('#page').addEventListener('scroll', spy, { passive: true });
addEventListener('hashchange', () => goHash(true));

// ---------- Review aid ----------
function aid() {
  const h = document.documentElement;
  $$('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeSet === (h.dataset.theme || 'system')));
  $$('[data-density-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.densitySet === (h.dataset.density || 'compact')));
  // View as (#80): your own book as its owner, or as someone it's shared with. A book shared with you has no Owner.
  $('#viewAs').innerHTML = `<button disabled style="color:var(--color-muted)">View as</button>` + [['owner', 'Owner'], ['write', 'Editor'], ['comment', 'Commenter'], ['view', 'Viewer']]
    .filter(([k]) => k !== 'owner' || OWNER_ID === 'jd').map(([k, l]) => `<button data-view-as="${k}" aria-pressed="${ROLE === k}">${l}</button>`).join('');
  $('#tryEmail').hidden = !isOwner();
}
// A role other than the default goes in the URL (?role=owner|write|comment|view), so tab links keep it
const defaultRole = () => OWNER_ID === 'jd' ? 'owner' : roleOf('jd');
function viewAs(r) {
  setViewer(r);
  BQ = `?book=${encodeURIComponent(BOOK_ID)}${ROLE !== defaultRole() ? `&role=${ROLE}` : ''}`;
  history.replaceState(null, '', location.pathname + BQ + location.hash);
  render(); aid();
}
$('#bookPick').innerHTML = [['pe', 'Product Engineering (standalone, has References, shared with 3)'], ['players-guide', 'Players Guide (Forsaken Gods, one override, shared)'], ['hollow-throne', 'Hollow Throne (The Ashen Crown, not shared)'], ['northbound', 'Northbound (standalone)'], ['glass-orchard', 'Glass Orchard (Mara Lind’s, shared with you: view)'], ['wick-and-ember', 'Wick and Ember (Mara Lind’s series, shared with you: edit)'], ['salt-king', 'The Salt King (Kofi Mensah’s, one book of a series: comment)']].map(([k, l]) => `<option value="${k}" ${k === BOOK_ID ? 'selected' : ''}>${l}</option>`).join('');
$('#bookPick').addEventListener('change', e => { location.search = '?book=' + e.target.value; });
// Sample addresses for Add people: a match in any case, a near miss, a disabled account, someone on the series, you
$('#tryEmail').innerHTML = [['', 'Try an email…'], ['ana@example.com', 'ana@example.com (match)'], ['  ANA@Example.COM ', '  ANA@Example.COM  (case, spaces)'], ['ana@example.co', 'ana@example.co (near miss)'], ['ana@exam', 'ana@exam (incomplete)'], ['rhys@example.com', 'rhys@example.com (disabled)'], ['noor.haddad@example.com', 'noor.haddad@example.com (new)'], ['priya@raman.studio', 'priya@raman.studio (series editor)'], ['lee.fischer@example.com', 'lee.fischer@example.com (series viewer)'], ['joel@example.com', 'joel@example.com (you)']].map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
$('#tryEmail').addEventListener('change', e => {
  const v = e.target.value; e.target.value = ''; if (!v) return;
  const f = $('#addEmail-book'); if (!f) return;
  f.value = v; lookupInput('book', v);
  history.replaceState(null, '', location.pathname + location.search + '#sharing'); goHash(false);
});

// ---------- Boot ----------
setViewer(QS.get('role'));
BQ = `?book=${encodeURIComponent(BOOK_ID)}${ROLE !== defaultRole() ? `&role=${ROLE}` : ''}`;
aid(); render();
requestAnimationFrame(() => goHash(false));
</script>
