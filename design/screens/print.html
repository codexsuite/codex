<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex · Layout (reference)</title>
<!--
  Reference implementation of the Layout view (#13, screen 9 in #8): print preview, layout templates,
  preflight and Export for printer, inside the book workspace chrome. Open directly in a browser.
  Uses ../tokens.css for the UI. Always shows the Players Guide (book players-guide in the Forsaken Gods series); tab, Back and
  Open in Write links follow the "Moving between screens" rules (?book=, #scene=). Pages are paper-coloured in both themes and use the template's own fonts:
  like book covers, they are the book's artwork, not UI.
  Working: Quick preview (paginated in the browser from the same blocks the print build uses), Proof
  (a simulated chapter-only LaTeX render with a content-hash cache), scope (front matter, chapter, scene),
  the template picker (Fantasy RPG, Novel, Standard manuscript, and a user fork with no preview.css),
  template options that re-flow the pages live, version pinning with a previewed upgrade, effective DPI per
  image, raw-LaTeX flags, Preflight, the Export for printer dialog and a background export job that
  survives a reload. The "Preview" panel bottom-left is a review aid, not part of the design.
-->
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--color-bg); color: var(--color-text); font: var(--text-base)/var(--leading) var(--font-sans); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
svg { flex: none; }
a { color: inherit; }
.spacer { flex: 1; }
.dim-t { color: var(--color-muted); }

/* Shared controls (same as references.html) */
.btn { display: inline-flex; align-items: center; gap: 5px; height: var(--control-height); padding: 0 10px; border-radius: var(--radius-sm); border: 1px solid var(--color-border); background: var(--color-surface); font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--color-surface-2); }
.btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-fg); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.primary:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--color-surface-2); }
.btn.sm { height: 24px; padding: 0 8px; font-size: var(--text-xs); }
.btn svg, .seg svg, .ib svg, .mini svg, .sel svg { width: 13px; height: 13px; }
.btn:focus-visible, .seg button:focus-visible, .ib:focus-visible, .mini:focus-visible, .tab:focus-visible, .sel:focus-visible, .entry:focus-visible, .th:focus-visible, .pf-item:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.search { display: flex; align-items: center; gap: 6px; height: var(--control-height); width: 220px; max-width: 100%; padding: 0 var(--space-2); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); }
.search svg { width: 13px; height: 13px; color: var(--color-muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: 0; font-size: var(--text-sm); }
.search input::placeholder { color: var(--color-muted); }
.sel { display: inline-flex; align-items: center; gap: 4px; height: var(--control-height); padding: 0 var(--space-2); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); font-size: var(--text-sm); white-space: nowrap; cursor: pointer; min-width: 0; }
.sel:hover { background: var(--color-surface-2); }
.sel em { font-style: normal; color: var(--color-muted); }
.sel .t { overflow: hidden; text-overflow: ellipsis; }
.sel > svg:last-child { width: 11px; height: 11px; color: var(--color-muted); }
.sel .ver { font-size: var(--text-2xs); color: var(--color-muted); font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; height: var(--control-height); border: 1px solid var(--color-border); border-radius: var(--radius-sm); overflow: hidden; background: var(--color-surface); flex: none; }
.seg button { display: inline-flex; align-items: center; gap: 4px; padding: 0 9px; border: 0; border-right: 1px solid var(--color-border); background: transparent; color: var(--color-muted); font-size: var(--text-sm); cursor: pointer; font-variant-numeric: tabular-nums; white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--color-accent-soft); color: var(--color-text); font-weight: var(--weight-semibold); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.seg.sm { height: 24px; }
.seg.sm button { padding: 0 8px; font-size: var(--text-xs); }
.overline { font-size: var(--text-2xs); font-weight: var(--weight-medium); color: var(--color-muted); text-transform: uppercase; letter-spacing: .02em; }
.ib { display: inline-grid; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: var(--radius-xs); background: transparent; color: var(--color-muted); cursor: pointer; flex: none; }
.ib:hover { background: var(--color-surface-2); color: var(--color-text); }
.ib:disabled { opacity: .4; cursor: default; background: none; }
.cover.thumb { width: 20px; aspect-ratio: 2 / 3; border-radius: 2px; background: linear-gradient(160deg, #3c4e6d, #141d2e 70%); box-shadow: 0 0 0 1px rgb(0 0 0 / .15); flex: none; }
.mini { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; border: 0; border-radius: var(--radius-xs); background: none; color: var(--color-muted); font-size: var(--text-xs); font-weight: var(--weight-medium); cursor: pointer; white-space: nowrap; text-decoration: none; }
.mini:hover { background: var(--color-surface-2); color: var(--color-text); }
.mini.go { color: var(--color-accent); }
.mini svg { width: 11px; height: 11px; }
.badge { display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: color-mix(in srgb, var(--tone) 16%, transparent); color: var(--tone); font-size: var(--text-2xs); font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-xs); font-weight: var(--weight-medium); white-space: nowrap; }
.st i { width: 6px; height: 6px; border-radius: 50%; background: var(--tone); flex: none; }

/* Book header (#6 shared chrome, same as references.html) plus the Layout destination */
.bookbar { height: var(--bar-height); flex: none; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-2); background: var(--color-surface); border-bottom: 1px solid var(--color-border); min-width: 0; }
.book-id { display: flex; align-items: center; gap: 7px; min-width: 0; padding-right: var(--space-2); border-right: 1px solid var(--color-border); height: 100%; }
.book-id .t { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
.book-id b { font-size: var(--text-sm); font-weight: var(--weight-semibold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
.book-id span { font-size: var(--text-2xs); color: var(--color-muted); white-space: nowrap; }
.tabs { display: flex; align-items: center; height: 100%; }
.tab { position: relative; display: inline-flex; align-items: center; gap: 5px; height: 100%; padding: 0 10px; border: 0; background: none; color: var(--color-muted); font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer; text-decoration: none; white-space: nowrap; }
.tab:hover { color: var(--color-text); }
.tab[aria-selected="true"] { color: var(--color-text); font-weight: var(--weight-semibold); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--color-accent); }
.tabs .vr { width: 1px; height: 16px; margin: 0 4px; background: var(--color-border); }
.scope { display: flex; align-items: center; gap: var(--space-2); min-width: 0; font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.sync { display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; }
.sync i { width: 6px; height: 6px; border-radius: 50%; background: var(--color-ok); }
.avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--color-accent-soft); color: var(--color-accent); font-size: 10px; font-weight: 700; display: grid; place-items: center; flex: none; }

/* Workspace + Knowledge base sidebar (same as references.html; here a click finds where an entry prints) */
.ws { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); }
.ws.no-side { grid-template-columns: minmax(0, 1fr); }
.ws.no-side .side { display: none; }
.side { min-height: 0; display: flex; flex-direction: column; background: var(--color-surface); border-right: 1px solid var(--color-border); }
.side-h { padding: 10px var(--space-3) 0; font-size: var(--text-md); font-weight: var(--weight-semibold); }
.side-note { padding: 4px var(--space-3) 0; font-size: var(--text-xs); color: var(--color-muted); }
.side-tools { display: flex; gap: 6px; padding: var(--space-2); }
.side-tools .search { width: auto; flex: 1; }
.side-list { flex: 1; overflow: auto; padding: 0 var(--space-1) var(--space-3); }
.cat-h { display: flex; align-items: center; gap: 6px; padding: 10px 6px 4px; font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .04em; color: var(--color-muted); }
.cat-h i { width: 7px; height: 7px; border-radius: 2px; background: var(--cat); flex: none; }
.entry { width: 100%; display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 6px; border: 0; border-radius: var(--radius-sm); background: none; font-size: var(--text-sm); text-align: left; cursor: pointer; }
.entry:hover { background: var(--color-surface-2); }
.entry[aria-pressed="true"] { background: var(--color-accent-soft); font-weight: var(--weight-medium); }
.entry .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry .u { font-size: var(--text-2xs); color: var(--color-muted); font-variant-numeric: tabular-nums; }

/* Layout: toolbar */
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.toolbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--space-2); padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--color-border); }
.toolbar h1 { margin: 0 var(--space-2) 0 2px; font-size: var(--text-lg); font-weight: var(--weight-semibold); line-height: 1; white-space: nowrap; }
.toolbar .sel.tpl { max-width: 260px; }
.toolbar .sel.scope-sel { max-width: 280px; }

/* Body: page rail + canvas + panel */
.body { flex: 1; min-height: 0; display: grid; grid-template-columns: 112px minmax(0, 1fr) var(--panel-width); }
.body.no-panel { grid-template-columns: 112px minmax(0, 1fr); }
.body.no-panel .panel { display: none; }
.rail { min-height: 0; overflow: auto; padding: var(--space-2) 0 var(--space-5); border-right: 1px solid var(--color-border); background: var(--color-surface); }
.th { display: grid; justify-items: center; gap: 3px; width: 100%; padding: 5px 0; border: 0; background: none; cursor: pointer; }
.th .tf { position: relative; overflow: hidden; border-radius: 1px; box-shadow: 0 0 0 1px var(--color-border); }
.th .tf .pg { transform-origin: 0 0; pointer-events: none; }
.th span { font-size: var(--text-2xs); color: var(--color-muted); font-variant-numeric: tabular-nums; }
.th:hover .tf { box-shadow: 0 0 0 1px var(--color-muted); }
.th[aria-current="true"] .tf { box-shadow: 0 0 0 2px var(--color-accent); }
.th[aria-current="true"] span { color: var(--color-accent); font-weight: var(--weight-semibold); }
.th .fl { position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--color-warn); box-shadow: 0 0 0 1.5px var(--color-surface); }
.rail-h { padding: 2px 10px 4px; font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .04em; color: var(--color-muted); }

.stagewrap { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.cbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--space-2); min-height: 36px; padding: 4px var(--space-3); border-bottom: 1px solid var(--color-border); background: var(--color-surface); font-size: var(--text-xs); }
.live { display: inline-flex; align-items: center; gap: 6px; color: var(--color-muted); white-space: nowrap; }
.live i { width: 6px; height: 6px; border-radius: 50%; background: var(--color-ok); }
.live[data-s="busy"] i { background: var(--color-accent); animation: pulse .7s ease-in-out infinite alternate; }
.live[data-s="stale"] i { background: var(--color-warn); }
.live b { color: var(--color-text); font-weight: var(--weight-medium); }
@keyframes pulse { to { opacity: .25; } }
.pnav { display: inline-flex; align-items: center; gap: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pnav .n { min-width: 92px; text-align: center; }
.chk { display: inline-flex; align-items: center; gap: 5px; color: var(--color-muted); white-space: nowrap; cursor: pointer; }
.chk input { margin: 0; accent-color: var(--color-accent); }

/* Banners above the pages (proof, upgrade preview, house style hint) */
.banner { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px var(--space-3); padding: 6px var(--space-3); border-bottom: 1px solid color-mix(in srgb, var(--tone) 40%, var(--color-border)); background: color-mix(in srgb, var(--tone) 9%, var(--color-surface)); font-size: var(--text-xs); }
.banner > svg { width: 14px; height: 14px; color: var(--tone); }
.banner b { font-weight: var(--weight-semibold); }
.banner .m { color: var(--color-muted); }
.banner .acts { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; }

/* Canvas: pages sit on the app background, single or as spreads */
.canvas { position: relative; flex: 1; min-height: 0; overflow: auto; padding: var(--space-5) var(--space-4) 90px; }
.rows { display: flex; flex-direction: column; align-items: center; gap: 22px; width: max-content; min-width: 100%; }
.row { display: flex; align-items: flex-start; }
.row .ph { flex: none; }
.lbls { display: flex; justify-content: space-between; margin-top: 4px; font-size: var(--text-2xs); color: var(--color-muted); font-variant-numeric: tabular-nums; }
.frame { position: relative; flex: none; overflow: hidden; box-shadow: 0 0 0 1px rgb(0 0 0 / .08), 0 2px 10px -2px rgb(0 0 0 / .25); }
.row .frame + .frame::before { content: ""; position: absolute; z-index: 3; left: 0; top: 0; bottom: 0; width: 18px; background: linear-gradient(to right, rgb(0 0 0 / .12), transparent); pointer-events: none; }
.row .frame:first-child:not(:last-child)::after { content: ""; position: absolute; z-index: 3; right: 0; top: 0; bottom: 0; width: 18px; background: linear-gradient(to left, rgb(0 0 0 / .1), transparent); pointer-events: none; }
.frame > .pg { transform-origin: 0 0; }
.frame.cur { box-shadow: 0 0 0 1px rgb(0 0 0 / .08), 0 0 0 3px color-mix(in srgb, var(--color-accent) 35%, transparent), 0 2px 10px -2px rgb(0 0 0 / .25); }
.proofv .frame { box-shadow: 0 0 0 1px rgb(0 0 0 / .3), 0 6px 16px -4px rgb(0 0 0 / .45); }
.empty { max-width: 440px; margin: 60px auto; padding: var(--space-5); text-align: center; border: 1px dashed var(--color-border); border-radius: var(--radius-lg); background: var(--color-surface); }
.empty h2 { margin: 0 0 6px; font-size: var(--text-md); font-weight: var(--weight-semibold); }
.empty p { margin: 0 0 var(--space-3); font-size: var(--text-sm); color: var(--color-muted); }
.empty .acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.steps { list-style: none; margin: var(--space-3) auto 0; padding: 0; max-width: 280px; text-align: left; font-size: var(--text-sm); }
.steps li { display: flex; align-items: center; gap: 8px; padding: 3px 0; color: var(--color-muted); }
.steps li i { width: 14px; height: 14px; display: grid; place-items: center; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--color-border); flex: none; }
.steps li i svg { width: 9px; height: 9px; }
.steps li.done { color: var(--color-text); }
.steps li.done i { background: var(--color-ok); box-shadow: none; color: var(--color-accent-fg); }
.steps li.now { color: var(--color-text); font-weight: var(--weight-medium); }
.steps li.now i { box-shadow: inset 0 0 0 2px var(--color-accent); border-top-color: transparent; animation: spin 1s linear infinite; }
.steps li .k { margin-left: auto; font-size: var(--text-2xs); color: var(--color-muted); font-variant-numeric: tabular-nums; }
@keyframes spin { to { transform: rotate(360deg); } }
.bar { height: 4px; border-radius: 2px; background: var(--color-surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--color-accent); transition: width .3s; }

/* UI marks drawn over pages (never printed) */
#hov { position: fixed; z-index: 15; pointer-events: none; display: none; border: 1.5px solid var(--color-accent); border-radius: 2px; background: color-mix(in srgb, var(--color-accent) 5%, transparent); }
#hov span { position: absolute; left: -1.5px; bottom: 100%; margin-bottom: 2px; padding: 1px 6px; border-radius: 3px; background: var(--color-accent); color: var(--color-accent-fg); font: var(--weight-medium) var(--text-2xs)/1.5 var(--font-sans); white-space: nowrap; }
.ui-flag { position: absolute; z-index: 2; top: 4px; right: 4px; display: inline-flex; align-items: center; gap: 3px; padding: 1px 5px 1px 4px; border-radius: 3px; background: var(--color-warn); color: #fff; font: 600 8px/1.5 var(--font-sans); letter-spacing: .02em; white-space: nowrap; }
.ui-flag svg { width: 8px; height: 8px; }
.no-flags .ui-flag, .no-flags .ui-raw { display: none !important; }
.ui-raw { display: flex; align-items: center; gap: 4px; height: 15px; margin: 4px 0 !important; padding: 0 5px; border: 1px dashed color-mix(in srgb, var(--color-warn) 75%, transparent); border-radius: 2px; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--color-warn) 10%, transparent) 0 4px, transparent 4px 8px); color: #8a5310; font: 600 7.5px/1 var(--font-sans); text-indent: 0; white-space: nowrap; overflow: hidden; }
.cxhl { outline: 2px solid var(--color-accent); outline-offset: 2px; border-radius: 1px; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-accent) 55%, transparent); background-color: color-mix(in srgb, var(--color-accent) 12%, transparent); } 100% { box-shadow: 0 0 0 3px transparent; } }
.overset { outline: 1.5px dashed var(--color-danger); }
.proofv p.overfull { position: relative; }
.proofv p.overfull::after { content: ""; position: absolute; right: -8px; top: 3px; width: 5px; height: 9px; background: #000; }

/* ---------- Pages (template look-alikes; colours here are the book's, not the UI's) ---------- */
.pg { position: relative; overflow: hidden; background: var(--paper); color: #221d17; font-size: var(--fs); line-height: 1.32; text-rendering: optimizeLegibility; font-kerning: normal; }
.pg .pb { position: absolute; display: flex; flex-direction: column; }
.pg .span:empty { display: none; }
.pg .cols { flex: 1; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr); }
.pg .col { min-width: 0; min-height: 0; overflow: hidden; }
.pg .col > * { margin: 0 0 .55em; }
.pg p { margin: 0 !important; text-indent: 1.1em; text-align: justify; hyphens: auto; -webkit-hyphens: auto; }
.pg p.noind, .pg p.cont { text-indent: 0; }
.pg p.split { text-align-last: justify; }
.pg .col > p + :not(p) { margin-top: .55em; }
.pg figure { margin: 0; position: relative; }
.pg .art { position: relative; overflow: hidden; }
.pg .artsvg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pg figcaption { margin-top: 3px; font-size: .82em; font-style: italic; text-align: center; line-height: 1.25; }
.pg table { width: 100%; border-collapse: collapse; font-size: .86em; line-height: 1.25; }
.pg caption { text-align: left; font-weight: 700; padding-bottom: 2px; }
.pg th, .pg td { text-align: left; vertical-align: top; padding: 1.5px 4px; }
.pg h2, .pg h3, .pg h4 { margin: 0; break-after: avoid; }
.pg .folio, .pg .rhead { position: absolute; white-space: nowrap; }
.pg.full .fullart { position: absolute; inset: 0; }
.pg.full .fullart .artsvg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pg .dl b { font-weight: 700; }
.pg .dl p { text-indent: 0; }
.pg .sb-abil { display: grid; grid-template-columns: repeat(6, 1fr); text-align: center; font-size: .9em; line-height: 1.2; margin: 2px 0; }
.pg .sb-abil b { display: block; }

/* Fantasy RPG (5e style): parchment, two columns, red-brown heads, tinted boxes */
.s-rpg { font-family: "EB Garamond", Georgia, serif; }
.s-rpg h2 { font: 700 1.6em/1.1 "EB Garamond", serif; font-variant: small-caps; color: #58180d; border-bottom: 1.5px solid #c9ad6a; padding-bottom: 1px; margin-top: .5em !important; }
.s-rpg.v15 h2 { font-family: Cinzel, serif; font-variant: normal; font-size: 1.32em; letter-spacing: .01em; }
.s-rpg h3 { font: 700 1.28em/1.15 "EB Garamond", serif; font-variant: small-caps; color: #58180d; margin-top: .35em !important; }
.s-rpg .dropcap::first-letter { float: left; font: 700 3.5em/.8 Cinzel, serif; color: #58180d; margin: 3px 3px 0 0; }
.s-rpg.v15 .dropcap::first-letter { color: #8a5a12; }
.s-rpg caption { font: 700 1.1em/1.2 "EB Garamond", serif; font-variant: small-caps; color: #58180d; }
.s-rpg thead th { font-weight: 700; }
.s-rpg tbody tr:nth-child(odd) td { background: #e0e5c1; }
.s-rpg.v15 thead th { background: #58180d; color: #f6efdd; }
.s-rpg .readaloud { padding: 5px 8px; background: #ece2c6; border-left: 3px solid #4b3a2a; border-right: 3px solid #4b3a2a; }
.s-rpg .readaloud p { text-indent: 0; }
.s-rpg .sidebar { padding: 6px 8px; background: #e0e5c1; border-top: 2px solid #231f1a; border-bottom: 2px solid #231f1a; box-shadow: 0 2px 4px rgb(0 0 0 / .18); }
.s-rpg .sidebar h4, .s-rpg .dndcomment h4 { font: 700 1.15em/1.2 "EB Garamond", serif; font-variant: small-caps; margin-bottom: 2px; }
.s-rpg .sidebar p + p { text-indent: 1em; }
.s-rpg .dndcomment { padding: 6px 8px; background: #d9ccaa; border-radius: 4px; box-shadow: inset 0 0 0 1px #b8a77e; font-style: italic; }
.s-rpg .dndcomment p { text-indent: 0; }
.s-rpg .spell h4 { font: 700 1.3em/1.15 "EB Garamond", serif; font-variant: small-caps; color: #58180d; }
.s-rpg .spell .school { font-style: italic; margin-bottom: 3px; }
.s-rpg .spell .ln { text-indent: 0; text-align: left; }
.s-rpg .spell .ln + p:not(.ln) { margin-top: 3px !important; }
.s-rpg .statblock { padding: 5px 8px 6px; background: #fdf1dc; border-top: 3px solid #e69a28; border-bottom: 3px solid #e69a28; box-shadow: 0 0 5px rgb(0 0 0 / .22); }
.s-rpg .statblock h4 { font: 700 1.55em/1.1 Cinzel, serif; color: #58180d; }
.s-rpg .statblock .ty { font-style: italic; }
.s-rpg .statblock .rule { height: 4px; margin: 4px 0; background: #9c2b1b; clip-path: polygon(0 0, 100% 50%, 0 100%); }
.s-rpg .statblock .ln { text-indent: 0; text-align: left; color: #58180d; }
.s-rpg .statblock .ln b { color: #58180d; }
.s-rpg .statblock .sb-abil { color: #58180d; }
.s-rpg .statblock .acts { font: 1.25em/1.2 "EB Garamond", serif; font-variant: small-caps; color: #58180d; border-bottom: 1px solid #58180d; margin: 5px 0 3px; }
.s-rpg .statblock p:not(.ln) { text-indent: 0; }
.s-rpg .folio { bottom: 26px; display: flex; align-items: baseline; gap: 8px; font: 600 9px/1 "EB Garamond", serif; font-variant: small-caps; color: #58180d; letter-spacing: .03em; }
.s-rpg .folio b { font: 700 11px/1 "EB Garamond", serif; color: #231f1a; }
.s-rpg .chead { margin-bottom: 14px; text-align: center; }
.s-rpg .chead .num { font: 600 10px/1 Cinzel, serif; letter-spacing: .25em; color: #8a6d3b; }
.s-rpg .chead .ttl { font: 700 30px/1.1 Cinzel, serif; color: #58180d; margin-top: 6px; }
.s-rpg .chead::after { content: ""; display: block; height: 3px; width: 60%; margin: 10px auto 0; background: #c9ad6a; clip-path: polygon(0 50%, 50% 0, 100% 50%, 50% 100%); }
.opener .band { position: absolute; left: 0; right: 0; bottom: 0; padding: 60px 48px 54px; background: linear-gradient(transparent, rgb(8 10 18 / .82)); color: #f6efdd; }
.opener .band .num { font: 600 12px/1 Cinzel, serif; letter-spacing: .3em; opacity: .85; }
.opener .band .ttl { font: 700 42px/1.05 Cinzel, serif; margin-top: 8px; }
.opener .band .cap { font: italic 11px/1.3 "EB Garamond", serif; margin-top: 10px; opacity: .8; }
.pg.full .fcap { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 40px 26px; background: linear-gradient(transparent, rgb(8 10 18 / .7)); color: #f6efdd; font: italic 11px/1.3 "EB Garamond", serif; text-align: center; }

/* Novel (memoir class look): cream, one column, running heads, sunk chapter titles */
.s-novel { font-family: "EB Garamond", Georgia, serif; color: #1b1a18; line-height: 1.36; }
.s-novel h2 { font: 500 1.05em/1.3 "EB Garamond", serif; font-variant: small-caps; letter-spacing: .06em; text-align: center; margin: .9em 0 .5em !important; }
.s-novel h3 { font: italic 400 1em/1.3 "EB Garamond", serif; margin-top: .5em !important; }
.s-novel .dropcap::first-letter { float: left; font: 400 3.1em/.82 "EB Garamond", serif; margin: 2px 4px 0 0; }
.s-novel caption { font-style: italic; font-weight: 400; text-align: center; }
.s-novel table { border-top: 1px solid #1b1a18; border-bottom: 1px solid #1b1a18; }
.s-novel thead th { border-bottom: .5px solid #1b1a18; font-weight: 600; }
.s-novel .readaloud { margin-left: 1.4em !important; margin-right: 1.4em !important; font-style: italic; }
.s-novel .readaloud p { text-indent: 0; }
.s-novel .sidebar, .s-novel .statblock, .s-novel .spell { padding: 5px 8px; border: .5px solid #1b1a18; }
.s-novel .sidebar h4, .s-novel .statblock h4, .s-novel .spell h4 { font: 600 1em/1.3 "EB Garamond", serif; font-variant: small-caps; letter-spacing: .04em; }
.s-novel .spell .school, .s-novel .statblock .ty { font-style: italic; }
.s-novel .ln { text-indent: 0; text-align: left; }
.s-novel .statblock .rule { height: .5px; margin: 3px 0; background: #1b1a18; }
.s-novel .statblock .acts { font-variant: small-caps; margin-top: 3px; }
.s-novel .statblock p, .s-novel .spell p { text-indent: 0; }
.s-novel .chead { padding-top: 92px; margin-bottom: 30px; text-align: center; }
.s-novel .chead .num { font-size: 9px; letter-spacing: .3em; text-transform: uppercase; }
.s-novel .chead .ttl { font: italic 22px/1.2 "EB Garamond", serif; margin-top: 8px; }
.s-novel .rhead { top: 34px; font-size: 8px; letter-spacing: .18em; text-transform: uppercase; }
.s-novel .folio { bottom: 30px; font-size: 9.5px; }
.s-novel .dndcomment { font-style: italic; }

/* Standard manuscript (Shunn): Courier, double-spaced, plain */
.s-ms { font-family: "Courier Prime", "Courier New", monospace; color: #000; line-height: 2; }
.s-ms.times { font-family: "Times New Roman", Times, serif; }
.s-ms p { text-indent: 36px; text-align: left; hyphens: manual; -webkit-hyphens: manual; }
.s-ms p.split { text-align-last: auto; }
.s-ms .col > * { margin-bottom: 0; }
.s-ms h2 { font: 700 1em/2 inherit; font-family: inherit; }
.s-ms h3 { font: italic 400 1em/2 inherit; font-family: inherit; }
.s-ms caption { font-weight: 400; text-decoration: underline; }
.s-ms table { font-size: 1em; line-height: 2; }
.s-ms thead th { font-weight: 400; text-decoration: underline; }
.s-ms .readaloud, .s-ms .sidebar, .s-ms .spell, .s-ms .statblock { margin-left: 36px !important; }
.s-ms .readaloud p, .s-ms .sidebar p, .s-ms .spell p, .s-ms .statblock p { text-indent: 0; }
.s-ms h4 { font: inherit; font-weight: 700; }
.s-ms .school, .s-ms .ty { font-style: italic; }
.s-ms .rule { display: none; }
.s-ms .acts { text-decoration: underline; }
.s-ms .figph { text-indent: 0; text-align: center; }
.s-ms .chead { padding-top: 170px; margin-bottom: 24px; text-align: center; }
.s-ms .chead .ttl { text-transform: uppercase; }
.s-ms .rhead { top: 36px; font-size: 12px; }

/* House style: Quick preview for a template without preview.css */
.s-house { font-family: Georgia, "Times New Roman", serif; color: #222; }
.s-house h2 { font: 600 1.35em/1.2 var(--font-sans); color: #333; margin-top: .5em !important; }
.s-house h3 { font: 600 1.1em/1.2 var(--font-sans); color: #444; margin-top: .3em !important; }
.s-house h4 { font: 600 1.05em/1.2 var(--font-sans); }
.s-house caption { font: 600 .95em/1.2 var(--font-sans); }
.s-house thead th { border-bottom: 1px solid #999; }
.s-house tbody tr:nth-child(odd) td { background: #f0f0f0; }
.s-house .readaloud, .s-house .sidebar, .s-house .spell, .s-house .statblock, .s-house .dndcomment { padding: 5px 8px; border: 1px solid #bbb; background: #f6f6f6; }
.s-house .readaloud p, .s-house .sidebar p, .s-house .spell p, .s-house .statblock p { text-indent: 0; }
.s-house .school, .s-house .ty { font-style: italic; }
.s-house .rule { height: 1px; margin: 3px 0; background: #bbb; }
.s-house .acts { font-weight: 600; margin-top: 3px; }
.s-house .chead { margin-bottom: 14px; }
.s-house .chead .num { font: 600 9px/1 var(--font-sans); letter-spacing: .1em; text-transform: uppercase; color: #777; }
.s-house .chead .ttl { font: 600 26px/1.1 var(--font-sans); color: #333; margin-top: 4px; }
.s-house .folio { bottom: 28px; font: 9px/1 var(--font-sans); color: #777; }
.s-house .opener .band .num, .s-house .opener .band .ttl { font-family: var(--font-sans); }

/* Front matter */
.pg .front { position: absolute; display: flex; flex-direction: column; }
.pg .tp-c { text-align: center; }
.toc { list-style: none; margin: 0; padding: 0; }
.toc li { display: flex; align-items: baseline; gap: 4px; padding: 2px 0; }
.toc li .d { flex: 1; border-bottom: 1px dotted currentColor; opacity: .5; transform: translateY(-3px); }

/* Panel */
.panel { min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--color-border); background: var(--color-surface); }
.ptabs { flex: none; display: flex; align-items: center; height: 36px; padding: 0 var(--space-2); border-bottom: 1px solid var(--color-border); }
.ptabs .tab { height: 100%; }
.ptabs .p-close { margin-left: auto; display: none; }
.pbody { flex: 1; min-height: 0; overflow: auto; }
.sec { padding: var(--space-3); border-bottom: 1px solid var(--color-border); }
.sec:last-child { border-bottom: 0; }
.sec-h { display: flex; align-items: center; gap: 6px; margin-bottom: var(--space-2); }
.sec-h h3 { margin: 0; flex: 1; font-size: var(--text-sm); font-weight: var(--weight-semibold); }
.sec-h .k { font-size: var(--text-xs); color: var(--color-muted); font-variant-numeric: tabular-nums; }
.note { font-size: var(--text-xs); color: var(--color-muted); margin: var(--space-2) 0 0; }
.note button { padding: 0; border: 0; background: none; color: var(--color-accent); font-size: inherit; cursor: pointer; }

/* Template card */
.tcard { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 2px 10px; align-items: start; }
.tcard .tth { grid-row: span 3; }
.tcard b { font-size: var(--text-md); font-weight: var(--weight-semibold); line-height: 1.25; }
.tcard .m { grid-column: 2; font-size: var(--text-xs); color: var(--color-muted); }
.tcard .btn { grid-column: 3; grid-row: 1; }
.pin { display: inline-flex; align-items: center; gap: 3px; height: 17px; padding: 0 6px; border-radius: 9px; background: var(--color-surface-2); font-size: var(--text-2xs); font-weight: var(--weight-medium); color: var(--color-text); font-variant-numeric: tabular-nums; }
.pin svg { width: 10px; height: 10px; color: var(--color-muted); }
.upg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: var(--space-2); padding: 7px 9px; border: 1px solid color-mix(in srgb, var(--color-info) 40%, var(--color-border)); border-radius: var(--radius-md); background: color-mix(in srgb, var(--color-info) 7%, var(--color-surface)); font-size: var(--text-xs); }
.upg > svg { width: 13px; height: 13px; color: var(--color-info); }
.upg .t { flex: 1; min-width: 160px; }
.upg ul { flex-basis: 100%; margin: 2px 0 0; padding-left: 20px; color: var(--color-muted); }
.hint { display: flex; gap: 7px; margin-top: var(--space-2); padding: 7px 9px; border-radius: var(--radius-md); background: color-mix(in srgb, var(--color-warn) 8%, var(--color-surface)); border: 1px solid color-mix(in srgb, var(--color-warn) 40%, var(--color-border)); font-size: var(--text-xs); }
.hint svg { width: 13px; height: 13px; color: var(--color-warn); margin-top: 1px; }

/* Template thumbnails (picker + card): a tiny page in the template's look */
.tth { position: relative; width: 44px; height: 57px; border-radius: 2px; box-shadow: 0 0 0 1px rgb(0 0 0 / .12), 0 1px 3px rgb(0 0 0 / .15); overflow: hidden; flex: none; }
.tth.r { background: #f6efdd; }
.tth.r::before { content: ""; position: absolute; left: 5px; right: 5px; top: 6px; height: 3px; background: #58180d; }
.tth.r::after { content: ""; position: absolute; left: 5px; right: 5px; top: 12px; bottom: 6px; background: repeating-linear-gradient(#7a6a55 0 1px, transparent 1px 3px) left / 45% 100% no-repeat, repeating-linear-gradient(#7a6a55 0 1px, transparent 1px 3px) right / 45% 70% no-repeat, linear-gradient(#e0e5c1, #e0e5c1) right bottom / 45% 22% no-repeat; opacity: .8; }
.tth.n { background: #fbf8f1; }
.tth.n::before { content: ""; position: absolute; left: 13px; right: 13px; top: 15px; height: 2px; background: #3a3530; }
.tth.n::after { content: ""; position: absolute; left: 8px; right: 8px; top: 22px; bottom: 7px; background: repeating-linear-gradient(#8d857a 0 1px, transparent 1px 3px); opacity: .8; }
.tth.m { background: #fff; }
.tth.m::before { content: ""; position: absolute; right: 5px; top: 4px; width: 14px; height: 1.5px; background: #333; }
.tth.m::after { content: ""; position: absolute; left: 7px; right: 7px; top: 10px; bottom: 7px; background: repeating-linear-gradient(#555 0 1px, transparent 1px 5px); opacity: .7; }
.tth.h { background: #fff; }
.tth.h::before { content: ""; position: absolute; left: 5px; right: 5px; top: 6px; height: 3px; background: #999; }
.tth.h::after { content: ""; position: absolute; left: 5px; right: 5px; top: 12px; bottom: 6px; background: repeating-linear-gradient(#aaa 0 1px, transparent 1px 3px) left / 45% 100% no-repeat, repeating-linear-gradient(#aaa 0 1px, transparent 1px 3px) right / 45% 100% no-repeat; }

/* Options form (from the template's options schema) */
.fields { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 6px 10px; align-items: center; font-size: var(--text-sm); }
.fields > label { font-size: var(--text-xs); color: var(--color-muted); }
.fields .seg { justify-self: start; max-width: 100%; }
.fields .changed { color: var(--color-text); font-weight: var(--weight-medium); }
.fields .changed::after { content: " •"; color: var(--color-accent); }

/* Package files */
.files { list-style: none; margin: 0; padding: 0; font-size: var(--text-xs); }
.files li { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr); gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--color-border); }
.files li:last-child { border-bottom: 0; }
.files code { font-family: var(--font-mono); font-size: var(--text-2xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.files span { color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.files li.missing code { color: var(--color-warn); text-decoration: line-through; }

/* Preflight */
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; padding: 9px 10px; border-radius: var(--radius-md); border: 1px solid color-mix(in srgb, var(--tone) 40%, var(--color-border)); background: color-mix(in srgb, var(--tone) 8%, var(--color-surface)); }
.verdict > svg { width: 16px; height: 16px; color: var(--tone); margin-top: 1px; }
.verdict b { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--tone); }
.verdict p { margin: 0; grid-column: 2; font-size: var(--text-xs); color: var(--color-muted); }
.pf-g { margin: var(--space-3) 0 4px; font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .04em; color: var(--color-muted); display: flex; align-items: center; gap: 6px; }
.pf-g i { width: 6px; height: 6px; border-radius: 50%; background: var(--tone); }
.pf-item { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 0 8px; padding: 7px 0; border-bottom: 1px dashed var(--color-border); font-size: var(--text-sm); }
.pf-item:last-child { border-bottom: 0; }
.pf-item .ic { display: grid; place-items: center; width: 16px; height: 16px; margin-top: 1px; border-radius: 50%; background: color-mix(in srgb, var(--tone) 16%, transparent); color: var(--tone); }
.pf-item .ic svg { width: 10px; height: 10px; }
.pf-item b { font-weight: var(--weight-medium); }
.pf-item .d { display: block; font-size: var(--text-xs); color: var(--color-muted); }
.pf-item .loc { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin: 3px 0 0 -6px; }
.pf-item .loc .where { padding: 0 6px; font-size: var(--text-2xs); color: var(--color-muted); font-variant-numeric: tabular-nums; }
.dpi { font-variant-numeric: tabular-nums; font-weight: var(--weight-semibold); color: var(--tone); }

/* Exports */
.job { padding: 10px; border: 1px solid color-mix(in srgb, var(--color-accent) 40%, var(--color-border)); border-radius: var(--radius-md); background: color-mix(in srgb, var(--color-accent) 5%, var(--color-surface)); }
.job-h { display: flex; align-items: center; gap: 6px; }
.job-h b { flex: 1; font-size: var(--text-sm); font-weight: var(--weight-semibold); }
.job .m { margin: 2px 0 8px; font-size: var(--text-xs); color: var(--color-muted); }
.job .steps { margin: 8px 0 0; max-width: none; font-size: var(--text-xs); }
.xrow { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 2px 8px; align-items: start; padding: 8px 0; border-bottom: 1px dashed var(--color-border); font-size: var(--text-sm); }
.xrow:last-child { border-bottom: 0; }
.xrow > svg { width: 15px; height: 15px; color: var(--tone); margin-top: 1px; }
.xrow b { font-weight: var(--weight-medium); }
.xrow .m { grid-column: 2; font-size: var(--text-xs); color: var(--color-muted); }
.xrow .err { grid-column: 2 / 4; margin-top: 3px; padding: 5px 7px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--color-danger) 8%, var(--color-bg)); font: var(--text-2xs)/1.45 var(--font-mono); color: var(--color-danger); overflow-wrap: anywhere; }
.xrow .acts { grid-column: 3; grid-row: 1 / 3; display: flex; gap: 2px; }

/* Popover menu / picker (same as references.html) */
#pop { position: fixed; z-index: 40; width: 236px; max-height: min(460px, calc(100vh - 16px)); display: none; flex-direction: column; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-raised), 0 12px 32px -12px rgb(0 0 0 / .35); overflow: hidden; }
#pop.open { display: flex; }
#pop.wide { width: 300px; }
#pop.xwide { width: 380px; max-width: calc(100vw - 16px); }
#pop .plist { overflow: auto; padding: 4px; }
#pop .item { width: 100%; display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 8px; border: 0; border-radius: var(--radius-sm); background: none; font-size: var(--text-sm); text-align: left; cursor: pointer; }
#pop .item:hover, #pop .item.on { background: var(--color-accent-soft); }
#pop .item:disabled { cursor: default; background: none; color: var(--color-muted); }
#pop .item.sub { padding-left: 22px; font-size: var(--text-xs); min-height: 24px; }
#pop .item .k { margin-left: auto; font-size: var(--text-2xs); color: var(--color-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
#pop .item .ck { margin-left: auto; color: var(--color-accent); }
#pop .item .ck svg { width: 13px; height: 13px; }
#pop .item.tall { align-items: flex-start; padding: 7px 8px; }
#pop .item.tall > span:not(.ck) { flex: 1; min-width: 0; }
#pop .item.tall b { display: block; font-weight: var(--weight-medium); }
#pop .item.tall small { display: block; font-size: var(--text-xs); color: var(--color-muted); line-height: 1.35; }
#pop .item svg { width: 13px; height: 13px; }
#pop .sep { height: 1px; margin: 4px 0; background: var(--color-border); }
#pop .grp { padding: 8px 8px 2px; font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .04em; color: var(--color-muted); }
#pop .form { padding: 10px 12px; display: grid; gap: 8px; font-size: var(--text-sm); overflow: auto; }
#pop .form h4 { margin: 0; font-size: var(--text-md); font-weight: var(--weight-semibold); }
#pop .form .ov { margin-bottom: -4px; }
#pop .form p { margin: 0; font-size: var(--text-xs); color: var(--color-muted); }
#pop .form .acts { display: flex; flex-wrap: wrap; gap: 6px; }
#pop .kv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 3px 8px; font-size: var(--text-xs); }
#pop .kv span:nth-child(odd) { color: var(--color-muted); }
#pop .kv b { font-weight: var(--weight-medium); }

/* Export dialog */
#dlg { position: fixed; inset: 0; z-index: 45; display: none; place-items: center; padding: var(--space-4); background: rgb(10 14 24 / .45); }
#dlg.open { display: grid; }
.dlg { width: min(560px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-raised), 0 24px 60px -20px rgb(0 0 0 / .5); overflow: hidden; }
.dlg-h { display: flex; align-items: center; gap: 8px; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); }
.dlg-h h2 { margin: 0; flex: 1; font-size: var(--text-md); font-weight: var(--weight-semibold); }
.dlg-b { padding: var(--space-4); overflow: auto; display: grid; gap: var(--space-3); }
.dlg-f { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: var(--space-3) var(--space-4); border-top: 1px solid var(--color-border); background: var(--color-bg); }

/* Toast */
#toast { position: fixed; left: 50%; bottom: 16px; z-index: 50; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none; display: flex; align-items: center; gap: var(--space-3); max-width: calc(100vw - 32px); padding: 7px 8px 7px 12px; border-radius: var(--radius-md); background: var(--color-text); color: var(--color-bg); font-size: var(--text-sm); box-shadow: var(--shadow-raised); transition: .18s; }

// ---------- Export job (survives a reload) ----------
const XSTEPS = [['Preflight', 1], ['Assemble 10 chapters', 1], ['pandoc and Lua filters', 2], ['Tectonic, pass 1 of 2', 3], ['Tectonic, pass 2 of 2', 2], ['Place 231 images at their print size', 3], ['Store the PDF', 1]];
const XTOTAL = XSTEPS.reduce((t, s) => t + s[1], 0) * 1000;
const jobProgress = () => S.job ? Math.min(1, (Date.now() - S.job.start) / XTOTAL) : 0;
function jobStep() { let t = (Date.now() - S.job.start) / 1000; for (let i = 0; i < XSTEPS.length; i++) { if (t < XSTEPS[i][1]) return i; t -= XSTEPS[i][1]; } return XSTEPS.length; }
const store = { get() { try { return JSON.parse(localStorage.getItem('codex-print-job')); } catch { return null; } }, set(v) { try { v ? localStorage.setItem('codex-print-job', JSON.stringify(v)) : localStorage.removeItem('codex-print-job'); } catch {} } };
let jobTimer;
function runJob() {
  clearInterval(jobTimer);
  jobTimer = setInterval(() => {
    if (!S.job) return clearInterval(jobTimer);
    if (jobProgress() >= 1) {
      const s = S.job.s; S.job = null; store.set(null); clearInterval(jobTimer);
      const size = s.q === 'print' ? (s.bleed === 'None' ? '208 MB' : '214 MB') : '61 MB';

      chrome(); toast(`Export ready · ${BOOK.title}.pdf · ${size}`, `<button data-ptab="exports">Show</button>`);

}

  const t = e.target;
  if (popCtx && !pop.contains(t) && !t.closest('[data-cmd="scope"],[data-cmd="tpl"],[data-cmd="trim"],[data-cmd="zoom"]')) closePop();
  if (t === $('#dlg')) { $('#dlg').classList.remove('open'); return; }
  const c = t.closest('[data-cmd]')?.dataset.cmd;
  const r = t.closest('button, a, [data-cmd]')?.getBoundingClientRect();
  if (c === 'scope') return popCtx?.kind === 'scope' ? closePop() : scopeMenu(r);
  if (c === 'tpl') return popCtx?.kind === 'tpl' ? closePop() : tplMenu(r);
  if (c === 'trim') return popCtx?.kind === 'trim' ? closePop() : trimMenu(r);
  if (c === 'zoom') return popCtx?.kind === 'zoom' ? closePop() : zoomMenu(r);
  if (c === 'export') { closePop(); X.trim = trim(); return exportDialog(); }
  if (c === 'dlg-close') return $('#dlg').classList.remove('open');
  if (c === 'dlg-preflight') { $('#dlg').classList.remove('open'); S.ptab = 'preflight'; S.panel = true; return chrome(); }
  if (c === 'queue') {
    $('#dlg').classList.remove('open');
    S.job = { start: Date.now(), s: { tpl: S.tpl, ver: S.ver[S.tpl], trim: X.trim, bleed: X.bleed, crop: X.crop && X.bleed !== 'None', q: X.q, draft: X.draft && preflight().some(x => x.sev === 'danger') } };
    store.set(S.job); runJob(); S.ptab = 'exports'; S.panel = innerWidth > 980 || S.panel; chrome();
    return toast('Export queued. It runs in the background; you can leave this page.');
  }
  if (c === 'cancel-job') { S.job = null; store.set(null); clearInterval(jobTimer); chrome(); return toast('Export cancelled'); }
  if (c === 'render-proof') return renderProof();
  if (c === 'cancel-proof') { S.rendering = null; return render(); }
  if (c === 'show-old') { const last = lastProofFor(proofChapter()); if (last) { S.proofs[proofKey()] = { ...last[1], stale: true }; render(); toast('Showing the previous proof. It doesn’t include the latest changes.'); } return; }
  if (c === 'prev') return goPage(curIdx - 1);
  if (c === 'next') return goPage(curIdx + 1);
  if (c === 'panel') { S.panel = !S.panel; return chrome(); }
  if (c === 'upg-preview') { S.upgradePreview = true; return render(); }
  if (c === 'upg-cancel') { S.upgradePreview = false; render(); return toast(`Still pinned to v${S.ver[S.tpl]}`); }
  if (c === 'upg-apply') { const old = S.ver[S.tpl]; S.ver[S.tpl] = T().latest; S.upgradePreview = false; render(); return toast(`${esc(T().short)} upgraded to v${S.ver[S.tpl]} for this book. Other books stay on their version.`, `<button data-cmd="upg-undo" data-old="${old}">Undo</button>`); }
  if (c === 'upg-undo') { S.ver[S.tpl] = t.closest('[data-old]').dataset.old; render(); return toast(`Back on v${S.ver[S.tpl]}`); }
  if (c === 'reset-opts') { S.opts[S.tpl] = { ...T().def }; return render(); }
  if (c === 'fork') { closePop(); return toast(`Forking makes an editable copy of ${esc(T().short)} v${S.ver[S.tpl]} under Yours. Your fork is shown as Forsaken RPG.`, `<button data-tpl="fork">Use it</button>`); }
  if (c === 'convert-raw') { closePop(); S.rawConverted = true; render(); return toast('Converted to a :::aside{title="Playtest note"} block. It now prints with every template.', '<button data-cmd="unconvert">Undo</button>'); }
  if (c === 'unconvert') { S.rawConverted = false; return render(); }
  if (c === 'place-page') { const id = t.closest('[data-img]').dataset.img; S.place[id] = placement(id) === 'column' ? 'page' : 'column'; render(); return toast(`${esc(IMAGES[id].name)} now placed at ${S.place[id] === 'page' ? 'full page' : 'column width'} · ${dpi(id)} dpi`); }
  if (c === 'sim-edit') return simEdit();
  const d = t.closest('[data-scope]'); if (d) { closePop(); if (d.hasAttribute('data-nocontent')) return toast('Only Chapters 3 and 4 have text in this reference'); S.scope = d.dataset.scope; S.showOld = false; render(); $('#canvas').scrollTop = 0; return; }
  const tp = t.closest('[data-tpl]'); if (tp) return setTemplate(tp.dataset.tpl);
  const tr = t.closest('[data-trim]'); if (tr && !tr.disabled) { closePop(); S.trim[S.tpl] = tr.dataset.trim; return render(); }
  const z = t.closest('[data-zoom]'); if (z) { closePop(); S.zoom = z.dataset.zoom; return layout(); }
  const m = t.closest('[data-mode]'); if (m) { S.mode = m.dataset.mode; S.showOld = false; return render(); }
  const v = t.closest('[data-view]'); if (v) { S.view = v.dataset.view; layout(); return chrome(); }
  const pt = t.closest('[data-ptab]'); if (pt) { S.ptab = pt.dataset.ptab; S.panel = true; $('#toast').classList.remove('show'); return chrome(); }
  const op = t.closest('[data-opt]'); if (op) { const f = T().schema.find(x => x.k === op.dataset.opt); S.opts[S.tpl][f.k] = f.o.find(x => String(x) === op.dataset.v); return render(); }
  const sp = t.closest('[data-setplace]'); if (sp) { S.place[sp.dataset.setplace] = sp.dataset.v; closePop(); return render(); }
  const xo = t.closest('[data-x]'); if (xo && xo.tagName === 'BUTTON') { const k = xo.dataset.x; X[k] = k === 'crop' ? xo.dataset.v === 'true' : xo.dataset.v; if (k === 'bleed' && X.bleed === 'None') X.crop = false; return exportDialog(); }
  if (xo && xo.type === 'checkbox') { X.draft = xo.checked; return exportDialog(); }
  const rr = t.closest('[data-rerun]'); if (rr) { const x = S.exports.find(y => y.id === rr.dataset.rerun); Object.assign(X, { trim: x.trim, bleed: x.bleed, crop: x.crop, q: x.q }); toast(`Settings from ${x.at} loaded${x.ver !== S.ver[x.tpl] ? `. That export used v${x.ver}; this one uses the pinned v${S.ver[x.tpl]}` : ''}`); return exportDialog(); }
  const opr = t.closest('[data-open-proof]'); if (opr) { S.scope = opr.dataset.openProof; S.mode = 'proof'; return render(); }
  const sh = t.closest('[data-show]'); if (sh) { const id = sh.dataset.show; const go = () => { const e = $(`#rows [data-b="${id}"]`); if (!e) return toast('Not on these pages'); const f = e.closest('.frame'); $('#canvas').scrollTo({ top: f.offsetTop - 16, behavior: 'smooth' }); e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); }; const ch = sh.dataset.src ? 'ch' + sh.dataset.src.split('.')[0] : null; if (!$(`#rows [data-b="${id}"]`) && ch) { S.scope = ch; S.mode = 'quick'; render(); } if (innerWidth <= 980) { S.panel = false; chrome(); } return setTimeout(go, 60); }
  const cx = t.closest('[data-cx]'); if (cx && (cx.classList.contains('entry') || cx.tagName === 'BUTTON')) { closePop(); S.cx = S.cx === cx.dataset.cx ? null : cx.dataset.cx; if (!S.side && S.cx) S.side = true; renderSide(); chrome(); return highlightCx(); }
  const th = t.closest('[data-goto]'); if (th) return goPage(+th.dataset.goto);
  const ts = t.closest('[data-toast]'); if (ts) { closePop(); return toast(esc(ts.dataset.toast)); }
  const thm = t.closest('[data-theme-set]'); if (thm) { const h = document.documentElement; thm.dataset.themeSet === 'system' ? delete h.dataset.theme : h.dataset.theme = thm.dataset.themeSet; return aid(); }
  const den = t.closest('[data-density-set]'); if (den) { document.documentElement.dataset.density = den.dataset.densitySet; aid(); return layout(); }
  if (t.closest('#sideToggle')) { S.side = !S.side; chrome(); return layout(); }
  // A block on a page
  const blk = t.closest('#rows .pg [data-b]');
  if (blk) return blockMenu(blk, blk.getBoundingClientRect());
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#dlg').classList.contains('open')) return $('#dlg').classList.remove('open'); closePop(); }
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'PageDown' || (e.key === 'ArrowRight' && e.altKey)) { e.preventDefault(); goPage(curIdx + 1); }
  if (e.key === 'PageUp' || (e.key === 'ArrowLeft' && e.altKey)) { e.preventDefault(); goPage(curIdx - 1); }
});
$('#flagsChk').addEventListener('change', e => { S.flags = e.target.checked; $('#canvas').classList.toggle('no-flags', !S.flags); buildRail(); });
$('#sideQ').addEventListener('input', e => { S.sideQ = e.target.value; renderSide(); });
$('#canvas').addEventListener('scroll', () => { onScroll(); $('#hov').style.display = 'none'; }, { passive: true });
// Hover: outline the block and say which scene it comes from
$('#canvas').addEventListener('mousemove', e => {
  const b = e.target.closest('.pg [data-b]'), hov = $('#hov');
  if (!b || popCtx) { hov.style.display = 'none'; return; }
  const r = b.getBoundingClientRect();
  Object.assign(hov.style, { display: 'block', left: r.left - 3 + 'px', top: r.top - 3 + 'px', width: r.width + 6 + 'px', height: r.height + 6 + 'px' });
  hov.firstElementChild.textContent = `Ch ${b.dataset.src.replace('.', ' · Sc ')} · ${SCENES[b.dataset.src]}`;
});
$('#canvas').addEventListener('mouseleave', () => { $('#hov').style.display = 'none'; });
let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (PAGES.length) layout(); }, 120); });
function aid() {
  const h = document.documentElement;
  $$('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeSet === (h.dataset.theme || 'system')));
  $$('[data-density-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.densitySet === (h.dataset.density || 'compact')));
}
setInterval(() => { if (!S.updating && !S.rendering) { const l = $('#live b'); if (l) chrome(); } }, 15000);

// ---------- Boot ----------
aid(); renderSide();
S.updatedAt = Date.now();
const saved = store.get(); if (saved && saved.start) { S.job = saved; runJob(); S.ptab = 'exports'; }
render();
document.fonts?.ready.then(() => render());
</script>
