<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex · Write (reference)</title>
<!--
  Reference implementation of the Write screen (#6) inside the book workspace chrome.
  Open directly in a browser. Uses ../tokens.css only; no build step.
  Working: drag beats and Codex additions within a scene or into any scene in any chapter,
  continuous manuscript editing with simulated websocket autosave, "/" command menu,
  "@" Codex mentions, Scene Beat blocks (length, + Context, prompt template and model, streamed
  AI draft with Apply / Retry / Discard), Codex Addition blocks, chapter references by ch:slug (#4),
  source reference markers (#2), the scene gutter (summary shared with Plan), the minimap,
  scope selector, Format and Focus, the Knowledge base entry panel, and deep links
  (?book=, #scene=5.2, #chapter=5, #scene=4.1&ref=velocity, #kb=, #entry=, and the return from
  References' Add source: #scene=7.1&sel=…&cite=…&title=…).
  Your access (#80): ?role=owner|write|comment|view, or the Preview panel's Role control, opens the book as someone with
  that role. Below write the manuscript, beats, gutters, chapter titles and the entry panel are read-only, buttons that
  change things are hidden, and the bookbar shows a quiet View only / Comment only chip in place of the save status
  (click it, or hover, for why typing does nothing). Books shared with you (?book=glass-orchard, paper-saints,
  lamplighter, wick-and-ember, moth-hour, salt-king) open at your role. Switching role while the tab is open shows the
  toast an AccessChanged event would.
  The "Preview" panel bottom-right is a review aid, not part of the design.
-->
<link rel="stylesheet" href="../tokens.css">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--color-bg); color: var(--color-text); font: var(--text-base)/var(--leading) var(--font-sans); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
button, input { font: inherit; color: inherit; }
svg { flex: none; }
.spacer { flex: 1; }
.dim-t { color: var(--color-muted); }

/* Shared controls (same as plan.html) */
.btn { display: inline-flex; align-items: center; gap: 5px; height: var(--control-height); padding: 0 10px; border-radius: var(--radius-sm); border: 1px solid var(--color-border); background: var(--color-surface); font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--color-surface-2); }
.btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-fg); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--color-surface-2); }
.btn.ghost[aria-pressed="true"] { background: var(--color-accent-soft); }
.btn svg, .seg svg, .ib svg, .mini svg, .split svg { width: 13px; height: 13px; }
.btn:focus-visible, .seg button:focus-visible, .ib:focus-visible, .mini:focus-visible, .grip:focus-visible, .tab:focus-visible, .search:focus-within, .entry:focus-visible, .split > button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.search { display: flex; align-items: center; gap: 6px; height: var(--control-height); width: 200px; max-width: 100%; padding: 0 var(--space-2); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); }
.search svg { width: 13px; height: 13px; color: var(--color-muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: 0; font-size: var(--text-sm); }
.search input::placeholder { color: var(--color-muted); }
.search .cnt { font-size: var(--text-2xs); color: var(--color-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sel { display: inline-flex; align-items: center; gap: 4px; height: var(--control-height); padding: 0 var(--space-2); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); font-size: var(--text-sm); white-space: nowrap; cursor: pointer; min-width: 0; }
.sel em { font-style: normal; color: var(--color-muted); }
.sel svg { width: 11px; height: 11px; color: var(--color-muted); }
.sel .t { overflow: hidden; text-overflow: ellipsis; }
.seg { display: inline-flex; height: var(--control-height); border: 1px solid var(--color-border); border-radius: var(--radius-sm); overflow: hidden; background: var(--color-surface); }
.seg button { display: inline-flex; align-items: center; gap: 4px; padding: 0 9px; border: 0; border-right: 1px solid var(--color-border); background: transparent; color: var(--color-muted); font-size: var(--text-sm); cursor: pointer; font-variant-numeric: tabular-nums; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--color-accent-soft); color: var(--color-text); font-weight: var(--weight-semibold); }
.overline { font-size: var(--text-2xs); font-weight: var(--weight-medium); color: var(--color-muted); text-transform: uppercase; letter-spacing: .02em; }
.ib { display: inline-grid; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: var(--radius-xs); background: transparent; color: var(--color-muted); cursor: pointer; }
.ib:hover { background: var(--color-surface-2); color: var(--color-text); }
.cover.thumb { width: 20px; aspect-ratio: 2 / 3; border-radius: 2px; background: linear-gradient(160deg, #05070d, #0d1a2b); box-shadow: 0 0 0 1px rgb(0 0 0 / .15); flex: none; }
.mini { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; border: 0; border-radius: var(--radius-xs); background: none; color: var(--color-muted); font-size: var(--text-xs); font-weight: var(--weight-medium); cursor: pointer; white-space: nowrap; }
.mini:hover { background: var(--color-surface-2); color: var(--color-text); }
.mini svg { width: 11px; height: 11px; }
.split { display: inline-flex; height: var(--control-height); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); overflow: hidden; min-width: 0; }
.split > button { display: inline-flex; align-items: center; gap: 5px; padding: 0 8px; border: 0; border-right: 1px solid var(--color-border); background: none; font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer; color: var(--color-text); white-space: nowrap; min-width: 0; }
.split > button:last-child { border-right: 0; }
.split > button:hover { background: var(--color-surface-2); }
.split > button.primary { background: var(--color-accent); color: var(--color-accent-fg); border-color: color-mix(in srgb, var(--color-accent-fg) 25%, var(--color-accent)); }
.split > button.primary:hover { filter: brightness(1.07); }
.split .t { overflow: hidden; text-overflow: ellipsis; color: var(--color-muted); font-weight: var(--weight-regular); }

/* Book header (#6 shared chrome, same as plan.html) */
.bookbar { height: var(--bar-height); flex: none; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-2); background: var(--color-surface); border-bottom: 1px solid var(--color-border); min-width: 0; transition: opacity .2s; }
.book-id { display: flex; align-items: center; gap: 7px; min-width: 0; padding-right: var(--space-2); border-right: 1px solid var(--color-border); height: 100%; }
.book-id .t { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
.book-id b { font-size: var(--text-sm); font-weight: var(--weight-semibold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
.book-id span { font-size: var(--text-2xs); color: var(--color-muted); white-space: nowrap; }
.tabs { display: flex; align-items: center; height: 100%; }
.tab { position: relative; display: inline-flex; align-items: center; gap: 5px; height: 100%; padding: 0 10px; border: 0; background: none; color: var(--color-muted); font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer; text-decoration: none; white-space: nowrap; }
.tab:hover { color: var(--color-text); }
.tab[aria-selected="true"] { color: var(--color-text); font-weight: var(--weight-semibold); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--color-accent); }
.tabs .vr { width: 1px; height: 16px; margin: 0 4px; background: var(--color-border); }
.badge { display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: color-mix(in srgb, var(--tone) 16%, transparent); color: var(--tone); font-size: var(--text-2xs); font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; }
a.btn { color: var(--color-text); text-decoration: none; }
.scope { display: flex; align-items: center; gap: var(--space-2); min-width: 0; font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.scope .sel { max-width: 240px; }
.sync { display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; }
.sync i { width: 6px; height: 6px; border-radius: 50%; background: var(--color-ok); }
.sync[data-s="editing"] i { background: var(--color-warn); }
.sync[data-s="saving"] i { background: var(--color-accent); animation: pulse .7s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: .25; } }
.avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--color-accent-soft); color: var(--color-accent); font-size: 10px; font-weight: 700; display: grid; place-items: center; flex: none; }

/* Workspace */
.ws { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); }
.ws.no-side { grid-template-columns: minmax(0, 1fr); }
.ws.no-side .side { display: none; }
.ws.has-panel { grid-template-columns: var(--sidebar-width) minmax(0, 1fr) var(--panel-width); }
.ws.no-side.has-panel { grid-template-columns: minmax(0, 1fr) var(--panel-width); }
.ws:not(.has-panel) .kbp { display: none; }

/* Knowledge base entry panel (G9): same look as the References detail panel; Plan builds the same one */
.kbp { min-height: 0; overflow: auto; border-left: 1px solid var(--color-border); background: var(--color-surface); }
.p-h { position: sticky; top: 0; z-index: 3; padding: var(--space-3) var(--space-3) var(--space-2); background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
.p-top { display: flex; align-items: center; gap: 6px; }
.p-top .dot { width: 7px; height: 7px; }
.p-h h2 { flex: 1; min-width: 0; margin: 0; padding: 1px 4px; font-size: var(--text-md); font-weight: var(--weight-semibold); line-height: 1.3; border-radius: var(--radius-xs); outline: 0; overflow-wrap: anywhere; }
.p-h h2:hover { background: color-mix(in srgb, var(--color-surface-2) 60%, transparent); }
.p-h h2:focus { background: var(--color-bg); box-shadow: 0 0 0 2px var(--color-accent); }
.p-h h2:empty::before { content: attr(data-placeholder); color: var(--color-muted); font-weight: var(--weight-regular); }
.p-h .by { margin: 2px 0 0 17px; font-size: var(--text-xs); color: var(--color-muted); font-variant-numeric: tabular-nums; }
.sec { padding: var(--space-3); border-bottom: 1px solid var(--color-border); }
.sec:last-child { border-bottom: 0; }
.sec-h { display: flex; align-items: center; gap: 6px; margin-bottom: var(--space-2); }
.sec-h h3 { margin: 0; flex: 1; font-size: var(--text-sm); font-weight: var(--weight-semibold); }
.sec-h .k { font-size: var(--text-xs); color: var(--color-muted); font-variant-numeric: tabular-nums; }
.fields { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px 10px; align-items: center; font-size: var(--text-sm); }
.fields > label { font-size: var(--text-xs); color: var(--color-muted); }
.fields > label.top { align-self: start; padding-top: 5px; }
.fld { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-width: 0; }
.fld input, .fld textarea, .fld select { min-width: 0; padding: 0 7px; border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; color: inherit; font: inherit; font-size: var(--text-sm); }
.fld input { flex: 1; height: 24px; min-width: 80px; }
.fld select { height: 26px; border-color: var(--color-border); background: var(--color-surface); cursor: pointer; }
.fld textarea { flex: 1; width: 100%; min-height: 64px; padding: 4px 7px; line-height: var(--leading); resize: vertical; }
.fld input:hover, .fld textarea:hover { border-color: var(--color-border); }
.fld input:focus, .fld textarea:focus, .fld select:focus { outline: 0; border-color: var(--color-accent); background: var(--color-bg); box-shadow: 0 0 0 1px var(--color-accent); }
.fld input::placeholder, .fld textarea::placeholder { color: var(--color-muted); }
.alias { display: inline-flex; align-items: center; gap: 2px; height: 20px; padding: 0 2px 0 7px; border-radius: 10px; background: color-mix(in srgb, var(--cat) 14%, transparent); font-size: var(--text-xs); font-weight: var(--weight-medium); white-space: nowrap; }
.alias button { display: grid; place-items: center; width: 16px; height: 16px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--color-muted); cursor: pointer; }
.alias button:hover { background: var(--color-surface-2); color: var(--color-text); }
.alias svg { width: 9px; height: 9px; }
.tgl { position: relative; width: 28px; height: 16px; flex: none; padding: 0; border: 0; border-radius: 8px; background: var(--color-border); cursor: pointer; transition: background .15s; }
.tgl::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--color-surface); box-shadow: 0 1px 2px rgb(0 0 0 / .25); transition: transform .15s; }
.tgl[aria-checked="true"] { background: var(--color-accent); }
.tgl[aria-checked="true"]::after { transform: translateX(12px); }
.tgl:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.fld .hint { font-size: var(--text-xs); color: var(--color-muted); }
.uses { display: grid; gap: 2px; margin: 0 -6px; }
.use-row { display: block; width: 100%; padding: 5px 6px; border: 0; border-radius: var(--radius-sm); background: none; text-align: left; cursor: pointer; }
.use-row:hover { background: var(--color-surface-2); }
.use-row:focus-visible { outline: 2px solid var(--color-accent); outline-offset: -2px; }
.use-row .overline { display: block; }
.use-row .snip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: var(--text-sm); color: var(--color-muted); line-height: var(--leading); }
.use-row .snip i { font-style: italic; }
.adds { display: grid; gap: var(--space-2); }
.add-x { padding: 4px 10px 6px; border-left: 3px solid var(--cat); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; background: var(--color-bg); }
.add-x .use-row { padding: 0; margin-bottom: 2px; }
.add-x .use-row:hover { background: none; color: var(--color-text); }
.add-x p { margin: 0; font-size: var(--text-sm); line-height: var(--leading); }
.p-empty { font-size: var(--text-xs); color: var(--color-muted); }
.p-foot { padding: var(--space-2) var(--space-3) var(--space-4); }
.btn.danger-t { border-color: transparent; background: none; color: var(--color-danger); padding: 0 6px; }
.btn.danger-t:hover { background: color-mix(in srgb, var(--color-danger) 10%, transparent); }
.p-acts { display: flex; justify-content: flex-end; gap: 6px; margin-top: var(--space-3); }

/* Sidebar: Knowledge base (same as plan.html) */
.side { min-height: 0; display: flex; flex-direction: column; background: var(--color-surface); border-right: 1px solid var(--color-border); }
.side-h { padding: 10px var(--space-3) 0; font-size: var(--text-md); font-weight: var(--weight-semibold); }
.side-tools { display: flex; gap: 6px; padding: var(--space-2); }
.side-tools .search { width: auto; flex: 1; }
.side-new { padding: 0 var(--space-2) var(--space-2); }
.side-new .btn { width: 100%; justify-content: center; }
.side-list { flex: 1; overflow: auto; padding: 0 var(--space-1) var(--space-3); }
.cat-h { display: flex; align-items: center; gap: 6px; padding: 10px 6px 4px; font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .04em; color: var(--color-muted); }
.cat-h i, .dot { width: 7px; height: 7px; border-radius: 2px; background: var(--cat); flex: none; }
.entry { width: 100%; display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 6px; border: 0; border-radius: var(--radius-sm); background: none; font-size: var(--text-sm); text-align: left; cursor: pointer; }
.entry:hover { background: var(--color-surface-2); }
.entry[aria-pressed="true"] { background: var(--color-accent-soft); font-weight: var(--weight-medium); }
.entry .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry .u { font-size: var(--text-2xs); color: var(--color-muted); font-variant-numeric: tabular-nums; }
/* Entry row: the row highlights; the hover pencil opens the entry panel in place of the count */
.erow { position: relative; }
.erow .e-edit { position: absolute; right: 3px; top: 3px; }
.erow.open .entry { box-shadow: inset 2px 0 0 var(--color-accent); }
@media (hover: hover) {
  .erow .e-edit { opacity: 0; }
  .erow:hover .e-edit, .erow:focus-within .e-edit { opacity: 1; }
  .erow:hover .entry .u, .erow:focus-within .entry .u { visibility: hidden; }
}
@media (hover: none) { .erow .entry { padding-right: 28px; } }
.side-empty { padding: var(--space-5) var(--space-3); text-align: center; color: var(--color-muted); font-size: var(--text-sm); }

/* Write toolbar */
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.toolbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--space-2); padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--color-border); }
.chnav { display: inline-flex; align-items: center; gap: 2px; min-width: 0; }
.chnav .sel { max-width: 300px; }
.crumb { font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.hl-chip { display: inline-flex; align-items: center; gap: 6px; height: var(--control-height); padding: 0 4px 0 9px; border-radius: var(--radius-sm); background: var(--color-accent-soft); font-size: var(--text-sm); white-space: nowrap; }
.hl-chip .dim-t { font-size: var(--text-xs); }

/* Manuscript area: document + minimap */
.area { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) var(--minimap-width); }
.doc { position: relative; min-height: 0; overflow: auto; container-type: inline-size; --pw: var(--prose-width); }
.doc[data-width="narrow"] { --pw: calc(var(--prose-width) * .82); }
.doc[data-width="wide"] { --pw: calc(var(--prose-width) * 1.2); }
.page { padding: var(--space-5) var(--space-5) 40vh; }
.empty-scope { padding: 80px var(--space-4); text-align: center; color: var(--color-muted); }

/* Each row: prose column + scene gutter (#6 right-hand gutter) */
.row { display: grid; grid-template-columns: minmax(0, var(--pw)) minmax(180px, var(--gutter-width)); gap: 0 40px; justify-content: center; }
.doc.no-gutter .row { grid-template-columns: minmax(0, var(--pw)); }
.doc.no-gutter .gutter { display: none; }

.act-mark { display: flex; align-items: center; gap: var(--space-2); margin: var(--space-5) 0 var(--space-2); font-size: var(--text-2xs); font-weight: var(--weight-semibold); color: var(--color-muted); text-transform: uppercase; letter-spacing: .06em; }
.act-mark::after { content: ""; flex: 1; height: 1px; background: var(--color-border); }
.chapter { padding-top: var(--space-5); }
.chapter + .chapter, .act-mark + .chapter { border-top: 1px dashed var(--color-border); margin-top: var(--space-5); }
.act-mark + .chapter { border-top: 0; margin-top: 0; }
.ch-h { padding: var(--space-3) 0 var(--space-4); }
.ch-h h2 { margin: 2px 0 0; font-size: var(--text-lg); font-weight: var(--weight-semibold); line-height: 1.3; }
.ch-h h2[data-part] { padding: 0 3px; margin-left: -3px; }
.g-ch { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding-top: 2px; font-size: var(--text-xs); color: var(--color-muted); font-variant-numeric: tabular-nums; }
.g-ch code { font-family: var(--font-mono); font-size: var(--text-2xs); }

/* Prose editor */
.ed { position: relative; outline: 0; font-size: var(--text-md); line-height: var(--leading-prose); overflow-wrap: break-word; border-radius: var(--radius-xs); }
.ed p, .ed blockquote, .draft-body p, .draft-body blockquote { margin: 0 0 .85em; }
.ed blockquote, .draft-body blockquote { padding-left: var(--space-3); border-left: 3px solid var(--color-border); color: var(--color-muted); }
.doc[data-para="indent"] .ed p, .doc[data-para="indent"] .draft-body p { margin: 0; }
.doc[data-para="indent"] .ed p + p, .doc[data-para="indent"] .draft-body p + p { text-indent: 1.6em; }
.ed.empty::before { content: attr(data-placeholder); position: absolute; left: 0; top: 0; color: var(--color-muted); pointer-events: none; }
.blk + .blk { margin-top: var(--space-3); }
.blk.prose .ed { min-height: 1.7em; }
.beat-prose { margin-top: var(--space-3); }

/* Inline marks: Codex mention (explicit), Codex alias match (auto), chapter ref (#4), source ref (#2) */
.mention, .cx { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: 4px; background: color-mix(in srgb, var(--cat) 14%, transparent); color: var(--color-text); font-size: .92em; font-weight: var(--weight-medium); line-height: 1.55; white-space: nowrap; cursor: pointer; vertical-align: baseline; }
.mention { display: inline; box-shadow: inset 0 -1.5px 0 var(--cat); border-radius: 3px 3px 0 0; padding: 0 3px; font-size: 1em; }
.cx { height: 19px; font-size: var(--text-2xs); }
.cx i { width: 6px; height: 6px; border-radius: 2px; background: var(--cat); }
.cx b { font-weight: inherit; }
.cx svg { width: 10px; height: 10px; }
.cx .x { display: none; margin-right: -3px; padding: 0; border: 0; background: none; color: var(--color-muted); cursor: pointer; font-size: 12px; line-height: 1; }
.cx:hover .x { display: inline; }
button.cx { border: 0; font-family: inherit; }
.auto { text-decoration: underline dotted var(--cat); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.doc[data-cxhl="off"] .auto { text-decoration: none; }
.mention.hl, .auto.hl { background: color-mix(in srgb, var(--cat) 30%, transparent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--cat) 30%, transparent); border-radius: 3px; }
.chref { display: inline; padding: 0 4px; border-radius: 3px; background: var(--color-surface-2); color: var(--color-accent); font-weight: var(--weight-medium); cursor: pointer; white-space: nowrap; }
.chref::before { content: "§ "; color: var(--color-muted); font-weight: var(--weight-regular); }
.chref.missing { color: var(--color-danger); }
.refm { display: inline-block; min-width: 14px; padding: 0 3px; margin-left: 1px; border-radius: 3px; background: color-mix(in srgb, var(--tone) 16%, transparent); color: var(--tone); font-size: var(--text-2xs); font-weight: var(--weight-semibold); line-height: 1.4; text-align: center; vertical-align: super; cursor: pointer; font-variant-numeric: tabular-nums; }
.refm.flash { animation: flash 1.6s ease-out; }
mark { background: color-mix(in srgb, var(--color-warn) 30%, transparent); color: inherit; border-radius: 2px; }
mark.cur { background: color-mix(in srgb, var(--color-warn) 60%, transparent); box-shadow: 0 0 0 2px var(--color-warn); }

/* Block cards: Scene Beat, Codex Addition */
.card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-raised); }
.blk-h { display: flex; align-items: center; gap: 4px; min-height: 30px; padding: 3px 4px 3px 2px; min-width: 0; }
.kind { display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-2xs); font-weight: var(--weight-semibold); color: var(--color-muted); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.kind svg { width: 13px; height: 13px; }
.beat .kind { color: var(--color-accent); }
.bt { min-width: 40px; font-size: var(--text-sm); font-weight: var(--weight-semibold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 3px; }
.bt:empty::before { content: attr(data-placeholder); color: var(--color-muted); font-weight: var(--weight-regular); }
.beat-body, .add-body { margin: 0 10px; padding: 2px 0 8px; font-size: var(--text-base); line-height: var(--leading); }
.beat-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 10px; border-top: 1px solid var(--color-border); }
.beat-row .seg { height: 24px; }
.beat-row .seg button { padding: 0 8px; font-size: var(--text-xs); }
.beat-row .vr { width: 1px; height: 16px; background: var(--color-border); margin: 0 2px; }
.beat-f { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 10px 8px; border-top: 1px solid var(--color-border); }
.beat.min { display: flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 4px 0 2px; border-style: dashed; box-shadow: none; background: transparent; }
.beat.min .bsum { flex: 1; min-width: 0; font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.beat.min .bsum b { color: var(--color-text); font-weight: var(--weight-medium); }
.addition { border-left: 3px solid var(--cat); }
.addition .kind { color: var(--cat); }
.add-note { padding: 0 10px 8px; font-size: var(--text-xs); color: var(--color-muted); }

/* AI draft (pending ai_generation) */
.draft { margin-top: var(--space-2); border: 1px solid color-mix(in srgb, var(--color-accent) 45%, var(--color-border)); border-radius: var(--radius-md); background: color-mix(in srgb, var(--color-accent) 5%, var(--color-surface)); overflow: hidden; }
.draft-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 5px 6px 5px 10px; border-bottom: 1px solid color-mix(in srgb, var(--color-accent) 25%, var(--color-border)); }
.draft-h .overline { color: var(--color-accent); font-weight: var(--weight-semibold); }
.draft-h .meta { font-size: var(--text-xs); color: var(--color-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.draft-h .btn { height: 24px; padding: 0 8px; }
.draft-body { padding: 10px 12px 2px; font-size: var(--text-md); line-height: var(--leading-prose); }
.draft-note { padding: 0 12px 8px; font-size: var(--text-xs); color: var(--color-muted); }
.caret { display: inline-block; width: 7px; height: 1em; margin-left: 2px; vertical-align: -2px; background: var(--color-accent); animation: pulse .5s steps(2) infinite alternate; }

/* Scene gutter: summary from Plan, labels, Codex, words */
.gutter { min-width: 0; font-size: var(--text-sm); }
.g-in { position: sticky; top: var(--space-3); padding-top: 2px; }
.g-h { display: flex; align-items: center; gap: 2px; min-height: 22px; }
.g-h .overline { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-labels { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 4px; }
.g-sum { padding: 2px 4px; margin: 0 -4px; color: var(--color-muted); white-space: pre-wrap; overflow-wrap: anywhere; line-height: var(--leading); min-height: 1.45em; }
.g-sum:empty::before { content: attr(data-placeholder); font-style: italic; }
.g-sum:focus { color: var(--color-text); }
.g-links { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.g-f { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin: 4px 0 0 -6px; }
.words { font-size: var(--text-2xs); color: var(--color-muted); font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 4px; }
.words.none { font-style: italic; }
.lbl { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; height: 17px; border-radius: 9px; background: var(--color-surface-2); font-size: var(--text-2xs); font-weight: var(--weight-medium); white-space: nowrap; }
.lbl i { width: 6px; height: 6px; border-radius: 50%; background: var(--tone); }
.scene.hit .g-in { box-shadow: -2px 0 0 var(--color-accent); padding-left: 8px; }
.scene.drop-target .g-in { outline: 2px solid var(--color-accent); outline-offset: 4px; border-radius: var(--radius-sm); }
.scene.flash .scene-main { animation: flash 1.2s ease-out; border-radius: var(--radius-sm); }
@keyframes flash { from { box-shadow: 0 0 0 4px var(--color-accent-soft); background: var(--color-accent-soft); } }

/* Scene divider (◇) with "New scene here" */
.divider { position: relative; display: grid; place-items: center; height: 56px; color: var(--color-muted); }
.divider svg { width: 120px; height: 12px; }
.divider .mini { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--color-surface); border: 1px solid var(--color-border); opacity: 0; }
.divider:hover .mini, .divider .mini:focus-visible { opacity: 1; }
.ch-end { display: flex; justify-content: center; padding: var(--space-3) 0; }

/* Editable fields: hover and focus treatment */
[data-part] { outline: 0; }
.ch-h [data-part]:hover, .g-sum:hover, .bt:hover { background: color-mix(in srgb, var(--color-surface-2) 60%, transparent); border-radius: var(--radius-xs); }
.ch-h [data-part]:focus, .g-sum:focus, .bt:focus { background: var(--color-surface); box-shadow: 0 0 0 2px var(--color-accent); border-radius: var(--radius-xs); }
.beat-body:focus-within, .add-body:focus-within { box-shadow: inset 0 -1px 0 var(--color-accent); }

/* Hover-revealed icons (always visible on touch) */
@media (hover: hover) {
  .blk-h .grip, .g-h .ib, .beat.min .grip { opacity: 0; }
  .card:hover .grip, .card:focus-within .grip, .grip:focus-visible, .scene:hover .g-h .ib, .scene:focus-within .g-h .ib { opacity: 1; }
}
.grip { display: inline-grid; place-items: center; width: 18px; height: 22px; padding: 0; border: 0; border-radius: var(--radius-xs); background: none; color: var(--color-muted); cursor: grab; flex: none; }
.grip:hover { background: var(--color-surface-2); color: var(--color-text); }
.grip svg { width: 10px; height: 14px; }
.blk.moved > .card { animation: flash 1s ease-out; }
.blk.dragging { opacity: .35; }
.scene.drop-scene .scene-main { box-shadow: 0 0 0 1px var(--color-border); border-radius: var(--radius-sm); }
#dropline { position: fixed; z-index: 30; height: 2px; pointer-events: none; background: var(--color-accent); border-radius: 2px; display: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--color-accent) 25%, transparent); }
#dropline span { position: absolute; left: 0; bottom: 4px; padding: 0 6px; border-radius: var(--radius-xs); background: var(--color-accent); color: var(--color-accent-fg); font-size: var(--text-2xs); font-weight: var(--weight-semibold); white-space: nowrap; }

/* Minimap: scene ticks, chapter marks, viewport */
.map { position: relative; min-height: 0; border-left: 1px solid var(--color-border); background: var(--color-surface); cursor: pointer; touch-action: none; }
.mm-ch { position: absolute; left: 3px; right: 3px; height: 2px; border-radius: 1px; background: var(--color-text); opacity: .55; }
.mm-s { position: absolute; left: 7px; right: 7px; border-radius: 1px; background: var(--color-muted); opacity: .45; }
.mm-s.empty { background: none; box-shadow: inset 0 0 0 1px var(--color-muted); opacity: .35; right: 12px; }
.mm-s.pending { background: var(--color-accent); opacity: .9; }
.mm-s.hit { background: var(--color-accent); opacity: 1; }
.mm-s.cur { opacity: .9; }
.mm-view { position: absolute; left: 1px; right: 1px; border-radius: 3px; background: color-mix(in srgb, var(--color-accent) 12%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--color-accent) 50%, transparent); pointer-events: none; }

/* Popover menu / picker (same as plan.html, plus the "/" menu and model picker) */
#pop { position: fixed; z-index: 40; width: 236px; max-height: 360px; display: none; flex-direction: column; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-raised), 0 12px 32px -12px rgb(0 0 0 / .35); overflow: hidden; }
#pop.open { display: flex; }
#pop.wide { width: 320px; }
#pop.model { width: 470px; max-width: calc(100vw - 16px); }
#pop .search { width: auto; margin: 6px; }
#pop .list { overflow: auto; padding: 0 4px 4px; }
#pop .item { width: 100%; display: flex; align-items: center; gap: 7px; min-height: 28px; padding: 0 8px; border: 0; border-radius: var(--radius-sm); background: none; font-size: var(--text-sm); text-align: left; cursor: pointer; }
#pop .item:hover, #pop .item.on { background: var(--color-accent-soft); }
#pop .item .k { margin-left: auto; font-size: var(--text-2xs); color: var(--color-muted); font-family: var(--font-mono); white-space: nowrap; }
#pop a.item { color: inherit; text-decoration: none; }
#pop .item.danger { color: var(--color-danger); }
#pop .item:disabled { color: var(--color-muted); cursor: default; background: none; }
#pop .item.cmd { align-items: flex-start; gap: 9px; padding: 6px 8px; }
#pop .item.cmd .ico { display: grid; place-items: center; width: 28px; height: 28px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-bg); flex: none; }
#pop .item.cmd .ico svg { width: 14px; height: 14px; }
#pop .item.cmd b { display: block; font-weight: var(--weight-medium); }
#pop .item.cmd small { display: block; font-size: var(--text-xs); color: var(--color-muted); line-height: 1.35; }
#pop .sep { height: 1px; margin: 4px 0; background: var(--color-border); }
#pop .cat-h { padding: 6px 8px 2px; }
#pop .grp { padding: 8px 8px 2px; font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .04em; color: var(--color-muted); }
#pop .card-in { padding: 10px 12px; font-size: var(--text-sm); }
#pop .card-in h4 { margin: 0 0 2px; display: flex; align-items: center; gap: 6px; font-size: var(--text-md); font-weight: var(--weight-semibold); }
#pop .card-in p { margin: 6px 0 0; color: var(--color-muted); }
#pop .card-in .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
#pop .st { display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-xs); font-weight: var(--weight-medium); }
#pop .st i { width: 6px; height: 6px; border-radius: 50%; background: var(--tone); }
#pop .cols2 { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; overflow: hidden; }
#pop .cols2 > .list { border-right: 1px solid var(--color-border); padding-top: 4px; }
#pop .cols2 > .list:last-child { border-right: 0; }
#pop .item .sub { display: block; font-size: var(--text-2xs); color: var(--color-muted); }
#pop .item.tpl { justify-content: space-between; }
#pop .item.tpl.cur { background: var(--color-surface-2); }
#pop .item .ck { margin-left: auto; color: var(--color-accent); }
#pop .fmt { padding: 8px 10px; display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; font-size: var(--text-sm); }
#pop .fmt .seg { justify-self: start; height: 26px; }
#pop .foot { border-top: 1px solid var(--color-border); padding: 4px; }
#pop .numin { display: flex; gap: 6px; padding: 8px; }
#pop .numin input { flex: 1; min-width: 0; height: var(--control-height); padding: 0 8px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-bg); font-size: var(--text-sm); }

/* Toast */
#toast { position: fixed; left: 50%; bottom: 16px; z-index: 50; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none; display: flex; align-items: center; gap: var(--space-3); max-width: calc(100vw - 32px); padding: 7px 8px 7px 12px; border-radius: var(--radius-md); background: var(--color-text); color: var(--color-bg); font-size: var(--text-sm); box-shadow: var(--shadow-raised); transition: .18s; }
#toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
#toast code { font-family: var(--font-mono); font-size: var(--text-xs); opacity: .8; }
#toast button { border: 0; background: none; color: inherit; font-weight: var(--weight-semibold); text-decoration: underline; cursor: pointer; font-size: var(--text-sm); }

/* Focus mode: only the prose */
body.focus .side, body.focus .toolbar, body.focus .map, body.focus .gutter, body.focus .preview, body.focus .kbp { display: none; }
body.focus .ws, body.focus .ws.has-panel { grid-template-columns: minmax(0, 1fr); }
body.focus .area { grid-template-columns: minmax(0, 1fr); }
body.focus .row { grid-template-columns: minmax(0, var(--pw)); }
body.focus .bookbar { opacity: .3; }
body.focus .bookbar:hover, body.focus .bookbar:focus-within { opacity: 1; }

/* Your access (#80): the quiet chip in the #26 F-06 style, then read-only Write for view and comment */
.role-chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border: 0; border-radius: 11px; background: var(--color-surface-2); color: var(--color-muted); font-size: var(--text-2xs); font-weight: var(--weight-medium); white-space: nowrap; cursor: help; flex: none; }
.role-chip svg { width: 11px; height: 11px; }
.role-chip:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.role-chip[hidden], .sync[hidden] { display: none; }
body[data-ro] .draft { display: none; }   /* a pending AI draft belongs to whoever ran it; readers see the book's text */
body[data-ro] :is([data-grip], .divider .mini, .ch-end, .beat-row, .beat-f, .draft-h .btn, .draft-note, .g-f .mini, .cx .x, [data-menu], .side-new, .p-foot, #kbAlias, .alias button, [data-cmd="hide-beat"], [data-cmd="link-entry"]) { display: none !important; }
body[data-ro] .divider { pointer-events: none; }
body[data-ro] .ed.empty::before, body[data-ro] [data-placeholder]:empty::before { content: none !important; }
body[data-ro] [contenteditable="false"][data-part] { cursor: text; }
body[data-ro] #kbp :is(select, textarea):disabled { opacity: 1; color: var(--color-text); -webkit-text-fill-color: var(--color-text); cursor: default; }
body[data-ro] #kbp .tgl:disabled { opacity: .6; cursor: default; }

/* Review aid (not part of the design) */
.preview { position: fixed; right: calc(var(--minimap-width) + 12px); bottom: 12px; z-index: 20; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); box-shadow: var(--shadow-raised); font-size: var(--text-xs); }
.preview > b { color: var(--color-muted); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .05em; }

/* Narrow document: the gutter moves above its scene */
@container (max-width: 760px) {
  .row { grid-template-columns: minmax(0, 1fr); }
  .gutter { order: -1; margin-bottom: var(--space-2); }
  .g-in { position: static; padding: 6px 10px; border-radius: var(--radius-sm); background: var(--color-surface); border: 1px solid var(--color-border); }
  .g-sum { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .g-sum:focus { display: block; }
  .ch-h .gutter { order: 0; margin: 4px 0 0; }
  .ch-h .g-in { padding: 0; border: 0; background: none; }
  .page { padding-left: var(--space-4); padding-right: var(--space-4); }
}
@media (max-width: 900px) {
  .scope .stat, .sync .lbl-t, .book-id .t, .crumb { display: none; }
}
/* Narrower screens: the entry panel becomes a sheet over the manuscript (as References' detail panel) */
@media (max-width: 860px) {
  .ws.has-panel { grid-template-columns: var(--sidebar-width) minmax(0, 1fr); }
  .ws.no-side.has-panel { grid-template-columns: minmax(0, 1fr); }
  .kbp { position: fixed; z-index: 26; top: var(--bar-height); right: 0; bottom: 0; width: min(var(--panel-width), 100vw); box-shadow: var(--shadow-raised), -12px 0 32px -12px rgb(0 0 0 / .3); }
}
@media (max-width: 720px) {
  .ws:not(.no-side) { grid-template-columns: minmax(0, 1fr); }
  .ws:not(.no-side) .side { position: fixed; z-index: 25; top: var(--bar-height); bottom: 0; left: 0; width: min(300px, 86vw); box-shadow: var(--shadow-raised); }
  .bookbar .hide-sm { display: none; }
  .role-chip .lbl-t { display: none; }
  .role-chip { padding: 0 6px; }
  .area { grid-template-columns: minmax(0, 1fr); }
  .map { display: none; }
  .toolbar .search { flex: 1; width: auto; }
  .chnav .sel { max-width: 46vw; }
  .preview { left: 12px; right: auto; }
}
</style>

  if (!scene) { line.style.display = 'none'; bdrag.target = null; return; }
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  scene.classList.add('drop-scene');
  const main = scene.querySelector('.scene-main'), blks = [...main.children].filter(b => !b.classList.contains('dragging')), mr = main.getBoundingClientRect();
  let i = 0; for (const b of blks) { const r = b.getBoundingClientRect(); if (e.clientY > r.top + r.height / 2) i++; }
  const y = !blks.length ? mr.top : i < blks.length ? blks[i].getBoundingClientRect().top - 6 : blks.at(-1).getBoundingClientRect().bottom + 6;
  Object.assign(line.style, { display: 'block', left: mr.left + 'px', top: y + 'px', width: mr.width + 'px' });
  const loc = locate('scene', scene.dataset.scene);
  line.firstChild.textContent = `Chapter ${chapterNo(loc.c.id)} · Scene ${loc.si + 1}`;
  // Index among all blocks, counting the dragged one, so placeBlock can adjust it
  const all = [...main.children], index = i < blks.length ? all.indexOf(blks[i]) : all.length;
  bdrag.target = { scene: loc.s.id, index };
}

// ---------- Drag a Codex entry: into the text = mention, onto a scene gutter = link ----------
let drag = null;
document.addEventListener('dragstart', e => {
  if (e.target.matches?.('[data-block][draggable="true"]')) {
    bdrag = { id: e.target.dataset.block, el: e.target };
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'block');
    closePop(); requestAnimationFrame(() => e.target.classList.add('dragging'));
    return;
  }
  const en = e.target.closest?.('[data-entry]'); if (!en) return;
  drag = en.dataset.entry; e.dataTransfer.effectAllowed = 'copyLink'; e.dataTransfer.setData('text/plain', entry(drag).name);
});
document.addEventListener('dragover', e => {
  if (bdrag) return blockDragOver(e);
  if (!drag) return;
  document.querySelectorAll('.drop-target').forEach(x => x.classList.remove('drop-target'));
  const g = e.target.closest?.('.gutter'), ed = e.target.closest?.('.ed');
  if (g || ed) e.preventDefault();
  if (g) g.closest('.scene')?.classList.add('drop-target');
});
document.addEventListener('drop', e => {
  if (bdrag) { e.preventDefault(); const t = bdrag.target; if (t) placeBlock(bdrag.id, t.scene, t.index); return; }
  if (!drag) return;
  const g = e.target.closest?.('.gutter'), ed = e.target.closest?.('.ed[data-part]');
  e.preventDefault();
  if (g && g.closest('.scene')) { const s = locate('scene', g.closest('.scene').dataset.scene).s; if (!s.codex.includes(drag)) { s.codex.push(drag); commit(`Linked <b>${esc(entry(drag).name)}</b> to the scene`); } }
  else if (ed) {
    const r = document.caretRangeFromPoint?.(e.clientX, e.clientY); if (!r || !ed.contains(r.startContainer)) return;
    ed.focus(); insertInline({ range: r, ed }, mention(drag));
  }
});
document.addEventListener('dragend', () => {
  document.querySelectorAll('.drop-target, .drop-scene, .dragging').forEach(x => x.classList.remove('drop-target', 'drop-scene', 'dragging'));
  document.querySelectorAll('[data-block][draggable="true"]').forEach(el => el.draggable = false);
  line.style.display = 'none'; drag = null; bdrag = null;
});

// ---------- Knowledge base entry panel (G9): same spec as Plan's ----------
let entryPanel = null; // { id } to edit an entry, { create: true, cat } for New Entry
const catSelect = cur => `<select id="kbCat" data-kbf="cat">${Object.entries(CATS).map(([k, n]) => `<option value="${k}"${k === cur ? ' selected' : ''}>${n}</option>`).join('')}</select>`;
function renderPanel() {
  const el = $('#kbp');
  if (!entryPanel) { el.innerHTML = ''; return; }
  const close = `<button class="ib" data-cmd="close-entry" aria-label="Close entry" title="Close (Esc)">${I.x}</button>`;
  if (entryPanel.create) {
    el.innerHTML = `<div class="p-h"><div class="p-top"><span class="dot" style="--cat:var(--category-${entryPanel.cat})"></span><h2 contenteditable="true" data-kbf="name" data-placeholder="Entry name" spellcheck="false"></h2>${close}</div><div class="by">New Knowledge base entry</div></div>
      <section class="sec"><div class="fields"><label for="kbCat">Category</label><div class="fld">${catSelect(entryPanel.cat)}</div></div>
        <div class="p-acts"><button class="btn ghost" data-cmd="close-entry">Cancel</button><button class="btn primary" data-cmd="entry-create">Create</button></div></section>`;
    return;
  }
  const e = entry(entryPanel.id);
  if (!e) { entryPanel = null; el.innerHTML = ''; return; }
  const scenes = allScenes().filter(s => sceneRefs(s).has(e.id)).map(s => locate('scene', s.id));
  const adds = scenes.flatMap(l => l.s.blocks.filter(b => b.kind === 'addition' && b.entry === e.id).map(b => ({ l, b })));
  const where = l => `Chapter ${chapterNo(l.c.id)} · Scene ${l.si + 1}`;
  el.innerHTML = `<div class="p-h"><div class="p-top"><span class="dot" style="--cat:var(--category-${e.cat})"></span><h2 contenteditable="true" data-kbf="name" data-placeholder="Entry name" spellcheck="false">${esc(e.name)}</h2>${close}</div>
      <div class="by">${CATS[e.cat]} · used in ${scenes.length} ${scenes.length === 1 ? 'scene' : 'scenes'}</div></div>
    <section class="sec"><div class="fields">
      <label for="kbCat">Category</label><div class="fld">${catSelect(e.cat)}</div>
      <label class="top" for="kbAlias">Aliases</label><div class="fld" style="--cat:var(--category-${e.cat})">${e.aliases.map(a => `<span class="alias">${esc(a)}<button data-cmd="alias-del" data-a="${esc(a)}" aria-label="Remove alias ${esc(a)}">${I.x}</button></span>`).join('')}<input id="kbAlias" data-kbf="alias" placeholder="Add alias…" title="Enter adds the alias"></div>
      <label class="top" for="kbSum">Summary</label><div class="fld"><textarea id="kbSum" data-kbf="summary" rows="3" placeholder="What the AI should know about this entry…">${esc(e.summary)}</textarea></div>
      <label>Always in context</label><div class="fld"><button class="tgl" role="switch" data-cmd="entry-always" aria-checked="${!!e.always}" aria-label="Always in context"></button><span class="hint">Sent with every generation</span></div>
    </div></section>
    <section class="sec"><div class="sec-h"><h3>Used in</h3><span class="k">${scenes.length}</span></div>
      ${scenes.length ? `<div class="uses">${scenes.map(l => `<button class="use-row" data-cmd="goto-scene" data-s="${l.s.id}"><span class="overline">${where(l)}</span><span class="snip">${plain(l.s.summary).trim() ? esc(plain(l.s.summary)) : '<i>No summary yet</i>'}</span></button>`).join('')}</div>`
        : '<p class="p-empty">Not used yet. Mention it with @, or drag it onto a scene.</p>'}</section>
    <section class="sec"><div class="sec-h"><h3>Additions</h3><span class="k">${adds.length}</span></div>
      ${adds.length ? `<div class="adds">${adds.map(({ l, b }) => `<div class="add-x" style="--cat:var(--category-${e.cat})"><button class="use-row" data-cmd="goto-scene" data-s="${l.s.id}" data-b="${b.id}"><span class="overline">${where(l)}</span></button><p>${b.body ? inline(b.body, false) : '<i class="dim-t">Empty addition</i>'}</p></div>`).join('')}</div>`
        : '<p class="p-empty">No additions yet. In the manuscript, type / then Codex addition.</p>'}</section>
    <div class="p-foot"><button class="btn danger-t" data-cmd="entry-del">Delete entry</button></div>`;
}
function openEntry(eid) {
  entryPanel = eid ? (entry(eid) ? { id: eid } : null) : { create: true, cat: 'blog' };
  renderPanel(); renderSide(); renderChrome(); requestAnimationFrame(renderMap);
  $('#kbp').scrollTop = 0;
  if (entryPanel?.create) $('#kbp [data-kbf="name"]').focus();
}
function closeEntry() { entryPanel = null; buildAuto(); render(); requestAnimationFrame(renderMap); }
// Name, category or aliases changed: alias matches, counts and colours change everywhere
function entryChanged(refocus) {
  buildAuto(); markDirty(); renderDoc(); renderSide(); renderChrome(); renderPanel();
  if (refocus) $(`#kbp ${refocus}`)?.focus();
}
function createEntry() {
  const name = $('#kbp [data-kbf="name"]').textContent.trim();
  if (!name) { toast('Name the entry first'); return $('#kbp [data-kbf="name"]').focus(); }
  let eid = slugify(name); while (entry(eid)) eid += '-2';
  ENTRIES.push({ id: eid, cat: entryPanel.cat, name, aliases: [], summary: '', always: false });
  entryPanel = { id: eid };
  entryChanged('[data-kbf="alias"]');
  toast(`Created <b>${esc(name)}</b> in ${CATS[entry(eid).cat]}`);
}
// Delete straight away, with Undo in the toast. Mentions become plain text; links, context and additions go.
let undoExtra = null;
function deleteEntry(eid) {
  const e = entry(eid), before = ENTRIES.map(x => ({ ...x, aliases: [...x.aliases] })), wasHl = state.highlight === eid;
  snapshot();
  const un = t => t && t.replaceAll(`[[e:${eid}]]`, e.name);
  allScenes().forEach(s => {
    s.summary = un(s.summary); s.codex = s.codex.filter(x => x !== eid);
    s.blocks = s.blocks.filter(b => b.entry !== eid);
    s.blocks.forEach(b => { ['text', 'prose', 'body'].forEach(k => { if (b[k]) b[k] = un(b[k]); }); if (b.context) b.context = b.context.filter(x => x !== eid); if (b.draft) b.draft.text = un(b.draft.text); });
    if (!s.blocks.length) s.blocks.push(P(''));
  });
  ENTRIES.splice(ENTRIES.indexOf(e), 1); buildAuto();
  undoExtra = () => { ENTRIES.splice(0, ENTRIES.length, ...before); buildAuto(); entryPanel = { id: eid }; if (wasHl) { state.highlight = eid; kv('sessionStorage', HL_KEY, eid); } };
  entryPanel = null;
  if (wasHl) { state.highlight = null; kv('sessionStorage', HL_KEY, null); }
  commit(`Deleted <b>${esc(e.name)}</b> · mentions are now plain text`, true);
}
// "Used in" and additions jump to the scene (or the block) in the manuscript
function goToScene(sid, bid) {
  const loc = locate('scene', sid); if (!loc) return;
  if (state.scope && !chaptersInScope().some(x => x.c === loc.c)) { state.scope = null; render(); }
  const el = document.querySelector(`[data-scene="${sid}"]`), blk = bid && document.querySelector(`[data-block="${bid}"]`);
  if (!blk) return goTo(el, true);
  blk.scrollIntoView({ block: 'center', behavior: 'smooth' });
  blk.classList.remove('moved'); void blk.offsetWidth; blk.classList.add('moved');
}
const kbp = $('#kbp');
kbp.addEventListener('input', e => {
  const k = e.target.dataset.kbf, en = entry(entryPanel?.id);
  if (k === 'name' && en && e.target.textContent.trim()) { en.name = e.target.textContent.trim(); markDirty(); renderSide(); }
  if (k === 'summary' && en) { en.summary = e.target.value; markDirty(); }
});
kbp.addEventListener('change', e => {
  if (e.target.dataset.kbf !== 'cat') return;
  if (entryPanel.create) { entryPanel.cat = e.target.value; kbp.querySelector('.p-top .dot').style.setProperty('--cat', `var(--category-${e.target.value})`); return; }
  entry(entryPanel.id).cat = e.target.value; entryChanged('[data-kbf="cat"]');
});
kbp.addEventListener('keydown', e => {
  const k = e.target.dataset.kbf;
  if (k === 'name' && e.key === 'Enter') { e.preventDefault(); return entryPanel.create ? createEntry() : e.target.blur(); }
  if (k === 'alias' && e.key === 'Enter') {
    e.preventDefault();
    const v = e.target.value.trim(), en = entry(entryPanel.id);
    if (v && !en.aliases.some(a => a.toLowerCase() === v.toLowerCase())) { en.aliases.push(v); entryChanged('[data-kbf="alias"]'); }
    else e.target.value = '';
  }
});
// Leaving the name re-renders the manuscript, so mentions and alias matches pick up the new name
kbp.addEventListener('focusout', e => {
  if (e.target.dataset.kbf !== 'name' || entryPanel?.create) return;
  const en = entry(entryPanel?.id); if (!en) return;
  e.target.textContent = en.name; buildAuto(); flush(); renderDoc(); renderChrome();
});

// ---------- Deep links (G5) and the return from References' Add source (G6) ----------
// The pending selection for "New source…": block index in the scene, then paragraph and start/end offsets in that
// paragraph's stored text, as base64url JSON. References passes it back untouched.
function encodeSel(ctx) {
  const loc = locate('block', ctx.blockId), ed = ctx.ed, r = ctx.range, end = r.cloneRange(); end.collapse(false);
  const nodes = [...ed.childNodes], pi = paraIndex(ed, end), para = nodes[pi];
  const kept = nodes.slice(0, pi).filter(n => { const p = serPara(n); return p.trim() && p !== '> '; }).length;
  const off = (node, o) => { const x = document.createRange(); try { x.setStart(para, 0); x.setEnd(node, o); } catch { return 0; } const d = document.createElement('div'); d.append(x.cloneContents()); return serInline(d).replace(/^\s+/, '').length; };
  const e = para ? off(r.endContainer, r.endOffset) : 0, s = para?.contains(r.startContainer) ? off(r.startContainer, r.startOffset) : 0;
  return btoa(JSON.stringify({ b: loc.bi, p: kept, s, e })).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decodeSel(t) { try { return JSON.parse(atob(t.replace(/-/g, '+').replace(/_/g, '/'))); } catch { return null; } }
// Back from References with a new source: put its marker at the end of the saved selection (warn: needs check)
function citeReturn(loc, h) {
  const rid = h.get('cite'), sel = decodeSel(h.get('sel') || '');
  let r = ref(rid);
  if (!r) REFS.push(r = { id: rid, title: h.get('title') || rid, kind: 'Source', st: 'warn', note: 'New source · needs check' });
  else if (r.st === 'ok') Object.assign(r, { st: 'warn', note: '1 new use since cleared' });
  snapshot();
  const textOf = b => b.kind === 'prose' ? 'text' : b.kind === 'beat' ? 'prose' : null;
  let b = sel && loc.s.blocks[sel.b];
  if (!b || !textOf(b)) b = [...loc.s.blocks].reverse().find(x => x.kind === 'prose' || x.prose) || (loc.s.blocks.push(P('')), loc.s.blocks.at(-1));
  const key = textOf(b), paras = b[key] ? b[key].split(/\n{2,}/) : [''];
  const exact = sel && b === loc.s.blocks[sel.b] && sel.p < paras.length, pi = exact ? sel.p : paras.length - 1;
  const pre = paras[pi].startsWith('> ') ? 2 : 0, at = Math.min(paras[pi].length, exact ? pre + sel.e : Infinity);
  const tok = `[[r:${rid}]]`, nth = (paras.slice(0, pi).join('\n') + paras[pi].slice(0, at)).split(tok).length - 1;
  paras[pi] = paras[pi].slice(0, at) + tok + paras[pi].slice(at);
  b[key] = paras.join('\n\n');
  const was = new Map(refOrder);
  if (state.scope && !chaptersInScope().some(x => x.c === loc.c)) state.scope = null;
  markDirty(); flush(); render();
  const moved = [...was].some(([k, n]) => refOrder.get(k) !== n);
  history.replaceState(null, '', location.pathname + location.search + `#scene=${sceneNo(loc.s.id)}`); // a reload doesn't cite twice
  const m = document.querySelectorAll(`[data-block="${b.id}"] .refm[data-r="${CSS.escape(rid)}"]`)[nth];
  if (m) { m.scrollIntoView({ block: 'center' }); m.classList.add('flash'); }
  toast(`Cited <b>${esc(r.title)}</b> · marker ${refOrder.get(rid)}${moved ? ' · later markers renumbered' : ''}`, true);
}
// #scene=5.2 · #chapter=5 · #scene=4.1&ref=velocity · #kb=<entry> · #entry=<entry> · #scene=7.1&sel=…&cite=…&title=…
function fromHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.has('kb')) setHighlight(h.get('kb'));
  const sloc = h.get('scene') && sceneByNo(h.get('scene')), c = h.get('chapter') && allChapters()[+h.get('chapter') - 1];
  const target = sloc ? sloc.c : c;
  if (target && state.scope && !chaptersInScope().some(x => x.c === target)) { state.scope = null; render(); }
  if (sloc && h.get('cite')) citeReturn(sloc, h);
  else if (sloc) {
    const el = document.querySelector(`[data-scene="${sloc.s.id}"]`), rid = h.get('ref');
    doc.scrollTop = el.offsetTop - 16; el.classList.add('flash');
    const m = rid && ref(rid) && (el.querySelector(`.refm[data-r="${CSS.escape(rid)}"]`) || document.querySelector(`#page .refm[data-r="${CSS.escape(rid)}"]`));
    if (m) { m.scrollIntoView({ block: 'center' }); refCard(m.getBoundingClientRect(), rid); }
  } else if (c) doc.scrollTop = document.querySelector(`[data-ch="${c.id}"]`).offsetTop - 16;
  if (h.get('entry')) openEntry(h.get('entry'));
  onScroll();
  return !!target;
}
addEventListener('hashchange', fromHash);

// ---------- Misc wiring ----------
$('#q').addEventListener('input', e => { state.q = e.target.value.trim(); applyFind(); });
$('#sideToggle').addEventListener('click', () => { state.side = !state.side; renderChrome(); requestAnimationFrame(renderMap); });
if (matchMedia('(max-width: 720px)').matches) state.side = false;
// The highlight carries from Plan and References (G7): #kb= wins, else this tab's last highlight for the book
const hl0 = new URLSearchParams(location.hash.slice(1)).get('kb') || kv('sessionStorage', HL_KEY);
if (entry(hl0)) state.highlight = hl0;
kv('sessionStorage', HL_KEY, state.highlight);
render(); applyRole();
// A deep link wins; otherwise resume where the author left off: the scene with the pending AI draft
requestAnimationFrame(() => {
  if (fromHash()) return;
  const el = document.querySelector('.draft')?.closest('.chapter'); if (el) doc.scrollTop = el.offsetTop - 16; onScroll();
});
</script>
</body>
