<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex · References (reference)</title>
<!--
  Reference implementation of the References section (#2) inside the book workspace chrome.
  Open directly in a browser. Uses ../tokens.css only; no build step.
  Working: the source list (filter by status, search, group by status / chapter / kind, Codex filter from the
  Knowledge base), the detail panel (copyright clearance checklist against the publisher rules, permission
  request tracking, sign-off, every use in the book, source details with identifier checks, citation styles,
  history), the unflagged-quotes review, the Bibliography view, adding a source from an ISBN / DOI / URL,
  and #ref-id deep links from Write. ?book=<id> sets the header from the Library catalogue (content is always
  Product Engineering's); #kb=<entry> carries the Knowledge base filter; ?return=<ch.sc>&sel=… #new returns to
  Write after Add source. The "Preview" panel bottom-right is a review aid, not part of the design.
-->
<link rel="stylesheet" href="../tokens.css">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--color-bg); color: var(--color-text); font: var(--text-base)/var(--leading) var(--font-sans); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
svg { flex: none; }
a { color: inherit; }
.spacer { flex: 1; }
.dim-t { color: var(--color-muted); }

/* Shared controls (same as write.html) */
.btn { display: inline-flex; align-items: center; gap: 5px; height: var(--control-height); padding: 0 10px; border-radius: var(--radius-sm); border: 1px solid var(--color-border); background: var(--color-surface); font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--color-surface-2); }
.btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-fg); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--color-surface-2); }
.btn.sm { height: 24px; padding: 0 8px; font-size: var(--text-xs); }
.btn svg, .seg svg, .ib svg, .mini svg { width: 13px; height: 13px; }
.btn:focus-visible, .seg button:focus-visible, .ib:focus-visible, .mini:focus-visible, .tab:focus-visible, .search:focus-within, .entry:focus-visible, .chip:focus-visible, tr[data-ref]:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.search { display: flex; align-items: center; gap: 6px; height: var(--control-height); width: 220px; max-width: 100%; padding: 0 var(--space-2); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); }
.search svg { width: 13px; height: 13px; color: var(--color-muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: 0; font-size: var(--text-sm); }
.search input::placeholder { color: var(--color-muted); }
.sel { display: inline-flex; align-items: center; gap: 4px; height: var(--control-height); padding: 0 var(--space-2); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); font-size: var(--text-sm); white-space: nowrap; cursor: pointer; min-width: 0; }
.sel em { font-style: normal; color: var(--color-muted); }
.sel svg { width: 11px; height: 11px; color: var(--color-muted); }
.seg { display: inline-flex; height: var(--control-height); border: 1px solid var(--color-border); border-radius: var(--radius-sm); overflow: hidden; background: var(--color-surface); flex: none; }
.seg button { display: inline-flex; align-items: center; gap: 4px; padding: 0 9px; border: 0; border-right: 1px solid var(--color-border); background: transparent; color: var(--color-muted); font-size: var(--text-sm); cursor: pointer; font-variant-numeric: tabular-nums; white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--color-accent-soft); color: var(--color-text); font-weight: var(--weight-semibold); }
.seg.sm { height: 24px; }
.seg.sm button { padding: 0 8px; font-size: var(--text-xs); }
.overline { font-size: var(--text-2xs); font-weight: var(--weight-medium); color: var(--color-muted); text-transform: uppercase; letter-spacing: .02em; }
.ib { display: inline-grid; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: var(--radius-xs); background: transparent; color: var(--color-muted); cursor: pointer; flex: none; }
.ib:hover { background: var(--color-surface-2); color: var(--color-text); }
.cover.thumb { width: 20px; aspect-ratio: 2 / 3; border-radius: 2px; background: linear-gradient(160deg, #05070d, #0d1a2b); box-shadow: 0 0 0 1px rgb(0 0 0 / .15); flex: none; }
.mini { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; border: 0; border-radius: var(--radius-xs); background: none; color: var(--color-muted); font-size: var(--text-xs); font-weight: var(--weight-medium); cursor: pointer; white-space: nowrap; text-decoration: none; }
.mini:hover { background: var(--color-surface-2); color: var(--color-text); }
.mini svg { width: 11px; height: 11px; }
.cx { display: inline-flex; align-items: center; gap: 4px; height: 19px; padding: 0 6px; border: 0; border-radius: 4px; background: color-mix(in srgb, var(--cat) 14%, transparent); color: var(--color-text); font-size: var(--text-2xs); font-weight: var(--weight-medium); white-space: nowrap; cursor: pointer; }
.cx i { width: 6px; height: 6px; border-radius: 2px; background: var(--cat); }

/* Book header (#6 shared chrome, same as write.html) plus the References destination */
.bookbar { height: var(--bar-height); flex: none; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-2); background: var(--color-surface); border-bottom: 1px solid var(--color-border); min-width: 0; }
.book-id { display: flex; align-items: center; gap: 7px; min-width: 0; padding-right: var(--space-2); border-right: 1px solid var(--color-border); height: 100%; }
.book-id .t { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
.book-id b { font-size: var(--text-sm); font-weight: var(--weight-semibold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
.book-id span { font-size: var(--text-2xs); color: var(--color-muted); white-space: nowrap; }
.tabs { display: flex; align-items: center; height: 100%; }
.tab { position: relative; display: inline-flex; align-items: center; gap: 5px; height: 100%; padding: 0 10px; border: 0; background: none; color: var(--color-muted); font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer; text-decoration: none; white-space: nowrap; }
.tab:hover { color: var(--color-text); }
.tab[aria-selected="true"] { color: var(--color-text); font-weight: var(--weight-semibold); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--color-accent); }
.tabs .vr { width: 1px; height: 16px; margin: 0 4px; background: var(--color-border); }
.badge { display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: color-mix(in srgb, var(--tone) 16%, transparent); color: var(--tone); font-size: var(--text-2xs); font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; }
.scope { display: flex; align-items: center; gap: var(--space-2); min-width: 0; font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.sync { display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; }
.sync i { width: 6px; height: 6px; border-radius: 50%; background: var(--color-ok); }
.sync[data-s="saving"] i { background: var(--color-accent); animation: pulse .7s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: .25; } }
.avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--color-accent-soft); color: var(--color-accent); font-size: 10px; font-weight: 700; display: grid; place-items: center; flex: none; }

/* Workspace */
.ws { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); }
.ws.no-side { grid-template-columns: minmax(0, 1fr); }
.ws.no-side .side { display: none; }

/* Sidebar: Knowledge base (same as write.html; here a click filters sources linked to the entry) */
.side { min-height: 0; display: flex; flex-direction: column; background: var(--color-surface); border-right: 1px solid var(--color-border); }
.side-h { padding: 10px var(--space-3) 0; font-size: var(--text-md); font-weight: var(--weight-semibold); }
.side-tools { display: flex; gap: 6px; padding: var(--space-2); }
.side-tools .search { width: auto; flex: 1; }
.side-list { flex: 1; overflow: auto; padding: 0 var(--space-1) var(--space-3); }
.cat-h { display: flex; align-items: center; gap: 6px; padding: 10px 6px 4px; font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .04em; color: var(--color-muted); }
.cat-h i, .dot { width: 7px; height: 7px; border-radius: 2px; background: var(--cat); flex: none; }
.entry { width: 100%; display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 6px; border: 0; border-radius: var(--radius-sm); background: none; font-size: var(--text-sm); text-align: left; cursor: pointer; }
.entry:hover { background: var(--color-surface-2); }
.entry[aria-pressed="true"] { background: var(--color-accent-soft); font-weight: var(--weight-medium); }
.entry .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry .u { font-size: var(--text-2xs); color: var(--color-muted); font-variant-numeric: tabular-nums; }
.side-note { padding: 4px var(--space-3) 0; font-size: var(--text-xs); color: var(--color-muted); }

/* References: toolbar + clearance summary */
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.toolbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--space-2); padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--color-border); }
.toolbar h1 { margin: 0 var(--space-2) 0 2px; font-size: var(--text-lg); font-weight: var(--weight-semibold); line-height: 1; white-space: nowrap; }
.summary { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--space-4); padding: 7px var(--space-3); border-bottom: 1px solid var(--color-border); background: var(--color-surface); font-size: var(--text-xs); }
.meter { display: flex; width: 160px; height: 6px; border-radius: 3px; overflow: hidden; background: var(--color-surface-2); flex: none; }
.meter i { display: block; height: 100%; background: var(--tone); }
.meter i + i { box-shadow: -1px 0 0 var(--color-surface); }
.sum-t { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sum-t b { font-weight: var(--weight-semibold); }
.gate { display: inline-flex; align-items: center; gap: 5px; color: var(--color-danger); white-space: nowrap; }
.gate.ok { color: var(--color-ok); }
.gate svg { width: 12px; height: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border: 1px solid var(--color-border); border-radius: 12px; background: var(--color-surface); font-size: var(--text-xs); font-weight: var(--weight-medium); cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip:hover { background: var(--color-surface-2); }
.chip[aria-pressed="true"] { background: var(--color-accent-soft); border-color: color-mix(in srgb, var(--color-accent) 40%, var(--color-border)); }
.chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--tone); }
.chip .n { color: var(--color-muted); }
.inbox { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border: 1px solid color-mix(in srgb, var(--color-warn) 45%, var(--color-border)); border-radius: var(--radius-sm); background: color-mix(in srgb, var(--color-warn) 8%, var(--color-surface)); font-size: var(--text-xs); font-weight: var(--weight-medium); cursor: pointer; white-space: nowrap; }
.inbox[aria-pressed="true"] { box-shadow: 0 0 0 2px color-mix(in srgb, var(--color-warn) 35%, transparent); }
.inbox svg { width: 12px; height: 12px; color: var(--color-warn); }
/* Return path to Write (?return=…): shown while Add source is closed */
.ret { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 2px 0 8px; border: 1px solid color-mix(in srgb, var(--color-accent) 45%, var(--color-border)); border-radius: var(--radius-sm); background: color-mix(in srgb, var(--color-accent) 8%, var(--color-surface)); font-size: var(--text-xs); font-weight: var(--weight-medium); white-space: nowrap; }
.ret > svg { width: 12px; height: 12px; color: var(--color-accent); }
.ret .mini { height: 20px; }
.ret .mini.go { color: var(--color-accent); }

/* Body: list + detail panel */
.body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-width); }
.body.no-panel { grid-template-columns: minmax(0, 1fr); }
.list { min-height: 0; overflow: auto; }
.panel { min-height: 0; overflow: auto; border-left: 1px solid var(--color-border); background: var(--color-surface); }

/* Source table (Library list view pattern) */
table.refs { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--text-sm); }
.refs th { position: sticky; top: 0; z-index: 2; height: 28px; padding: 0 var(--space-2); background: var(--color-surface-2); border-bottom: 1px solid var(--color-border); color: var(--color-muted); font-size: var(--text-xs); font-weight: var(--weight-medium); text-align: left; white-space: nowrap; }
.refs th.num, .refs td.num { text-align: right; }
.refs td { height: calc(var(--row-height) + 10px); padding: 4px var(--space-2); border-bottom: 1px solid var(--color-border); vertical-align: middle; }
.refs tr[data-ref] { cursor: pointer; outline-offset: -2px; }
.refs tr[data-ref]:hover td { background: color-mix(in srgb, var(--color-accent-soft) 55%, transparent); }
.refs tr[aria-selected="true"] td { background: var(--color-accent-soft); }
.refs tr[aria-selected="true"] td:first-child { box-shadow: inset 2px 0 0 var(--color-accent); }
.refs .grp td { height: 26px; padding: 0 var(--space-2); background: var(--color-bg); font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .04em; color: var(--color-muted); }
.refs .grp i { display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: var(--tone); vertical-align: 1px; }
.c-n { width: 40px; padding-left: var(--space-3) !important; }
.c-kind { width: 96px; }
.c-uses { width: 118px; }
.c-q { width: 104px; }
.c-rights { width: 140px; }
.c-st { width: 210px; }
.src { min-width: 0; }
.src b { display: block; font-weight: var(--weight-medium); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.src span { display: block; font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.refs td.src-td { max-width: 0; }
.kind-t { display: inline-flex; align-items: center; gap: 5px; color: var(--color-muted); font-size: var(--text-xs); white-space: nowrap; }
.kind-t svg { width: 13px; height: 13px; }
.uses-t { font-size: var(--text-xs); white-space: nowrap; font-variant-numeric: tabular-nums; }
.uses-t span { color: var(--color-muted); }
.qw { display: grid; gap: 3px; justify-items: end; font-size: var(--text-xs); font-variant-numeric: tabular-nums; white-space: nowrap; }
.qw .bar { width: 56px; height: 3px; border-radius: 2px; background: var(--color-surface-2); overflow: hidden; }
.qw .bar i { display: block; height: 100%; background: var(--tone); }
.rights-t { font-size: var(--text-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; max-width: 140px; }
.rights-t.unknown { color: var(--color-warn); }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-xs); font-weight: var(--weight-medium); white-space: nowrap; }
.st i { width: 6px; height: 6px; border-radius: 50%; background: var(--tone); flex: none; }
.st-why { display: block; font-size: var(--text-2xs); color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; padding-left: 11px; }
.refm { display: inline-block; min-width: 18px; padding: 0 3px; border-radius: 3px; background: color-mix(in srgb, var(--tone) 16%, transparent); color: var(--tone); font-size: var(--text-2xs); font-weight: var(--weight-semibold); line-height: 1.5; text-align: center; font-variant-numeric: tabular-nums; }
.refm.sup { vertical-align: super; line-height: 1.3; min-width: 14px; margin-left: 1px; }
.empty { padding: 60px var(--space-4); text-align: center; color: var(--color-muted); }

/* Detail panel */
.p-h { position: sticky; top: 0; z-index: 3; padding: var(--space-3) var(--space-3) var(--space-2); background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
.p-top { display: flex; align-items: center; gap: 6px; }
.p-top .overline { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-h h2 { margin: 4px 0 2px; font-size: var(--text-md); font-weight: var(--weight-semibold); line-height: 1.3; }
.p-h .by { font-size: var(--text-xs); color: var(--color-muted); }
.p-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--space-2); }
.sec { padding: var(--space-3); border-bottom: 1px solid var(--color-border); }
.sec-h { display: flex; align-items: center; gap: 6px; margin-bottom: var(--space-2); }
.sec-h h3 { margin: 0; flex: 1; font-size: var(--text-sm); font-weight: var(--weight-semibold); }
.sec-h .k { font-size: var(--text-xs); color: var(--color-muted); font-variant-numeric: tabular-nums; }

/* Verdict + clearance checklist */
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; padding: 9px 10px; border-radius: var(--radius-md); border: 1px solid color-mix(in srgb, var(--tone) 40%, var(--color-border)); background: color-mix(in srgb, var(--tone) 8%, var(--color-surface)); }
.verdict > svg { width: 16px; height: 16px; color: var(--tone); margin-top: 1px; }
.verdict b { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--tone); }
.verdict p { margin: 0; grid-column: 2; font-size: var(--text-xs); color: var(--color-muted); }
.verdict .acts { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.checks { list-style: none; margin: var(--space-2) 0 0; padding: 0; }
.check { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 0 8px; align-items: start; padding: 6px 0; border-bottom: 1px dashed var(--color-border); font-size: var(--text-sm); }
.check:last-child { border-bottom: 0; }
.check .ic { display: grid; place-items: center; width: 16px; height: 16px; margin-top: 1px; border-radius: 50%; background: color-mix(in srgb, var(--tone) 16%, transparent); color: var(--tone); }
.check .ic svg { width: 10px; height: 10px; }
.check .t b { font-weight: var(--weight-medium); }
.check .t span { display: block; font-size: var(--text-xs); color: var(--color-muted); }
.check .x { display: flex; gap: 4px; }
.rules-note { margin-top: var(--space-2); font-size: var(--text-2xs); color: var(--color-muted); }
.rules-note button { padding: 0; border: 0; background: none; color: var(--color-accent); font-size: inherit; cursor: pointer; }

/* Permission request tracker */
.perm { margin-top: var(--space-2); padding: 8px 10px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); }
.perm-steps { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; font-size: var(--text-2xs); font-weight: var(--weight-medium); color: var(--color-muted); white-space: nowrap; }
.perm-steps span { display: inline-flex; align-items: center; gap: 4px; }
.perm-steps i { width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; }
.perm-steps .on { color: var(--color-text); }
.perm-steps .on i { background: var(--color-accent); box-shadow: none; }
.perm-steps .bad { color: var(--color-danger); }
.perm-steps .bad i { background: var(--color-danger); box-shadow: none; }
.perm-steps .line { flex: 1; min-width: 8px; height: 1px; background: var(--color-border); }
.perm p { margin: 0 0 6px; font-size: var(--text-xs); color: var(--color-muted); }
.perm .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.file { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px; border-radius: var(--radius-xs); background: var(--color-surface-2); font-size: var(--text-xs); font-weight: var(--weight-medium); }
.file svg { width: 12px; height: 12px; color: var(--color-muted); }

/* Uses in the book */
.use { padding: 8px 0; border-bottom: 1px dashed var(--color-border); }
.use:last-child { border-bottom: 0; padding-bottom: 0; }
.use:first-child { padding-top: 0; }
.use-h { display: flex; align-items: center; gap: 6px; min-height: 22px; }
.use-h .overline { white-space: nowrap; }
.use-h .ch-t { flex: 1; min-width: 0; font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.utype { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border: 0; border-radius: 9px; background: color-mix(in srgb, var(--tone) 14%, transparent); color: var(--color-text); font-size: var(--text-2xs); font-weight: var(--weight-medium); white-space: nowrap; cursor: pointer; }
.utype::before { content: ""; width: 6px; height: 6px; margin-right: 4px; border-radius: 50%; background: var(--tone); }
.excerpt { margin: 4px 0 4px; padding: 6px 10px; border-left: 2px solid var(--color-border); font-size: var(--text-sm); line-height: var(--leading-prose); color: var(--color-muted); }
.excerpt q { quotes: none; color: var(--color-text); background: color-mix(in srgb, var(--tone) 14%, transparent); border-radius: 2px; padding: 0 1px; }

    e.preventDefault();
    const rows = [...document.querySelectorAll('tr[data-ref]')], i = rows.indexOf(row), n = rows[i + (e.key === 'ArrowDown' ? 1 : -1)];
    if (n) { select(n.dataset.ref); document.querySelector(`tr[data-ref="${n.dataset.ref}"]`).focus(); }
  }
  if (row && e.key === 'Enter') select(row.dataset.ref);
});
document.addEventListener('focusout', e => {
  if (e.target.matches?.('[data-field]') && !e.relatedTarget?.matches?.('[data-field]')) setTimeout(() => { if (!document.activeElement?.matches('[data-field]')) renderPanel(); });
});
$('#q').addEventListener('input', e => { state.q = e.target.value.trim(); renderList(); });
$('#sideQ').addEventListener('input', e => { state.sideQ = e.target.value; renderSide(); });
$('#sideToggle').addEventListener('click', () => { state.side = !state.side; renderChrome(); });
// Deep links: references.html#<id> selects that source, #new opens Add source, and the shared
// #key=value form takes ref=<id> and kb=<entry> (the Knowledge base filter). Without kb, the filter
// comes from this book's session state, so it carries over from Plan and Write.
function fromHash() {
  const h = location.hash.slice(1), kv = h.includes('='), p = new URLSearchParams(kv ? h : '');
  const rid = kv ? p.get('ref') : h, before = state.codex;
  if (p.has('kb')) state.codex = entry(p.get('kb')) ? p.get('kb') : null;
  else { try { const s = sessionStorage.getItem(HL_KEY); if (entry(s)) state.codex = s; } catch {} }
  if (state.codex && state.codex !== before) {
    state.side = true;
    // Show a source linked to the entry, unless the link names one
    if (!ref(rid) && state.sel && ref(state.sel)?.codex !== state.codex) { computeOrder(); state.sel = REFS.filter(r => r.codex === state.codex).sort((a, b) => (order.get(a.id) || 999) - (order.get(b.id) || 999))[0]?.id || state.sel; }
  }
  if (ref(rid)) { state.sel = rid; state.inbox = false; }
  render();
  if (rid === 'new') addForm($('[data-cmd="add"]').getBoundingClientRect());
}
addEventListener('hashchange', fromHash);
if (matchMedia('(max-width: 860px)').matches) state.sel = null;
renderBook();
fromHash();
</script>
</body>
