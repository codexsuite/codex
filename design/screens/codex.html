<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex · Knowledge base (reference)</title>
<!--
  Reference implementation of the Knowledge base entry window (#3) inside the book workspace chrome (#6).
  Open directly in a browser. Uses ../tokens.css only; no build step.
  The sidebar is the same Knowledge base as plan.html and write.html. Clicking an entry (or New Entry, or a
  Codex mention in the manuscript) opens the entry window over the main area; the sidebar stays live, so
  another click switches entry. Working: category picker, rename (the e:id never changes),
  aliases, summary, long-form content with headings, quotes, lists and "@" mentions, category fields,
  custom fields, linked source (#2), related entries, Used in (every scene that touches the entry, by kind, with Make mention and Unlink), Timeline
  (Codex Additions in book order, editable, add at any scene), prev/next, expand, duplicate, delete with
  undo, simulated autosave, deep links (codex.html#goodhart, #new).
  The manuscript behind the window is a static stand-in for write.html, so its marks stay in step with edits.
  The "Preview" panel bottom-left is a review aid, not part of the design.
-->
<link rel="stylesheet" href="../tokens.css">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--color-bg); color: var(--color-text); font: var(--text-base)/var(--leading) var(--font-sans); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
button, input { font: inherit; color: inherit; }
svg { flex: none; }
.spacer { flex: 1; }
.dim-t { color: var(--color-muted); }

/* Shared controls (same as write.html) */
.btn { display: inline-flex; align-items: center; gap: 5px; height: var(--control-height); padding: 0 10px; border-radius: var(--radius-sm); border: 1px solid var(--color-border); background: var(--color-surface); font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--color-text); }
.btn:hover { background: var(--color-surface-2); }
.btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-fg); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { background: var(--color-danger); border-color: var(--color-danger); color: var(--color-accent-fg); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--color-surface-2); }
.btn svg, .seg svg, .ib svg, .mini svg { width: 13px; height: 13px; }
.btn:focus-visible, .seg button:focus-visible, .ib:focus-visible, .mini:focus-visible, .tab:focus-visible, .ktab:focus-visible, .search:focus-within, .entry:focus-visible, .catsel:focus-visible, .sel:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.search { display: flex; align-items: center; gap: 6px; height: var(--control-height); width: 200px; max-width: 100%; padding: 0 var(--space-2); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); }
.search svg { width: 13px; height: 13px; color: var(--color-muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: 0; font-size: var(--text-sm); }
.search input::placeholder { color: var(--color-muted); }
.sel { display: inline-flex; align-items: center; gap: 4px; height: var(--control-height); padding: 0 var(--space-2); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); font-size: var(--text-sm); white-space: nowrap; cursor: pointer; min-width: 0; }
.sel em { font-style: normal; color: var(--color-muted); }
.sel svg { width: 11px; height: 11px; color: var(--color-muted); }
.seg { display: inline-flex; height: var(--control-height); border: 1px solid var(--color-border); border-radius: var(--radius-sm); overflow: hidden; background: var(--color-surface); }
.seg button { display: inline-flex; align-items: center; gap: 4px; padding: 0 9px; border: 0; border-right: 1px solid var(--color-border); background: transparent; color: var(--color-muted); font-size: var(--text-sm); cursor: pointer; font-variant-numeric: tabular-nums; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--color-accent-soft); color: var(--color-text); font-weight: var(--weight-semibold); }
.overline { font-size: var(--text-2xs); font-weight: var(--weight-medium); color: var(--color-muted); text-transform: uppercase; letter-spacing: .02em; }
.ib { display: inline-grid; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: var(--radius-xs); background: transparent; color: var(--color-muted); cursor: pointer; }
.ib:hover { background: var(--color-surface-2); color: var(--color-text); }
.ib:disabled { opacity: .35; cursor: default; background: none; }
.cover.thumb { width: 20px; aspect-ratio: 2 / 3; border-radius: 2px; background: linear-gradient(160deg, #05070d, #0d1a2b); box-shadow: 0 0 0 1px rgb(0 0 0 / .15); flex: none; }
.mini { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; border: 0; border-radius: var(--radius-xs); background: none; color: var(--color-muted); font-size: var(--text-xs); font-weight: var(--weight-medium); cursor: pointer; white-space: nowrap; text-decoration: none; }
.mini:hover { background: var(--color-surface-2); color: var(--color-text); }
.mini svg { width: 11px; height: 11px; }
.vr { width: 1px; height: 16px; background: var(--color-border); margin: 0 2px; flex: none; }

/* Book header (#6 shared chrome, same as write.html) */
.bookbar { height: var(--bar-height); flex: none; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-2); background: var(--color-surface); border-bottom: 1px solid var(--color-border); min-width: 0; }
.book-id { display: flex; align-items: center; gap: 7px; min-width: 0; padding-right: var(--space-2); border-right: 1px solid var(--color-border); height: 100%; }
.book-id .t { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
.book-id b { font-size: var(--text-sm); font-weight: var(--weight-semibold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
.book-id span { font-size: var(--text-2xs); color: var(--color-muted); white-space: nowrap; }
.tabs { display: flex; height: 100%; }
.tab { position: relative; display: inline-flex; align-items: center; padding: 0 10px; border: 0; background: none; color: var(--color-muted); font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer; text-decoration: none; }
.tab:hover { color: var(--color-text); }
.tab[aria-selected="true"] { color: var(--color-text); font-weight: var(--weight-semibold); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--color-accent); }
.sync { display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; }
.sync i { width: 6px; height: 6px; border-radius: 50%; background: var(--color-ok); }
.sync[data-s="editing"] i { background: var(--color-warn); }
.sync[data-s="saving"] i { background: var(--color-accent); animation: pulse .7s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: .25; } }
.avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--color-accent-soft); color: var(--color-accent); font-size: 10px; font-weight: 700; display: grid; place-items: center; flex: none; }

/* Workspace */
.ws { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); }
.ws.no-side { grid-template-columns: minmax(0, 1fr); }
.ws.no-side .side { display: none; }

/* Sidebar: Knowledge base (same as write.html; here a click opens the entry window) */
.side { min-height: 0; display: flex; flex-direction: column; background: var(--color-surface); border-right: 1px solid var(--color-border); }
.side-h { padding: 10px var(--space-3) 0; font-size: var(--text-md); font-weight: var(--weight-semibold); }
.side-tools { display: flex; gap: 6px; padding: var(--space-2); }
.side-tools .search { width: auto; flex: 1; }
.side-new { padding: 0 var(--space-2) var(--space-2); }
.side-new .btn { width: 100%; justify-content: center; }
.side-list { flex: 1; overflow: auto; padding: 0 var(--space-1) var(--space-3); }
.cat-h { display: flex; align-items: center; gap: 6px; padding: 10px 6px 4px; font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .04em; color: var(--color-muted); }
.cat-h i, .dot { width: 7px; height: 7px; border-radius: 2px; background: var(--cat); flex: none; }
.cat-h .ib { width: 18px; height: 18px; margin: -4px -2px -4px 0; }
.cat-h .ib svg { width: 11px; height: 11px; }
@media (hover: hover) { .cat-h .ib { opacity: 0; } .cat-h:hover .ib, .cat-h .ib:focus-visible { opacity: 1; } }
.entry { width: 100%; display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 6px; border: 0; border-radius: var(--radius-sm); background: none; font-size: var(--text-sm); text-align: left; cursor: pointer; }
.entry:hover { background: var(--color-surface-2); }
.entry[aria-pressed="true"] { background: var(--color-accent-soft); font-weight: var(--weight-medium); }
.entry .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry .n:empty::before { content: "Untitled entry"; font-style: italic; color: var(--color-muted); }
.entry .u { font-size: var(--text-2xs); color: var(--color-muted); font-variant-numeric: tabular-nums; }
.side-empty { padding: var(--space-5) var(--space-3); text-align: center; color: var(--color-muted); font-size: var(--text-sm); }

/* Main area: a static stand-in for the Write manuscript behind the entry window */
.main { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.toolbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--space-2); min-height: calc(var(--control-height) + 2 * var(--space-2)); padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--color-border); }
.crumb { font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; }
.hl-chip { display: inline-flex; align-items: center; gap: 6px; height: var(--control-height); padding: 0 4px 0 9px; border-radius: var(--radius-sm); background: var(--color-accent-soft); font-size: var(--text-sm); white-space: nowrap; }
.hl-chip .dim-t { font-size: var(--text-xs); }
.doc { flex: 1; min-height: 0; overflow: auto; container-type: inline-size; }
.page { padding: var(--space-3) var(--space-5) 30vh; }
.row { display: grid; grid-template-columns: minmax(0, var(--prose-width)) minmax(180px, var(--gutter-width)); gap: 0 40px; justify-content: center; }
.act-mark { display: flex; align-items: center; gap: var(--space-2); margin: var(--space-5) 0 var(--space-2); font-size: var(--text-2xs); font-weight: var(--weight-semibold); color: var(--color-muted); text-transform: uppercase; letter-spacing: .06em; }
.act-mark::after { content: ""; flex: 1; height: 1px; background: var(--color-border); }
.chapter + .chapter { border-top: 1px dashed var(--color-border); margin-top: var(--space-5); padding-top: var(--space-3); }
.ch-h { padding: var(--space-3) 0 var(--space-4); }
.ch-h h2 { margin: 2px 0 0; font-size: var(--text-lg); font-weight: var(--weight-semibold); line-height: 1.3; }
.ed { font-size: var(--text-md); line-height: var(--leading-prose); overflow-wrap: break-word; }
.ed p, .ed blockquote { margin: 0 0 .85em; }
.ed .empty-p { color: var(--color-muted); font-style: italic; }
.scene-main > * + * { margin-top: var(--space-3); }
.beat-line { display: flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 8px; border: 1px dashed var(--color-border); border-radius: var(--radius-md); font-size: var(--text-xs); color: var(--color-muted); min-width: 0; }
.beat-line b { color: var(--color-text); font-weight: var(--weight-medium); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kind { display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-2xs); font-weight: var(--weight-semibold); color: var(--color-muted); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.kind svg { width: 13px; height: 13px; }
.beat-line .kind { color: var(--color-accent); }
.card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-raised); }
.addition { border-left: 3px solid var(--cat); padding: 6px 10px 8px; }
.addition .kind { color: var(--cat); }
.addition .add-h { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.addition .add-b { font-size: var(--text-base); }
.divider { display: grid; place-items: center; height: 48px; color: var(--color-muted); }
.divider svg { width: 120px; height: 12px; }
.gutter { min-width: 0; font-size: var(--text-sm); }
.g-in { position: sticky; top: var(--space-3); padding-top: 2px; }
.g-sum { color: var(--color-muted); white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
.g-links { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.scene.hit .g-in { box-shadow: -2px 0 0 var(--color-accent); padding-left: 8px; }
.scene.flash .scene-main { animation: flash 1.2s ease-out; border-radius: var(--radius-sm); }
@keyframes flash { from { box-shadow: 0 0 0 4px var(--color-accent-soft); background: var(--color-accent-soft); } }
@container (max-width: 760px) {
  .row { grid-template-columns: minmax(0, 1fr); }
  .gutter { order: -1; margin-bottom: var(--space-2); }
  .g-in { position: static; }
  .page { padding-left: var(--space-4); padding-right: var(--space-4); }
}

/* Inline marks (same as write.html): Codex mention, Codex alias match, chapter ref, source ref */
.mention, .cx { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: 4px; background: color-mix(in srgb, var(--cat) 14%, transparent); color: var(--color-text); font-size: .92em; font-weight: var(--weight-medium); line-height: 1.55; white-space: nowrap; cursor: pointer; vertical-align: baseline; }
.mention { display: inline; box-shadow: inset 0 -1.5px 0 var(--cat); border-radius: 3px 3px 0 0; padding: 0 3px; font-size: 1em; }
.cx { height: 19px; font-size: var(--text-2xs); }
.cx i { width: 6px; height: 6px; border-radius: 2px; background: var(--cat); }
.cx b { font-weight: inherit; }
.cx .x { display: none; margin-right: -3px; padding: 0; border: 0; background: none; color: var(--color-muted); cursor: pointer; font-size: 12px; line-height: 1; }
.cx:hover .x, .cx:focus-within .x { display: inline; }
.auto { text-decoration: underline dotted var(--cat); text-decoration-thickness: 1.5px; text-underline-offset: 3px; cursor: pointer; }
.mention.hl, .auto.hl { background: color-mix(in srgb, var(--cat) 30%, transparent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--cat) 30%, transparent); border-radius: 3px; }
.chref { display: inline; padding: 0 4px; border-radius: 3px; background: var(--color-surface-2); color: var(--color-accent); font-weight: var(--weight-medium); white-space: nowrap; }
.chref::before { content: "§ "; color: var(--color-muted); font-weight: var(--weight-regular); }
.refm { display: inline-block; min-width: 14px; padding: 0 3px; margin-left: 1px; border-radius: 3px; background: color-mix(in srgb, var(--tone) 16%, transparent); color: var(--tone); font-size: var(--text-2xs); font-weight: var(--weight-semibold); line-height: 1.4; text-align: center; vertical-align: super; font-variant-numeric: tabular-nums; }

/* ---------- Entry window (#3) ---------- */
.scrim { position: absolute; inset: 0; z-index: 15; display: none; background: color-mix(in srgb, var(--color-bg) 62%, transparent); }
.scrim.open { display: block; }
.kb { position: absolute; z-index: 16; top: var(--space-4); bottom: var(--space-4); left: 50%; width: min(var(--overlay-width), calc(100% - 2 * var(--space-4))); transform: translateX(-50%); display: none; flex-direction: column; min-height: 0; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-raised), 0 24px 56px -24px rgb(0 0 0 / .45); overflow: hidden; container-type: inline-size; }
.kb:focus { outline: 0; }
.kb.open { display: flex; animation: kbIn .14s ease-out; }
.kb.expanded { top: 0; bottom: 0; left: 0; width: 100%; transform: none; border: 0; border-radius: 0; box-shadow: none; animation: none; }
@keyframes kbIn { from { opacity: 0; transform: translateX(-50%) translateY(6px); } }
.kb::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--cat); }
.kb.expanded::before { display: none; }

.kb-top { flex: none; display: flex; align-items: center; gap: 4px; padding: 10px var(--space-3) 0 var(--space-4); min-width: 0; }
.catsel { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 7px 0 8px; border: 0; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--cat) 14%, transparent); font-size: var(--text-xs); font-weight: var(--weight-semibold); cursor: pointer; white-space: nowrap; }
.catsel i { width: 7px; height: 7px; border-radius: 2px; background: var(--cat); }
.catsel svg { width: 10px; height: 10px; color: var(--color-muted); }
.kb-pos { font-size: var(--text-xs); color: var(--color-muted); font-variant-numeric: tabular-nums; white-space: nowrap; padding: 0 4px; }

.kb-head { flex: none; padding: var(--space-2) var(--space-4) 0; }
.kb-name { margin: 0; padding: 1px 4px; margin-left: -4px; font-size: var(--text-lg); font-weight: var(--weight-semibold); line-height: 1.3; outline: 0; border-radius: var(--radius-xs); overflow-wrap: anywhere; }
.kb-name:empty::before { content: attr(data-placeholder); color: var(--color-muted); font-weight: var(--weight-regular); }
.kb-alias { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-height: 26px; margin-top: 2px; font-size: var(--text-xs); }
.kb-alias > .dim-t { margin-right: 2px; }
.alias { display: inline-flex; align-items: center; gap: 3px; height: 19px; padding: 0 3px 0 7px; border-radius: 10px; background: var(--color-surface-2); font-size: var(--text-xs); white-space: nowrap; }
.alias button { display: inline-grid; place-items: center; width: 14px; height: 14px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--color-muted); cursor: pointer; font-size: 12px; line-height: 1; }
.alias button:hover { background: var(--color-border); color: var(--color-text); }
.alias-in { height: 20px; width: 140px; padding: 0 7px; border: 1px solid var(--color-accent); border-radius: 10px; background: var(--color-bg); outline: 0; font-size: var(--text-xs); }

.kb-tabs { flex: none; display: flex; align-items: flex-end; gap: 2px; padding: 0 var(--space-3) 0 var(--space-3); border-bottom: 1px solid var(--color-border); min-width: 0; }
.ktab { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px; border: 0; background: none; color: var(--color-muted); font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer; white-space: nowrap; }
.ktab:hover { color: var(--color-text); }
.ktab[aria-selected="true"] { color: var(--color-text); font-weight: var(--weight-semibold); }
.ktab[aria-selected="true"]::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--color-accent); }
.ktab .n { min-width: 16px; height: 16px; padding: 0 5px; border-radius: 8px; background: var(--color-surface-2); font-size: var(--text-2xs); font-weight: var(--weight-semibold); line-height: 16px; text-align: center; font-variant-numeric: tabular-nums; }
.kb-tabs .eid { align-self: center; display: inline-flex; align-items: center; gap: 2px; font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--color-muted); white-space: nowrap; min-width: 0; overflow: hidden; }

.kb-body { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: minmax(0, 1fr) var(--gutter-width); align-items: start; }
.kb-main { min-width: 0; padding: var(--space-4) var(--space-5) var(--space-5) var(--space-4); }
.kb.expanded .kb-main { padding-left: max(var(--space-4), calc((100% - var(--prose-width)) / 2)); }
.kb-rail { position: sticky; top: 0; min-width: 0; align-self: stretch; padding: var(--space-4) var(--space-4) var(--space-5) var(--space-3); border-left: 1px solid var(--color-border); background: color-mix(in srgb, var(--color-surface-2) 30%, var(--color-surface)); }
@container (max-width: 680px) {
  .kb-body { grid-template-columns: minmax(0, 1fr); }
  .kb-rail { position: static; border-left: 0; border-top: 1px solid var(--color-border); padding-left: var(--space-4); }
  .kb-main { padding-right: var(--space-4); }
  .kb-tabs .eid { display: none; }
}

/* Entry tab */
.sec-h { display: flex; align-items: center; gap: 6px; min-height: 24px; margin-bottom: 4px; }
.sec-h .overline { font-weight: var(--weight-semibold); }
.sec-h .hint { font-size: var(--text-xs); color: var(--color-muted); }
.kb-sum { padding: 6px 8px; margin: 0 -8px; border-radius: var(--radius-sm); font-size: var(--text-base); outline: 0; min-height: 2.2em; overflow-wrap: anywhere; }
.kb-sum:empty::before, .kb-ed.empty::before, .fv:empty::before, .fk:empty::before, .prog-t:empty::before { content: attr(data-placeholder); color: var(--color-muted); font-style: italic; pointer-events: none; }
.kb-sum:hover, .fv:hover, .fk:hover, .prog-t:hover, .kb-name:hover { background: color-mix(in srgb, var(--color-surface-2) 60%, transparent); }
.kb-sum:focus, .fv:focus, .fk:focus, .prog-t:focus, .kb-name:focus { background: var(--color-surface); box-shadow: 0 0 0 2px var(--color-accent); }
.content-sec { margin-top: var(--space-4); }
.fbar { display: inline-flex; align-items: center; gap: 1px; margin-left: 4px; }

  E('goodhart', 'law', "Goodhart's Law", ['Goodhart'], 'When a measure becomes a target, it ceases to be a good measure.', [

const kb = $('#kb');

function openKB(eid, o = {}) {

  Object.assign(state.kb, { tab: o.tab || (state.kb.open ? state.kb.tab : 'entry'), open: true, id: eid });
  if (o.returnTo) kbReturn = o.returnTo;
  renderKB();

  renderSide();

}
let kbReturn = null;
function closeKB() {

  state.kb.open = false;

// Leaving an entry: flush autosave, discard a new entry left completely empty
function leaveEntry() {

  else finishNew(e);
}
// A new entry gets its permanent id (e:slug) from its first name; it never changes after that
function finishNew(e) {

  let nid = slugify(e.name), i = 2; const base = nid;
  while (ENTRIES.some(x => x !== e && x.id === nid)) nid = `${base}-${i++}`;
  if (state.kb.id === e.id) state.kb.id = nid;
  e.id = nid;
  buildAuto();
}

// ---------- Data changes ----------
function deleteEntry(e) {
  const tok = new RegExp(`\\[\\[e:${reEsc(e.id)}\\]\\]`, 'g'), name = e.name;
  allScenes().forEach(s => {
    s.summary = s.summary.replace(tok, name);
    s.codex = s.codex.filter(x => x !== e.id);
    s.blocks = s.blocks.filter(b => !(b.kind === 'addition' && b.entry === e.id));
    s.blocks.forEach(b => { if (b.text) b.text = b.text.replace(tok, name); if (b.prose) b.prose = b.prose.replace(tok, name); if (b.body) b.body = b.body.replace(tok, name); if (b.context) b.context = b.context.filter(x => x !== e.id); });
    if (!s.blocks.length) s.blocks.push(P(''));
  });
  ENTRIES.forEach(x => { x.related = x.related.filter(r => r !== e.id); x.body = x.body.replace(tok, name); x.summary = x.summary.replace(tok, name); });
  ENTRIES.splice(ENTRIES.indexOf(e), 1);
  if (state.highlight === e.id) state.highlight = null;
}
// Replace the first plain-text use of the entry's name in a scene with a mention token
function replaceFirst(t, e) {
  const parts = (t || '').split(/(\[\[(?:e|ch|r):[\w-]+\]\])/), re = aliasRe(e);
  for (let i = 0; i < parts.length; i += 2) if (re.test(parts[i])) { parts[i] = parts[i].replace(re, `[[e:${e.id}]]`); return parts.join(''); }
  return null;
}
function makeMention(s, e) {
  for (const b of s.blocks) {
    if (b.kind === 'prose') { const r = replaceFirst(b.text, e); if (r) { b.text = r; return true; } }
    if (b.kind === 'beat') { const r = replaceFirst(b.prose, e); if (r) { b.prose = r; return true; } }
  }
  const r = replaceFirst(s.summary, e); if (r) { s.summary = r; return true; }
  for (const b of s.blocks) if (b.kind === 'beat') { const r2 = replaceFirst(b.body, e); if (r2) { b.body = r2; return true; } }
  return false;
}
function gotoScene(sid, eid) {
  state.highlight = eid;
  closeKB(); applyHighlight();
  const el = document.getElementById(sid); if (!el) return;
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
function step(d) {
  const list = sideOrder(), i = list.indexOf(cur()), next = list[i + d];
  if (next) openKB(next.id);
}

// ---------- Caret helpers + "@" mentions ----------
function placeCaret(el) { el.focus(); const r = document.createRange(); r.selectNodeContents(el); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
let savedRange = null;
function caretRect() {
  const s = getSelection(); if (!s.rangeCount) return null;
  const r = s.getRangeAt(0).cloneRange(); r.collapse(true);
  const rects = r.getClientRects(); if (rects.length) return rects[0];
  const n = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement; return n.getBoundingClientRect();
}
function startMention(field) {
  const s = getSelection(); if (!s.rangeCount) return;
  savedRange = s.getRangeAt(0).cloneRange();
  const rect = caretRect() || field.getBoundingClientRect();
  entryPicker(rect, 'Mention an entry', new Set([cur().id]), 'insert-mention');
  popCtx.field = field; popCtx.back = field;
}
function insertMention(eid) {
  const field = popCtx?.field; closePop();
  if (!field || !savedRange) return;
  field.focus();
  const s = getSelection(); s.removeAllRanges(); s.addRange(savedRange);
  const tmp = document.createElement('span'); tmp.innerHTML = mention(eid);
  const node = tmp.firstChild, space = document.createTextNode(' ');
  savedRange.deleteContents(); savedRange.insertNode(space); savedRange.insertNode(node);
  const r = document.createRange(); r.setStartAfter(space); r.collapse(true); s.removeAllRanges(); s.addRange(r);
  savedRange = null;
  field.dispatchEvent(new Event('input', { bubbles: true }));
}

// ---------- Events ----------
document.addEventListener('click', ev => {
  const t = ev.target;
  if (pop.classList.contains('open') && !pop.contains(t) && !t.closest('[data-cmd="cat"],[data-cmd="more"]')) closePop();

  // Theme / density review aid
  const th = t.closest('[data-theme-set]'); if (th) { const v = th.dataset.themeSet; v === 'system' ? document.documentElement.removeAttribute('data-theme') : document.documentElement.setAttribute('data-theme', v); return syncPreview(); }
  const dn = t.closest('[data-dens-set]'); if (dn) { document.documentElement.setAttribute('data-density', dn.dataset.densSet); return syncPreview(); }

  // Sidebar
  const en = t.closest('[data-entry]');
  if (en) { const eid = en.dataset.entry; return state.kb.open && state.kb.id === eid ? closeKB() : openKB(eid, { returnTo: en }); }

  // Popover picks
  const pc = t.closest('[data-pick-cat]');
  if (pc) { const e = cur(), before = snap(), old = CATS[e.cat].name; e.cat = pc.dataset.pickCat; closePop(); return commit(`Moved to <b>${esc(CATS[e.cat].name)}</b> from ${esc(old)}`, before); }
  const sw = t.closest('[data-sw]');
  if (sw) { popCtx.color = sw.dataset.sw; pop.querySelectorAll('[data-sw]').forEach(b => b.setAttribute('aria-pressed', b === sw)); return swNote(); }
  const pe = t.closest('[data-pick-e]');
  if (pe) {
    const eid = pe.dataset.pickE, e = cur();
    if (popCtx?.cmd === 'insert-mention') return insertMention(eid);
    if (popCtx?.cmd === 'add-rel') { const before = snap(), o = entry(eid); e.related.push(eid); if (!o.related.includes(e.id)) o.related.push(e.id); closePop(); return commit(`Linked <b>${esc(o.name)}</b> both ways`, before); }
    return;
  }
  const ps = t.closest('[data-pick-s]');
  if (ps) {
    const e = cur(), before = snap(), s = where(ps.dataset.pickS).s, b = A(e.id, '');
    s.blocks.unshift(b); closePop(); state.kb.tab = 'prog';
    commit(`Timeline note added at ${at(s.id)}, as a Codex Addition at the start of the scene`, before);
    const el = kb.querySelector(`[data-b="${b.id}"].prog-t`); if (el) { el.scrollIntoView({ block: 'nearest' }); placeCaret(el); }
    return;
  }
  const psr = t.closest('[data-pick-src]');
  if (psr) { const e = cur(), before = snap(); e.source = psr.dataset.pickSrc; closePop(); return commit(`Source linked: <b>${esc(ref(e.source).title)}</b>`, before); }

  // Tabs inside the entry window
  const kt = t.closest('[data-tab]');
  if (kt) { state.kb.tab = kt.dataset.tab; renderKB(); return kb.querySelector(`[data-tab="${state.kb.tab}"]`).focus(); }
  const fm = t.closest('[data-fmt]');
  if (fm) {
    const ed = kb.querySelector('.kb-ed'); if (!ed) return;
    if (!ed.contains(getSelection().anchorNode)) placeCaret(ed);
    const f = fm.dataset.fmt;
    if (f === 'at') return startMention(ed);
    if (f === 'ul') document.execCommand('insertUnorderedList');
    else { const n = getSelection().anchorNode, blk = (n?.nodeType === 1 ? n : n?.parentElement)?.closest('h3, blockquote, p, li'); document.execCommand('formatBlock', false, `<${blk && blk.nodeName.toLowerCase() === f ? 'p' : f}>`); }
    return ed.dispatchEvent(new Event('input', { bubbles: true }));
  }

  // Mentions and chips open their entry (in the manuscript, the entry window and the rail)
  const mk = t.closest('.mention[data-e], .auto[data-e], .cx[data-e]');
  if (mk && !t.closest('.x') && !t.closest('#pop')) return openKB(mk.dataset.e);

  const c = t.closest('[data-cmd]'); if (!c) { if (t.id === 'scrim') closeKB(); return; }
  const cmd = c.dataset.cmd, e = cur();
  switch (cmd) {
    case 'new-entry': return newEntry(c.dataset.cat);
    case 'open-entry': return openKB(c.dataset.e);
    case 'clear-hl': state.highlight = null; return applyHighlight();
    case 'close': return closeKB();
    case 'close-pop': return closePop(true);
    case 'prev': return step(-1);
    case 'next': return step(1);
    case 'expand': state.kb.expanded = !state.kb.expanded; renderKB(); return kb.querySelector('[data-cmd="expand"]').focus();
    case 'cat': return pop.classList.contains('open') && popCtx?.back === c ? closePop() : catMenu(c);
    case 'more': return pop.classList.contains('open') && popCtx?.back === c ? closePop() : moreMenu(c);
    case 'new-cat': return newCatForm(kb.querySelector('[data-cmd="cat"]'));
    case 'create-cat': {
      const name = $('#ncName').value.trim(); if (!name) return $('#ncName').focus();
      const before = snap(), k = slugify(name); CATS[k] = { name, color: popCtx.color }; FIELDS[k] = []; e.cat = k; closePop();
      return commit(`Category <b>${esc(name)}</b> created; ${esc(e.name || 'this entry')} moved into it`, null);
    }
    case 'copy-id': closePop(); navigator.clipboard?.writeText(`e:${e.id}`).catch(() => {}); return toast(`Copied <code>e:${esc(e.id)}</code>. Paste it anywhere a Codex mention goes.`);
    case 'dup': {
      closePop(); finishNew(e);
      const before = snap(), d = JSON.parse(JSON.stringify(e)); d.name = `${e.name} (copy)`; d.aliases = []; d.related = [...e.related]; d.created = 'Today'; d.updated = 'just now';
      let nid = slugify(d.name), i = 2; const base = nid; while (entry(nid)) nid = `${base}-${i++}`; d.id = nid;
      ENTRIES.splice(ENTRIES.indexOf(e) + 1, 0, d);
      commit(); openKB(d.id, { focusName: true });
      return toast('Duplicated. Aliases are not copied, so the text still only matches the original.', () => { restore(before); openKB(e.id); });
    }
    case 'del-ask': return deleteAsk(kb.querySelector('[data-cmd="more"]'));
    case 'del': {
      const before = snap(), name = e.name, eid = e.id; closePop(); deleteEntry(e); state.kb.open = false;
      kb.classList.remove('open'); $('#scrim').classList.remove('open'); history.replaceState(null, '', location.pathname);
      commit();
      return toast(`Deleted <b>${esc(name)}</b>`, () => { restore(before); openKB(eid); });
    }
    case 'add-alias': {
      const inp = document.createElement('input'); inp.className = 'alias-in'; inp.placeholder = 'Another name, then Enter'; inp.setAttribute('aria-label', 'New alias');
      c.replaceWith(inp); inp.focus();
      const done = keep => { const v = inp.value.trim(); if (keep && v && !namesOf(e).some(n => n.toLowerCase() === v.toLowerCase())) { e.aliases.push(v); commit(`Alias added. “${esc(v)}” in the text now counts as ${esc(e.name)}.`); } else renderKB(); };
      inp.addEventListener('keydown', k => { if (k.key === 'Enter') { k.preventDefault(); done(true); } if (k.key === 'Escape') { k.preventDefault(); k.stopPropagation(); done(false); } });
      inp.addEventListener('blur', () => inp.isConnected && done(true));
      return;
    }
    case 'rm-alias': { const before = snap(), a = e.aliases.splice(+c.dataset.i, 1)[0]; return commit(`Alias “${esc(a)}” removed`, before); }
    case 'add-field': { e.extra.push({ k: '', v: '' }); renderKB(); return placeCaret(kb.querySelector(`[data-extra-k="${e.extra.length - 1}"]`)); }
    case 'link-src': return srcPicker(c);
    case 'unlink-src': { const before = snap(); e.source = null; return commit('Source removed from this entry. It stays in References.', before); }
    case 'add-rel': return entryPicker(c, 'Link a related entry', new Set([e.id, ...e.related]), 'add-rel');
    case 'rm-rel': { const before = snap(), o = entry(c.dataset.e); e.related = e.related.filter(r => r !== o.id); o.related = o.related.filter(r => r !== e.id); return commit(`Unlinked <b>${esc(o.name)}</b>`, before); }
    case 'highlight': return gotoScene(allScenes().find(s => sceneRefs(s).has(e.id))?.id, e.id);
    case 'goto': return gotoScene(c.dataset.s, e.id);
    case 'unlink': { const before = snap(), s = where(c.dataset.s).s; s.codex = s.codex.filter(x => x !== e.id); return commit(`Unlinked from ${at(s.id)}`, before); }
    case 'make-mention': { const before = snap(), s = where(c.dataset.s).s; return makeMention(s, e) ? commit(`Now a mention in ${at(s.id)}`, before) : null; }
    case 'add-prog': return scenePicker(c);
    case 'rm-add': { const before = snap(), loc = allScenes().find(s => s.blocks.some(b => b.id === c.dataset.b)); loc.blocks = loc.blocks.filter(b => b.id !== c.dataset.b); if (!loc.blocks.length) loc.blocks.push(P('')); return commit(`Timeline note removed from ${at(loc.id)}`, before); }
    case 'import-url': return importForm(c);
    case 'do-import': {
      const url = $('#impUrl').value.trim(); if (!url) return $('#impUrl').focus();
      const before = snap(), host = url.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
      closePop();
      e.body = [`> Imported from ${url} and archived.`, '## Imported text', `The article text from ${host} appears here, with its headings, lists and quotes kept. Edit it like any other entry content.`].join('\n\n');
      if (FIELDS[e.cat]?.some(f => f[0] === 'url')) e.fields.url = url.replace(/^https?:\/\//, ''); else e.extra.push({ k: 'URL', v: url.replace(/^https?:\/\//, '') });
      return commit(`Imported from <b>${esc(host)}</b>`, before);
    }
  }
});

// Inline edits inside the entry window
kb.addEventListener('input', ev => {
  const el = ev.target.closest('[contenteditable="true"]'); const e = cur(); if (!el || !e) return;
  const f = el.dataset.f;
  if (f === 'name') { e.name = el.textContent.replace(/\s+/g, ' ').trimStart(); renderSide(); renderDocSoon(); }
  else if (f === 'summary') { e.summary = inlineText(el).trim(); renderDocSoon(); }
  else if (f === 'body') {
    e.body = blockText(el); el.classList.toggle('empty', !el.textContent.trim() && !el.querySelector('.mention, li'));
    const w = countWords(e.body), wEl = $('#kbWords'); if (wEl) wEl.textContent = `${w.toLocaleString()} ${w === 1 ? 'word' : 'words'}`;
  }
  else if (f === 'add') { const b = allScenes().flatMap(s => s.blocks).find(x => x.id === el.dataset.b); if (b) { b.body = inlineText(el).trim(); renderDocSoon(); } }
  else if (el.dataset.field) e.fields[el.dataset.field] = el.textContent.trim();
  else if (el.dataset.extraK) e.extra[+el.dataset.extraK].k = el.textContent.trim();
  else if (el.dataset.extraV) e.extra[+el.dataset.extraV].v = el.textContent.trim();
  markEdited();
});
kb.addEventListener('keydown', ev => {
  const el = ev.target.closest('[contenteditable="true"]'); if (!el) return;
  const single = el.dataset.f === 'name' || el.classList.contains('fv') || el.classList.contains('fk');
  if (ev.key === 'Enter' && el.dataset.f === 'name') { ev.preventDefault(); return placeCaret(kb.querySelector('[data-f="summary"]') || el); }
  if (ev.key === 'Enter' && single) { ev.preventDefault(); el.blur(); }
  if (ev.key === 'Enter' && el.dataset.f === 'summary' && !ev.shiftKey) { ev.preventDefault(); el.blur(); }
  if (ev.key === '@' && !single) { ev.preventDefault(); startMention(el); }
});
kb.addEventListener('focusout', ev => {
  const el = ev.target.closest('[contenteditable="true"]'); if (!el) return;
  if (pop.contains(ev.relatedTarget)) return;
  const e = cur();
  if (el.dataset.f === 'name' && e) {
    if (e.fresh && e.name.trim()) {
      const next = ev.relatedTarget?.dataset?.f;
      finishNew(e); renderKB(); renderSide(); history.replaceState(null, '', '#' + e.id);
      if (next) placeCaret(kb.querySelector(`[data-f="${next}"]`));
    }
    else if (!e.fresh) { if (!e.name.trim()) { e.name = 'Untitled entry'; el.textContent = e.name; } buildAuto(); renderDoc(); renderSide(); }
  }
  if ((el.dataset.f === 'summary' || el.dataset.f === 'add') && e) renderDoc();
  flush();
});
kb.addEventListener('paste', ev => {
  const el = ev.target.closest('[contenteditable="true"]'); if (!el) return;
  ev.preventDefault();
  const text = ev.clipboardData.getData('text/plain');
  document.execCommand('insertText', false, el.dataset.f === 'body' ? text : text.replace(/\s*\n\s*/g, ' '));
});

// Sidebar search, popover filters
document.addEventListener('input', ev => {
  if (ev.target.id === 'sideQ') { state.sideQ = ev.target.value; renderSide(); if (state.kb.open) renderKB(); return; }
  if (ev.target.dataset.filter && popCtx?.render) pop.querySelector('.list').innerHTML = popCtx.render(ev.target.value.trim().toLowerCase());
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') {
    if (pop.classList.contains('open')) { ev.preventDefault(); return closePop(true); }
    if (state.kb.open) { ev.preventDefault(); return closeKB(); }
  }
  if (state.kb.open && ev.altKey && (ev.key === 'ArrowUp' || ev.key === 'ArrowDown')) { ev.preventDefault(); step(ev.key === 'ArrowUp' ? -1 : 1); }
  if (pop.classList.contains('open') && ev.key === 'Enter' && ev.target.matches('#pop input[data-filter]')) { ev.preventDefault(); pop.querySelector('.list .item:not(:disabled)')?.click(); }
  if (pop.classList.contains('open') && ev.key === 'Enter' && ev.target.id === 'ncName') { ev.preventDefault(); pop.querySelector('[data-cmd="create-cat"]').click(); }
  if (pop.classList.contains('open') && ev.key === 'Enter' && ev.target.id === 'impUrl') { ev.preventDefault(); pop.querySelector('[data-cmd="do-import"]').click(); }
});
document.addEventListener('mousedown', ev => { if (ev.target.closest('[data-fmt]')) ev.preventDefault(); });

$('#sideToggle').addEventListener('click', () => { state.side = !state.side; $('#ws').classList.toggle('no-side', !state.side); });

function syncPreview() {
  const th = document.documentElement.getAttribute('data-theme') || 'system', dn = document.documentElement.getAttribute('data-density') || 'compact';
  document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeSet === th));
  document.querySelectorAll('[data-dens-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.densSet === dn));
}

// ---------- Start ----------
buildAuto(); renderSide(); renderDoc(); syncPreview();
function fromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === 'new') newEntry();
  else if (entry(h)) openKB(h);
}
if (!location.hash) openKB('goodhart'); else fromHash();
addEventListener('hashchange', fromHash);
</script>
