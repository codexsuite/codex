<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex · Plan (reference)</title>
<!--
  Reference implementation of the Plan screen (#1) inside the book workspace chrome (#6).
  Open directly in a browser. Uses ../tokens.css only; no build step.
  Working: drag-reorder of acts / chapters / scenes (grip handles or Alt+arrows on a grip),
  click-to-edit with simulated websocket autosave, + Codex / Label pickers, "@" inline Codex
  mentions, drag a Codex entry onto a scene, sidebar "where used" highlight, Board / Outline views,
  archive / restore scenes, the Knowledge base entry panel, ?book= for any Library book (stub boards,
  series categories, ?book=new, ?book=pe-v1&imported=1) and #scene= / #chapter= / #kb= / #entry= deep links.
  The "Preview" panel bottom-right is a review aid, not part of the design.
-->
<link rel="stylesheet" href="../tokens.css">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--color-bg); color: var(--color-text); font: var(--text-base)/var(--leading) var(--font-sans); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
button, input { font: inherit; color: inherit; }
svg { flex: none; }
.spacer { flex: 1; }
.dim-t { color: var(--color-muted); }

/* Shared controls (same as library.html) */
.btn { display: inline-flex; align-items: center; gap: 5px; height: var(--control-height); padding: 0 10px; border-radius: var(--radius-sm); border: 1px solid var(--color-border); background: var(--color-surface); font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--color-surface-2); }
.btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-fg); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--color-surface-2); }
.btn svg, .seg svg, .ib svg, .mini svg { width: 13px; height: 13px; }
.btn:focus-visible, .seg button:focus-visible, .ib:focus-visible, .mini:focus-visible, .grip:focus-visible, .tab:focus-visible, .search:focus-within, .entry:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.search { display: flex; align-items: center; gap: 6px; height: var(--control-height); width: 200px; max-width: 100%; padding: 0 var(--space-2); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); }
.search svg { width: 13px; height: 13px; color: var(--color-muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: 0; font-size: var(--text-sm); }
.search input::placeholder { color: var(--color-muted); }
.sel { display: inline-flex; align-items: center; gap: 4px; height: var(--control-height); padding: 0 var(--space-2); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); font-size: var(--text-sm); white-space: nowrap; cursor: pointer; }
.sel em { font-style: normal; color: var(--color-muted); }
.sel svg { width: 11px; height: 11px; color: var(--color-muted); }
.seg { display: inline-flex; height: var(--control-height); border: 1px solid var(--color-border); border-radius: var(--radius-sm); overflow: hidden; background: var(--color-surface); }
.seg button { display: inline-flex; align-items: center; gap: 4px; padding: 0 9px; border: 0; border-right: 1px solid var(--color-border); background: transparent; color: var(--color-muted); font-size: var(--text-sm); cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--color-accent-soft); color: var(--color-text); font-weight: var(--weight-semibold); }
.overline { font-size: var(--text-2xs); font-weight: var(--weight-medium); color: var(--color-muted); text-transform: uppercase; letter-spacing: .02em; }
.ib { display: inline-grid; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: var(--radius-xs); background: transparent; color: var(--color-muted); cursor: pointer; }
.ib:hover { background: var(--color-surface-2); color: var(--color-text); }
.cover.thumb { width: 20px; aspect-ratio: 2 / 3; border-radius: 2px; background: linear-gradient(160deg, #05070d, #0d1a2b); box-shadow: 0 0 0 1px rgb(0 0 0 / .15); flex: none; }

/* Book header (#6 shared chrome) */
.bookbar { height: var(--bar-height); flex: none; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-2); background: var(--color-surface); border-bottom: 1px solid var(--color-border); min-width: 0; }
.book-id { display: flex; align-items: center; gap: 7px; min-width: 0; padding-right: var(--space-2); border-right: 1px solid var(--color-border); height: 100%; }
.book-id .t { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
.book-id b { font-size: var(--text-sm); font-weight: var(--weight-semibold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
.book-id span { font-size: var(--text-2xs); color: var(--color-muted); white-space: nowrap; }
.tabs { display: flex; height: 100%; }
.tab { position: relative; display: inline-flex; align-items: center; padding: 0 10px; border: 0; background: none; color: var(--color-muted); font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer; text-decoration: none; }
.tab:hover { color: var(--color-text); }
.tab[aria-selected="true"] { color: var(--color-text); font-weight: var(--weight-semibold); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--color-accent); }
.tab .badge { margin-left: 5px; }
.tabs .vr { width: 1px; height: 16px; margin: 0 4px; align-self: center; background: var(--color-border); }
.badge { display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: color-mix(in srgb, var(--tone) 16%, transparent); color: var(--tone); font-size: var(--text-2xs); font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; }
.scope { display: flex; align-items: center; gap: var(--space-2); min-width: 0; font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.sync { display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; }
.sync i { width: 6px; height: 6px; border-radius: 50%; background: var(--color-ok); }
.sync[data-s="editing"] i { background: var(--color-warn); }
.sync[data-s="saving"] i { background: var(--color-accent); animation: pulse .7s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: .25; } }
.avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--color-accent-soft); color: var(--color-accent); font-size: 10px; font-weight: 700; display: grid; place-items: center; flex: none; }

/* Workspace */
.ws { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); }
.ws.no-side { grid-template-columns: minmax(0, 1fr); }
.ws.no-side .side { display: none; }
.ws.has-panel { grid-template-columns: var(--sidebar-width) minmax(0, 1fr) var(--panel-width); }
.ws.no-side.has-panel { grid-template-columns: minmax(0, 1fr) var(--panel-width); }

/* Sidebar: Codex · Snippets · Chats */
.side { min-height: 0; display: flex; flex-direction: column; background: var(--color-surface); border-right: 1px solid var(--color-border); }
.side-h { padding: 10px var(--space-3) 0; font-size: var(--text-md); font-weight: var(--weight-semibold); }
.side-tools { display: flex; gap: 6px; padding: var(--space-2); }
.side-tools .search { width: auto; flex: 1; }
.side-new { padding: 0 var(--space-2) var(--space-2); }
.side-new .btn { width: 100%; justify-content: center; }
.side-list { flex: 1; overflow: auto; padding: 0 var(--space-1) var(--space-3); }
.cat-h { display: flex; align-items: center; gap: 6px; padding: 10px 6px 4px; font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .04em; color: var(--color-muted); }
.cat-h i, .dot { width: 7px; height: 7px; border-radius: 2px; background: var(--cat); flex: none; }
.entry { width: 100%; display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 6px; border: 0; border-radius: var(--radius-sm); background: none; font-size: var(--text-sm); text-align: left; cursor: pointer; }
.entry:hover { background: var(--color-surface-2); }
.entry[aria-pressed="true"] { background: var(--color-accent-soft); font-weight: var(--weight-medium); }
.entry .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry .u { font-size: var(--text-2xs); color: var(--color-muted); font-variant-numeric: tabular-nums; }
.erow { position: relative; }
.erow > .ib { position: absolute; right: 3px; top: 3px; }
@media (hover: hover) {
  .erow > .ib { opacity: 0; }
  .erow:hover > .ib, .erow:focus-within > .ib { opacity: 1; }
  .erow:hover .u, .erow:focus-within .u { visibility: hidden; }
}
@media (hover: none) { .erow .entry { padding-right: 28px; } }
.erow .entry.open { box-shadow: inset 2px 0 0 var(--color-accent); }
.side-empty { padding: var(--space-5) var(--space-3); text-align: center; color: var(--color-muted); font-size: var(--text-sm); }
/* Series-level categories (book_scope) sit under their own overline */
.scope-h { display: flex; align-items: center; gap: 6px; margin: 8px 6px 0; padding-top: 6px; border-top: 1px solid var(--color-border); font-size: var(--text-2xs); color: var(--color-muted); }
.scope-h:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.scope-h b { font-weight: var(--weight-semibold); color: var(--color-text); }
.scope-h svg { width: 11px; height: 11px; }

/* Plan toolbar */
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.toolbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--space-2); padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--color-border); }
.hl-chip { display: inline-flex; align-items: center; gap: 6px; height: var(--control-height); padding: 0 4px 0 9px; border-radius: var(--radius-sm); background: var(--color-accent-soft); font-size: var(--text-sm); white-space: nowrap; }
.hl-chip .dim-t { font-size: var(--text-xs); }

/* Board */
.board { flex: 1; min-height: 0; overflow: auto; padding: var(--space-2) var(--space-3) var(--space-5); }
.act { padding: var(--space-2) 0 var(--space-3); }
.act + .act { border-top: 1px solid var(--color-border); }
.act-h { display: flex; align-items: center; gap: 4px; margin-left: -4px; }
.act-h h2 { margin: 0; font-size: var(--text-lg); font-weight: var(--weight-semibold); display: flex; gap: 6px; min-width: 0; }
.act-h h2 .act-n { color: var(--color-muted); white-space: nowrap; }
.chev svg { transition: transform .12s; }
.act.collapsed .chev svg { transform: rotate(-90deg); }
.act-tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin: 6px 0 10px 44px; }
.split { display: inline-flex; height: var(--control-height); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); overflow: hidden; }
.split > button { display: inline-flex; align-items: center; gap: 5px; padding: 0 8px; border: 0; border-right: 1px solid var(--color-border); background: none; font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer; color: var(--color-text); }
.split > button:last-child { border-right: 0; }
.split > button:hover { background: var(--color-surface-2); }
.split svg { width: 13px; height: 13px; }
.act-meta { font-size: var(--text-xs); color: var(--color-muted); font-variant-numeric: tabular-nums; }
.act.collapsed .cols { display: none; }
.act.collapsed .act-tools { margin-bottom: 0; }

.cols { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px; padding: 0 0 8px 44px; }
.col { flex: 0 0 var(--column-width); max-width: 100%; min-width: 0; display: flex; flex-direction: column; background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); }
.col-h { display: flex; align-items: flex-start; gap: 2px; padding: 6px 4px 6px 2px; border-bottom: 1px solid var(--color-border); }
.col-t { flex: 1; min-width: 0; padding-top: 1px; }
.col-t .overline { display: flex; gap: 6px; }
.col-t .overline span { text-transform: none; letter-spacing: 0; }
.scenes { display: flex; flex-direction: column; gap: 6px; padding: 6px; min-height: 40px; }
.newscene { margin: 0 6px 6px; height: var(--control-height); border: 0; border-radius: var(--radius-sm); background: none; color: var(--color-muted); font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
.newscene:hover { background: var(--color-surface); color: var(--color-text); }
.newscene svg { width: 12px; height: 12px; }
.addcol { flex: 0 0 140px; min-height: 90px; display: grid; place-items: center; border: 1px dashed var(--color-border); border-radius: var(--radius-md); background: none; color: var(--color-muted); font-size: var(--text-sm); cursor: pointer; }
.addcol:hover, .addact:hover { border-color: var(--color-accent); color: var(--color-accent); }
.addact { width: 100%; height: 38px; margin-top: var(--space-2); border: 1px dashed var(--color-border); border-radius: var(--radius-md); background: none; color: var(--color-muted); font-size: var(--text-sm); cursor: pointer; }

/* Scene card */
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-sm); box-shadow: var(--shadow-raised); transition: opacity .12s; }
.sc-h { display: flex; align-items: center; gap: 2px; padding: 3px 3px 3px 1px; border-bottom: 1px solid var(--color-border); min-width: 0; }
.sc-n { font-size: var(--text-xs); font-weight: var(--weight-semibold); white-space: nowrap; margin-right: 4px; }
.sc-labels { display: flex; gap: 4px; min-width: 0; overflow: hidden; flex: 1; }
.lbl { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; height: 17px; border-radius: 9px; background: var(--color-surface-2); font-size: var(--text-2xs); font-weight: var(--weight-medium); white-space: nowrap; }
.lbl i { width: 6px; height: 6px; border-radius: 50%; background: var(--tone); }
.sc-title { padding: 6px 8px 0; font-size: var(--text-sm); font-weight: var(--weight-medium); overflow-wrap: anywhere; outline: 0; border-radius: 2px; }
.sc-title:empty::before { content: attr(data-placeholder); color: var(--color-muted); }
.sc-title + .sc-body { min-height: 36px; padding-top: 4px; }
.sc-body { min-height: 52px; padding: 6px 8px; font-size: var(--text-base); white-space: pre-wrap; overflow-wrap: anywhere; outline: 0; border-radius: 2px; }
.sc-body:empty::before { content: attr(data-placeholder); color: var(--color-muted); }
.links { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 8px 4px; }
.sc-f { display: flex; align-items: center; gap: 2px; padding: 0 4px 4px; }
.mini { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; border: 0; border-radius: var(--radius-xs); background: none; color: var(--color-muted); font-size: var(--text-xs); font-weight: var(--weight-medium); cursor: pointer; white-space: nowrap; }
.mini:hover { background: var(--color-surface-2); color: var(--color-text); }
.mini svg { width: 11px; height: 11px; }
.words { font-size: var(--text-2xs); color: var(--color-muted); font-variant-numeric: tabular-nums; white-space: nowrap; padding-right: 4px; }
.words.none { font-style: italic; }

/* Codex mention / link chip: tinted by its category colour */
.mention, .cx { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: 4px; background: color-mix(in srgb, var(--cat) 14%, transparent); color: var(--color-text); font-size: .92em; font-weight: var(--weight-medium); line-height: 1.55; white-space: nowrap; cursor: pointer; vertical-align: baseline; }
.mention { box-shadow: inset 0 -1.5px 0 var(--cat); border-radius: 3px 3px 0 0; padding: 0 3px; }
.cx { height: 19px; font-size: var(--text-2xs); }
.cx i { width: 6px; height: 6px; border-radius: 2px; background: var(--cat); }
.cx b { font-weight: inherit; }
.cx .x { display: none; margin-right: -3px; padding: 0; border: 0; background: none; color: var(--color-muted); cursor: pointer; font-size: 12px; line-height: 1; }
.cx:hover .x { display: inline; }

/* Editable fields: click to edit, focus ring like an input */
[data-field] { cursor: text; outline: 0; border-radius: var(--radius-xs); }
[data-field]:hover { background: color-mix(in srgb, var(--color-surface-2) 60%, transparent); }
[data-field]:focus { background: var(--color-surface); box-shadow: 0 0 0 2px var(--color-accent); }
.col-t [data-field] { display: block; font-size: var(--text-md); font-weight: var(--weight-semibold); line-height: 1.3; padding: 0 2px; margin-left: -2px; overflow-wrap: anywhere; }
.act-h [data-field] { padding: 0 3px; }

/* Hover-revealed icons (always visible on touch) */
@media (hover: hover) {
  .sc-h .ib, .col-h .ib, .grip { opacity: 0; }
  .scene:hover .ib, .scene:focus-within .ib, .col-h:hover .ib, .col-h:focus-within .ib,
  .scene:hover .grip, .col-h:hover .grip, .act-h:hover .grip, .grip:focus-visible { opacity: 1; }
}
.grip { display: inline-grid; place-items: center; width: 18px; height: 22px; padding: 0; border: 0; border-radius: var(--radius-xs); background: none; color: var(--color-muted); cursor: grab; flex: none; }
.grip:hover { background: var(--color-surface-2); color: var(--color-text); }
.grip svg { width: 10px; height: 14px; }

/* Drag & highlight states */
.dragging { opacity: .35; }
.scene.drop-target { box-shadow: 0 0 0 2px var(--color-accent); }
#dropline { position: fixed; z-index: 30; pointer-events: none; background: var(--color-accent); border-radius: 2px; display: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--color-accent) 25%, transparent); }
.scene.dim { opacity: .3; }
.scene.hit { box-shadow: 0 0 0 2px var(--color-accent), var(--shadow-raised); }
.scene.flash, .col.flash { animation: flash 1.8s ease-out; }
@keyframes flash { from, 30% { box-shadow: 0 0 0 3px var(--color-accent); } }

/* Import summary banner (?imported=1) */
.banner { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 8px; align-items: start; margin: var(--space-1) 0 var(--space-2); padding: 8px 6px 8px 10px; border: 1px solid color-mix(in srgb, var(--color-info) 40%, var(--color-border)); border-radius: var(--radius-md); background: color-mix(in srgb, var(--color-info) 8%, var(--color-surface)); font-size: var(--text-sm); }
.banner > svg { width: 16px; height: 16px; margin-top: 1px; color: var(--color-info); }
.banner b { font-weight: var(--weight-semibold); }
.banner p { margin: 2px 0 0; font-size: var(--text-xs); color: var(--color-muted); }
.banner .acts { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: 4px; }
.link { padding: 0; border: 0; background: none; color: var(--color-accent); font-size: var(--text-xs); font-weight: var(--weight-medium); cursor: pointer; }
.link:hover { text-decoration: underline; }
.act-h [data-field]:empty::before { content: attr(data-placeholder); color: var(--color-muted); font-weight: var(--weight-regular); }
.act-empty { font-size: var(--text-xs); color: var(--color-muted); }

/* Outline view */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); }
table { width: 100%; min-width: 680px; border-collapse: collapse; font-size: var(--text-sm); }
th { text-align: left; padding: 7px 10px; font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--color-muted); text-transform: uppercase; letter-spacing: .04em; background: var(--color-surface-2); border-bottom: 1px solid var(--color-border); white-space: nowrap; }
td { height: var(--row-height); padding: 4px 10px; border-bottom: 1px solid var(--color-border); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.grp td { height: 28px; background: var(--color-bg); color: var(--color-muted); font-size: var(--text-xs); font-weight: var(--weight-semibold); }
tr.chap td { font-weight: var(--weight-semibold); }
tr.srow:hover td { background: var(--color-accent-soft); cursor: pointer; }
tr.srow.dim td { opacity: .35; }
tr.arch td { color: var(--color-muted); }
tr.arch td .clip { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--color-muted) 50%, transparent); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.clip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }

/* Popover menu / picker */
#pop { position: fixed; z-index: 40; width: 236px; max-height: 320px; display: none; flex-direction: column; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-raised), 0 12px 32px -12px rgb(0 0 0 / .35); overflow: hidden; }
#pop.open { display: flex; }
#pop .search { width: auto; margin: 6px; }
#pop .list { overflow: auto; padding: 0 4px 4px; }
#pop .item { width: 100%; display: flex; align-items: center; gap: 7px; min-height: 28px; padding: 0 8px; border: 0; border-radius: var(--radius-sm); background: none; font-size: var(--text-sm); text-align: left; cursor: pointer; }
#pop .item:hover, #pop .item.on { background: var(--color-accent-soft); }
#pop .item .k { margin-left: auto; font-size: var(--text-2xs); color: var(--color-muted); font-family: var(--font-mono); }
#pop .item.danger { color: var(--color-danger); }
#pop a.item { color: var(--color-text); text-decoration: none; }
#pop .sep { height: 1px; margin: 4px 0; background: var(--color-border); }
#pop .cat-h { padding: 6px 8px 2px; }
#pop.wide { width: 320px; max-width: calc(100vw - 16px); }

const catName = c => CATS[c] || STARTER_CATS[c];
const catSel = c => `<button class="sel" data-cmd="kb-cat" aria-label="Category"><span class="dot" style="--cat:var(--category-${c})"></span>${esc(catName(c))}${I.chev}</button>`;
const aliasesHTML = e => e.aliases.map((a, i) => `<span class="alias">${esc(a)}<button data-cmd="rm-alias" data-i="${i}" aria-label="Remove alias ${esc(a)}">×</button></span>`).join('')
  + `<input class="alias-in" placeholder="${e.aliases.length ? 'Add…' : 'Add an alias…'}" aria-label="Add alias">`;
function panelHTML() {
  const p = state.panel;
  if (p.mode === 'new') {
    return `<div class="p-h"><div class="p-top"><span class="dot" style="--cat:var(--category-${p.cat})"></span>
        <span class="p-name" data-field="kb-name" contenteditable="true" spellcheck="false" data-placeholder="Entry name">${esc(p.name)}</span>
        <button class="ib" data-cmd="close-panel" aria-label="Close" title="Close (Esc)">${I.x}</button></div>
        <div class="by">New Knowledge base entry${SERIES_CATS.has(p.cat) ? ` · shared with every book in ${esc(SERIES_NAMES[BOOK.series])}` : ''}</div></div>
      <section class="sec"><div class="fields"><label>Category</label><div class="fld">${catSel(p.cat)}</div></div>
        <div class="p-acts"><button class="btn ghost" data-cmd="close-panel">Cancel</button><button class="btn primary" data-cmd="kb-create">Create</button></div></section>`;
  }
  const e = entry(p.id), cl = `style="--cat:var(--category-${e.cat})"`;
  const used = [], adds = [];
  for (const s of allScenes()) {
    const linked = s.codex.includes(e.id), mentioned = [...s.summary.matchAll(TOKEN)].some(m => m[1] === e.id);
    if (linked || mentioned) used.push({ s, how: [linked && 'Linked', mentioned && 'Mentioned'].filter(Boolean).join(' · ') });
    s.adds.filter(x => x.e === e.id).forEach(x => adds.push({ s, text: x.text }));
  }
  const at = s => { const [c, n] = sceneNo(s.id).split('.'); return `Chapter ${c} · Scene ${n}`; };
  return `<div class="p-h"><div class="p-top"><span class="dot" ${cl}></span>
        <span class="p-name" data-field="kb-name" contenteditable="true" spellcheck="false" data-placeholder="Entry name">${esc(e.name)}</span>
        <button class="ib" data-cmd="close-panel" aria-label="Close" title="Close (Esc)">${I.x}</button></div>
      ${SERIES_CATS.has(e.cat) ? `<div class="by">From ${esc(SERIES_NAMES[BOOK.series])} · changes apply to every book in the series</div>` : ''}</div>
    <section class="sec"><div class="fields">
      <label>Category</label><div class="fld">${catSel(e.cat)}</div>
      <label class="top">Aliases</label><div class="fld" id="kbAliases">${aliasesHTML(e)}</div>
      <label class="top">Summary</label><div class="fld"><div class="p-sum" data-field="kb-summary" contenteditable="true" data-placeholder="What the model should know about ${esc(e.name)}…">${esc(e.summary)}</div></div>
      <label class="top">Always in context</label><div class="fld"><button class="switch" role="switch" aria-checked="${e.always}" data-cmd="kb-always" aria-label="Always in context"></button>
        <span class="hint">${e.always ? 'Sent with every generation in this book.' : 'Sent only when a scene or beat uses it.'}</span></div>
    </div></section>
    <section class="sec"><div class="sec-h"><h3>Used in</h3><span class="k">${used.length} ${used.length === 1 ? 'scene' : 'scenes'}</span></div>
      ${used.length ? used.map(({ s, how }) => `<button class="used" data-goto="${s.id}" title="Show on the board"><span class="overline">${at(s)}<span>${how}</span></span><span class="clip">${esc(plain(s)) || '<span class="dim-t">Empty scene</span>'}</span></button>`).join('')
        : '<div class="p-empty">Not used yet. Drag the entry onto a scene, or type <b>@</b> in a summary.</div>'}</section>
    <section class="sec"><div class="sec-h"><h3>Additions</h3><span class="k">${adds.length}</span></div>
      ${adds.length ? adds.map(x => `<div class="addn" ${cl}><div class="overline">${at(x.s)}</div>${esc(x.text)}</div>`).join('')
        : '<div class="p-empty">No additions. In Write, type <b>/</b> → <b>Codex addition</b> to record what changes from a scene on.</div>'}</section>
    <div class="p-foot"><button class="btn ghost danger-t" data-cmd="kb-delete">Delete entry</button></div>`;
}
function renderPanel() {
  if (state.panel?.id && !entry(state.panel.id)) state.panel = null;
  $('#ws').classList.toggle('has-panel', !!state.panel);
  $('#panel').innerHTML = state.panel ? panelHTML() : '';
}
function openEntry(eid) { state.panel = { id: eid }; render(); }
function newEntry() {
  state.panel = { mode: 'new', name: '', cat: Object.keys(CATS)[0] || 'person' };
  render(); focusField('#panel [data-field="kb-name"]');
}
function createEntry() {
  const p = state.panel, name = p.name.trim();
  if (!name) { toast('Name the entry first'); return focusField('#panel [data-field="kb-name"]'); }
  let eid = slugify(name); while (entry(eid)) eid += '-2';
  if (!CATS[p.cat]) CATS[p.cat] = STARTER_CATS[p.cat];
  ENTRIES.push(kb(eid, p.cat, name, [], ''));
  state.panel = { id: eid };
  commit(`Created <b>${esc(name)}</b> in ${esc(CATS[p.cat])}`);
  focusField('#panel [data-field="kb-summary"]');
}
function deleteEntry() {
  const e = entry(state.panel.id);
  snapshot();
  ENTRIES.splice(ENTRIES.indexOf(e), 1);
  // Links go, mentions turn back into plain text, additions go with the entry
  for (const s of [...allScenes(), ...state.archived.map(x => x.s)]) {
    s.codex = s.codex.filter(x => x !== e.id);
    s.summary = s.summary.replaceAll(`[[e:${e.id}]]`, e.name);
    s.adds = s.adds.filter(x => x.e !== e.id);
  }
  if (state.highlight === e.id) state.highlight = null;
  state.panel = null;
  commit(`Deleted <b>${esc(e.name)}</b>`, true);
}
function addAlias(inp) {
  const v = inp.value.trim(), e = entry(state.panel?.id);
  inp.value = '';
  if (!e || !v || e.aliases.some(a => a.toLowerCase() === v.toLowerCase())) return false;
  e.aliases.push(v); markDirty(); return true;
}

function render() { renderBoard(); renderSide(); renderChrome(); renderPanel(); }

// ---------- Autosave (simulated websocket): X seconds after first change, and on blur ----------
const SYNC_MS = 3000;
const sync = { dirty: false, timer: null, at: Date.now() };
function setSync(s) {
  const el = $('#sync'); el.dataset.s = s;
  const ago = Math.round((Date.now() - sync.at) / 1000);
  el.querySelector('.lbl-t').textContent = s === 'editing' ? `Unsaved · syncing in ${SYNC_MS / 1000}s` : s === 'saving' ? 'Saving…' : `Saved${ago < 5 ? ' · just now' : ago < 60 ? ` · ${ago}s ago` : ` · ${Math.round(ago / 60)}m ago`}`;
}
function markDirty() { sync.dirty = true; setSync('editing'); sync.timer ??= setTimeout(flush, SYNC_MS); }
function flush() {
  clearTimeout(sync.timer); sync.timer = null;
  if (!sync.dirty) return;
  sync.dirty = false; setSync('saving');
  setTimeout(() => { sync.at = Date.now(); sync.dirty ? setSync('editing') : setSync('saved'); renderSide(); renderChrome(); }, 450);
}
setInterval(() => { if ($('#sync').dataset.s === 'saved') setSync('saved'); }, 10000);

// ---------- Undo + toast ----------
let undoSnap = null, toastT;
const snapshot = () => { undoSnap = structuredClone({ acts: state.acts, archived: state.archived, entries: ENTRIES, cats: CATS }); };
function undo() {
  const u = undoSnap; undoSnap = null;
  state.acts = u.acts; state.archived = u.archived;
  ENTRIES.splice(0, ENTRIES.length, ...u.entries);
  for (const k in CATS) delete CATS[k];
  Object.assign(CATS, u.cats);
}
function toast(html, undo) {
  const t = $('#toast');
  t.innerHTML = `<span>${html}</span>${undo ? '<button data-cmd="undo">Undo</button>' : ''}`;
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 4200);
}
function commit(msg, undo) { markDirty(); flush(); render(); if (msg) toast(msg, undo); }

// ---------- Inline editing ----------
function serialize(el) {
  let out = '';
  el.childNodes.forEach(n => {
    if (n.nodeType === 3) out += n.nodeValue;
    else if (n.dataset?.e) out += `[[e:${n.dataset.e}]]`;
    else if (n.nodeName === 'BR') out += '\n';
    else { if (out && !out.endsWith('\n')) out += '\n'; out += serialize(n); }
  });
  return out;
}
document.addEventListener('input', e => {
  const f = e.target.closest?.('[data-field]');
  if (!f) return;
  if (f.dataset.field === 'summary') locate('scene', f.closest('[data-scene]').dataset.scene).s.summary = serialize(f).replace(/\n$/, '');
  if (f.dataset.field === 'sctitle') locate('scene', f.closest('[data-scene]').dataset.scene).s.title = f.textContent.trim();
  if (f.dataset.field === 'chtitle') locate('chapter', f.closest('[data-ch]').dataset.ch).c.title = f.textContent.trim();
  if (f.dataset.field === 'acttitle') locate('act', f.closest('[data-a]').dataset.a).a.title = f.textContent.trim();
  if (f.dataset.field === 'kb-name') {
    const t = f.textContent.trim();
    if (state.panel.mode === 'new') { state.panel.name = t; return; }   // nothing to save until Create
    if (!t) return;
    entry(state.panel.id).name = t; renderBoard(); renderSide();
  }
  if (f.dataset.field === 'kb-summary') entry(state.panel.id).summary = f.innerText.trim();
  markDirty();
});
document.addEventListener('focusout', e => {
  if (e.target.matches?.('.alias-in') && addAlias(e.target)) $('#kbAliases').innerHTML = aliasesHTML(entry(state.panel.id));
  if (e.target.closest?.('[data-field]')) flush();
});
document.addEventListener('paste', e => {
  if (!e.target.closest?.('[data-field]')) return;
  e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
});

// ---------- Popover (menus + pickers) ----------
const pop = $('#pop');
let popCtx = null;
function openPop(anchorRect, html, ctx, wide) {
  popCtx = ctx; pop.innerHTML = html; pop.classList.add('open'); pop.classList.toggle('wide', !!wide);
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let top = anchorRect.bottom + 4;
  if (top + h > innerHeight - 8) top = Math.max(8, anchorRect.top - h - 4);
  pop.style.left = Math.max(8, Math.min(anchorRect.left, innerWidth - w - 8)) + 'px';
  pop.style.top = top + 'px';
  pop.querySelector('input')?.focus();
}
function closePop() { pop.classList.remove('open'); popCtx = null; }
function codexList(q, current) {
  const ql = q.toLowerCase();
  return Object.entries(CATS).map(([cat, name]) => {
    const items = ENTRIES.filter(e => e.cat === cat && e.name.toLowerCase().includes(ql));
    return items.length ? `<div class="cat-h" style="--cat:var(--category-${cat})"><i></i>${name}</div>` + items.map(e =>
      `<button class="item" data-pick-e="${e.id}"><span class="dot" style="--cat:var(--category-${cat})"></span>${esc(e.name)}${current.has(e.id) ? '<span class="k">linked</span>' : ''}</button>`).join('') : '';
  }).join('') || '<div class="side-empty">No match. Enter creates a new entry.</div>';
}
function openCodexPicker(rect, sceneId, inlineRange) {
  const s = locate('scene', sceneId).s;
  openPop(rect, `<label class="search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg><input placeholder="${inlineRange ? 'Mention Codex entry…' : 'Link Codex entry…'}"></label><div class="list">${codexList('', refs(s))}</div>`,
    { kind: 'codex', sceneId, inlineRange });
  pop.querySelector('input').addEventListener('input', ev => { pop.querySelector('.list').innerHTML = codexList(ev.target.value, refs(s)); });
}
function pickCodex(eid) {
  const { sceneId, inlineRange } = popCtx; closePop();
  const { s } = locate('scene', sceneId);
  if (inlineRange) {
    const body = document.querySelector(`[data-scene="${sceneId}"] .sc-body`);
    body.focus();
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(inlineRange);
    const tpl = document.createElement('template'); tpl.innerHTML = mention(eid);
    const node = tpl.content.firstChild, space = document.createTextNode(' ');
    inlineRange.insertNode(space); inlineRange.insertNode(node);
    inlineRange.setStartAfter(space); inlineRange.collapse(true); sel.removeAllRanges(); sel.addRange(inlineRange);
    s.summary = serialize(body).replace(/\n$/, '');
    markDirty();
  } else if (!refs(s).has(eid)) {
    s.codex.push(eid); commit(`Linked <b>${esc(entry(eid).name)}</b>`);
  } else closePop();
}
function openLabelPicker(rect, sceneId) {
  const s = locate('scene', sceneId).s;
  openPop(rect, `<div class="list" style="padding-top:4px">${LABELS.map(l => `<button class="item" data-pick-l="${l.id}"><span class="lbl" style="--tone:var(--color-${l.tone});background:none;padding:0"><i></i></span>${esc(l.name)}${s.labels.includes(l.id) || l.series ? `<span class="k">${l.series ? 'Series' : ''}${s.labels.includes(l.id) ? ' ✓' : ''}</span>` : ''}</button>`).join('')}<div class="sep"></div><button class="item" disabled style="color:var(--color-muted)">${I.plus} New label…</button></div>`, { kind: 'label', sceneId });
}
function openMenu(rect, kind, xid) {
  const loc = locate(kind, xid);
  let items = [];
  // Open in Write / References are real links (G5): write.html#scene=n.m, #chapter=n; references.html#<refId>
  if (kind === 'scene') items = [['write', 'Open in Write', '↵', '', writeHref('scene=' + sceneNo(xid))],
    ...[...new Set(loc.s.uses.map(u => u[0]))].map(r => ['ref', `Open in References · ${REFS[r]}`, '', '', `references.html${BOOK_Q}#${r}`]),
    ['sep'], ['dup', 'Duplicate scene'], ['archive', 'Archive scene'], ['sep'], ['del', 'Delete scene', '', 'danger']];
  if (kind === 'chapter') items = [['write', 'Open in Write', '', '', writeHref('chapter=' + chapterNo(xid))], ['copyref', 'Copy reference', 'ch:' + loc.c.slug],
    ...state.acts.filter(a => a !== loc.a).map(a => ['move:' + a.id, `Move to Act ${state.acts.indexOf(a) + 1}: ${a.title}`]), ['sep'], ['del', 'Delete chapter', '', 'danger']];
  if (kind === 'act') items = [['toggle', loc.a.collapsed ? 'Expand act' : 'Collapse act'], ['sep'], ['del', 'Delete act', '', 'danger']];
  openPop(rect, `<div class="list" style="padding-top:4px">${items.map(([k, t, key, cls, href]) => k === 'sep' ? '<div class="sep"></div>'
    : href ? `<a class="item" data-link href="${esc(href)}">${esc(t)}${key ? `<span class="k">${esc(key)}</span>` : ''}</a>`
    : `<button class="item ${cls || ''}" data-mi="${k}">${esc(t)}${key ? `<span class="k">${esc(key)}</span>` : ''}</button>`).join('')}</div>`, { kind, xid }, kind === 'scene' && loc.s.uses.length);
}
function menuAction(k) {
  const { kind, xid } = popCtx; closePop();
  const loc = locate(kind, xid);
  if (k === 'copyref') { navigator.clipboard?.writeText('ch:' + loc.c.slug).catch(() => {}); return toast(`Copied <code>ch:${esc(loc.c.slug)}</code> · stays valid after reorder or rename (#4)`); }
  if (k === 'toggle') { loc.a.collapsed = !loc.a.collapsed; return render(); }
  snapshot();
  if (k === 'dup') { loc.c.scenes.splice(loc.si + 1, 0, { ...structuredClone(loc.s), id: id('s'), words: 0, uses: [], adds: [] }); return commit('Scene duplicated', true); }
  // Archive (scene.archived_at): off the board, the chapter renumbers, and its source uses are archived with it
  if (k === 'archive') {
    loc.c.scenes.splice(loc.si, 1); state.archived.push({ s: loc.s, ch: loc.c.id, si: loc.si });
    return commit(`Scene archived${usesNote(loc.s)}`, true);
  }
  if (k.startsWith('move:')) {
    const to = locate('act', k.slice(5)).a; loc.a.chapters.splice(loc.ci, 1); to.chapters.push(loc.c);
    return commit(`Moved to Act ${state.acts.indexOf(to) + 1} as Chapter ${chapterNo(loc.c.id)} · chapters renumbered`, true);
  }
  if (k === 'del') {
    if (kind === 'scene') loc.c.scenes.splice(loc.si, 1);
    if (kind === 'chapter') loc.a.chapters.splice(loc.ci, 1);
    if (kind === 'act') state.acts.splice(loc.ai, 1);
    commit(`${kind[0].toUpperCase() + kind.slice(1)} deleted`, true);
  }
}

// ---------- Clicks ----------
document.addEventListener('click', e => {
  const t = e.target;
  if (popCtx && !pop.contains(t) && !t.closest('[data-menu],[data-pick],[data-cmd="label-filter"]')) closePop();
  const pe = t.closest('[data-pick-e]'); if (pe) return pickCodex(pe.dataset.pickE);
  const pc = t.closest('[data-pick-cat]');
  if (pc) {
    const k = pc.dataset.pickCat; closePop();
    if (state.panel.mode === 'new') { state.panel.cat = k; return renderPanel(); }
    if (!CATS[k]) CATS[k] = STARTER_CATS[k];
    entry(state.panel.id).cat = k; return commit();
  }
  const rs = t.closest('[data-restore]'); if (rs) { closePop(); return restoreScene(rs.dataset.restore); }
  const pl = t.closest('[data-pick-l]');
  if (pl) {
    if (popCtx.kind === 'filter') { state.label = pl.dataset.pickL === 'any' ? null : pl.dataset.pickL; closePop(); return render(); }
    const s = locate('scene', popCtx.sceneId).s, l = pl.dataset.pickL; closePop();
    s.labels = s.labels.includes(l) ? s.labels.filter(x => x !== l) : [...s.labels, l];
    return commit();
  }
  const mi = t.closest('[data-mi]'); if (mi) return menuAction(mi.dataset.mi);
  const m = t.closest('[data-menu]');
  if (m) { const kind = m.dataset.menu; const host = m.closest(kind === 'scene' ? '[data-scene]' : kind === 'chapter' ? '[data-ch]' : '[data-a]'); return openMenu(m.getBoundingClientRect(), kind, host.dataset.scene || host.dataset.ch || host.dataset.a); }
  const pk = t.closest('[data-pick]');
  if (pk) { const sid = pk.closest('[data-scene]').dataset.scene; return pk.dataset.pick === 'codex' ? openCodexPicker(pk.getBoundingClientRect(), sid) : openLabelPicker(pk.getBoundingClientRect(), sid); }
  const en = t.closest('[data-entry]');
  if (en) { state.highlight = state.highlight === en.dataset.entry ? null : en.dataset.entry; return render(); }
  const cx = t.closest('.mention, .cx');
  if (cx && !t.closest('[data-cmd="unlink"]') && !t.closest('#pop')) { state.highlight = cx.dataset.e; return render(); }
  const go = t.closest('[data-goto]');
  if (go) {
    if (go.closest('#panel') && matchMedia('(max-width: 860px)').matches) state.panel = null;   // the sheet would cover the card
    return gotoScene(go.dataset.goto);
  }
  const c = t.closest('[data-cmd],[data-view],[data-theme-set],[data-dens-set]');
  if (!c) return;
  const html = document.documentElement;
  if (c.dataset.view) { state.view = c.dataset.view; return render(); }
  if (c.dataset.themeSet) { c.dataset.themeSet === 'system' ? delete html.dataset.theme : html.dataset.theme = c.dataset.themeSet; return renderChrome(); }
  if (c.dataset.densSet) { c.dataset.densSet === 'compact' ? delete html.dataset.density : html.dataset.density = c.dataset.densSet; return renderChrome(); }
  const cmd = c.dataset.cmd;
  const A = c.closest('[data-a]') && locate('act', c.closest('[data-a]').dataset.a)?.a;
  const C = c.closest('[data-ch]') && locate('chapter', c.closest('[data-ch]').dataset.ch)?.c;
  if (cmd === 'focus') {
    const f = c.closest('.scene, .col-h, .act')?.querySelector('[data-field]');
    f.focus(); const r = document.createRange(); r.selectNodeContents(f); r.collapse(false); getSelection().removeAllRanges(); getSelection().addRange(r);
  }
  if (cmd === 'toggle-act') { A.collapsed = !A.collapsed; render(); }
  if (cmd === 'toggle-all') { const all = state.acts.every(a => a.collapsed); state.acts.forEach(a => a.collapsed = !all); render(); }
  if (cmd === 'new-scene') { const s = sc(''); C.scenes.push(s); commit(); focusField(`[data-scene="${s.id}"] .sc-body`); }
  if (cmd === 'new-chapter') { const nc = ch('Untitled chapter', [sc('')]); A.chapters.push(nc); A.collapsed = false; commit(); focusField(`[data-ch="${nc.id}"] [data-field]`, true); }
  if (cmd === 'new-act') { state.view = 'board'; const na = act('Untitled act', [ch('Untitled chapter', [sc('')])]); state.acts.push(na); commit(); focusField(`[data-a="${na.id}"] [data-field="acttitle"]`, true); }
  if (cmd === 'unlink') { const s = locate('scene', c.closest('[data-scene]').dataset.scene).s; s.codex = s.codex.filter(x => x !== c.dataset.e); commit(); }
  if (cmd === 'clear-hl') { state.highlight = null; render(); }
  if (cmd === 'label-filter') openPop(c.getBoundingClientRect(), `<div class="list" style="padding-top:4px"><button class="item" data-pick-l="any">Any label${!state.label ? '<span class="k">✓</span>' : ''}</button><div class="sep"></div>${LABELS.map(l => `<button class="item" data-pick-l="${l.id}"><span class="lbl" style="--tone:var(--color-${l.tone});background:none;padding:0"><i></i></span>${esc(l.name)} <span class="k">${allScenes().filter(s => s.labels.includes(l.id)).length}</span></button>`).join('')}</div>`, { kind: 'filter' });
  if (cmd === 'undo' && undoSnap) { undo(); $('#toast').classList.remove('show'); commit(); }
  if (cmd === 'archived') openArchived(c.getBoundingClientRect());
  if (cmd === 'new-entry') newEntry();
  if (cmd === 'edit-entry') openEntry(c.dataset.e);
  if (cmd === 'close-panel') { state.panel = null; render(); }
  if (cmd === 'kb-create') createEntry();
  if (cmd === 'kb-delete') deleteEntry();
  if (cmd === 'kb-cat') openPop(c.getBoundingClientRect(), `<div class="list" style="padding-top:4px">${Object.keys(CATS).length ? '' : '<div class="grp" style="padding:4px 8px">New category</div>'}${Object.entries(Object.keys(CATS).length ? CATS : STARTER_CATS).map(([k, n]) => `<button class="item" data-pick-cat="${k}"><span class="dot" style="--cat:var(--category-${k})"></span>${esc(n)}${SERIES_CATS.has(k) ? '<span class="k">Series</span>' : ''}</button>`).join('')}</div>`, { kind: 'cat' });
  if (cmd === 'kb-always') { const e = entry(state.panel.id); e.always = !e.always; commit(); $('#panel [data-cmd="kb-always"]')?.focus(); }
  if (cmd === 'rm-alias') { entry(state.panel.id).aliases.splice(+c.dataset.i, 1); markDirty(); $('#kbAliases').innerHTML = aliasesHTML(entry(state.panel.id)); }
  if (cmd === 'dismiss-banner') { state.banner = false; renderBoard(); }
  if (cmd === 'undo-import') toast('Would delete <b>' + esc(BOOK.title) + '</b> and everything imported with it, then go back to Library');
});
// Jump to a scene card or chapter column: board view, expand its act, scroll to it and flash it
function gotoScene(sid, instant) {
  const loc = locate('scene', sid); if (!loc) return;
  state.view = 'board'; loc.a.collapsed = false; render();
  const card = document.querySelector(`[data-scene="${sid}"]`);
  card.scrollIntoView({ block: 'center', inline: 'center', behavior: instant ? 'instant' : 'smooth' }); card.classList.add('flash');
}
function gotoChapter(cid, instant) {
  state.view = 'board'; locate('chapter', cid).a.collapsed = false; render();
  const col = document.querySelector(`[data-ch="${cid}"]`);
  col.scrollIntoView({ block: 'start', inline: 'nearest', behavior: instant ? 'instant' : 'smooth' }); col.classList.add('flash');
}

// ---------- Archived scenes (G14) ----------
function openArchived(rect) {
  const rows = state.archived.map(x => {
    const n = chapterNo(x.ch), u = x.s.uses.length;
    return `<div class="arow"><div><span class="overline">${n ? `Chapter ${n} · was Scene ${x.si + 1}` : 'Its chapter was deleted'}</span>
      <span class="clip">${esc(plain(x.s)) || '<span class="dim-t">Empty scene</span>'}</span>${u ? `<span class="note">${u} source ${u === 1 ? 'use' : 'uses'} archived with it</span>` : ''}</div>
      <button class="mini" data-restore="${x.s.id}">Restore</button></div>`;
  }).join('');
  openPop(rect, `<div class="grp">Archived scenes</div><div class="list">${rows || '<div class="side-empty">Nothing archived. Card ⋯ → <b>Archive scene</b> takes a scene off the board without deleting it.</div>'}</div>`, { kind: 'archived' }, true);
}
function restoreScene(sid) {
  const x = state.archived.splice(state.archived.findIndex(a => a.s.id === sid), 1)[0];
  let c = locate('chapter', x.ch)?.c || state.acts.flatMap(a => a.chapters)[0];
  if (!c) { c = ch('Restored scenes', []); if (!state.acts.length) state.acts.push(act('', [])); state.acts[0].chapters.push(c); }
  const at = Math.min(x.si, c.scenes.length);
  c.scenes.splice(at, 0, x.s);
  commit(`Scene restored as Chapter ${chapterNo(c.id)} · Scene ${at + 1}${x.s.uses.length ? ` · ${x.s.uses.length} source ${x.s.uses.length === 1 ? 'use' : 'uses'} restored` : ''}`);
  if (state.view === 'board') gotoScene(x.s.id);
}

// ---------- Deep links (G5, G7): #scene=5.2, #chapter=5, #kb=<entry>, #entry=<entry> ----------
function applyHash(first) {
  const h = new URLSearchParams(location.hash.slice(1));
  let hl = h.get('kb');
  if (first && !hl) try { hl = sessionStorage.getItem(HL_KEY); } catch {}
  if (hl && entry(hl)) state.highlight = hl;
  if (h.get('entry') && entry(h.get('entry'))) state.panel = { id: h.get('entry') };
  render();
  if (h.has('scene')) {
    const [cn, sn] = h.get('scene').split('.').map(Number), s = sceneAt(cn, sn);
    s ? gotoScene(s.id, first) : toast(`This book has no Chapter ${esc(cn)} · Scene ${esc(sn)}`);
  } else if (h.has('chapter')) {
    const c = chapterAt(+h.get('chapter'));
    c ? gotoChapter(c.id, first) : toast(`This book has no Chapter ${esc(h.get('chapter'))}`);
  }
}

function focusField(sel, selectAll) {
  const f = document.querySelector(sel); if (!f) return;
  f.scrollIntoView({ block: 'nearest', inline: 'nearest' }); f.focus();
  const r = document.createRange(); r.selectNodeContents(f); if (!selectAll) r.collapse(false);
  getSelection().removeAllRanges(); getSelection().addRange(r);
}

// ---------- Keyboard: Enter commits titles, Esc blurs, @ mentions, Alt+arrows reorder ----------
document.addEventListener('keydown', e => {
  if (pop.classList.contains('open')) {
    if (e.key === 'Escape') { closePop(); return; }
    if (e.key === 'Enter' && e.target.closest('#pop')) { e.preventDefault(); pop.querySelector('[data-pick-e],[data-pick-l],[data-pick-cat],[data-link],[data-mi]')?.click(); return; }
  }
  // Alias input: Enter adds a chip and stays ready for the next; Esc clears
  if (e.target.matches?.('.alias-in')) {
    if (e.key === 'Enter') { e.preventDefault(); if (addAlias(e.target)) { $('#kbAliases').innerHTML = aliasesHTML(entry(state.panel.id)); $('#kbAliases .alias-in').focus(); } }
    if (e.key === 'Escape') { e.target.value = ''; e.target.blur(); }
    return;
  }
  const f = e.target.closest?.('[data-field]');
  if (f?.dataset.field === 'kb-name' && e.key === 'Enter' && state.panel?.mode === 'new') { e.preventDefault(); return createEntry(); }
  if (f) {
    if (e.key === 'Escape' || (e.key === 'Enter' && f.dataset.field !== 'summary' && f.dataset.field !== 'kb-summary')) { e.preventDefault(); f.blur(); return; }
    if (e.key === '@' && f.dataset.field === 'summary') {
      e.preventDefault();
      const range = getSelection().getRangeAt(0).cloneRange();
      let rect = range.getBoundingClientRect();
      if (!rect.width && !rect.height) rect = f.getBoundingClientRect();
      openCodexPicker(rect, f.closest('[data-scene]').dataset.scene, range);
      return;
    }
  }
  if (e.key === 'Escape' && state.panel) { state.panel = null; render(); return; }
  const g = e.target.closest?.('[data-grip]');
  if (g && e.altKey && e.key.startsWith('Arrow')) { e.preventDefault(); keyMove(g, e.key); }
});
function keyMove(g, key) {
  const kind = g.dataset.grip, d = key === 'ArrowUp' || key === 'ArrowLeft' ? -1 : 1;
  const host = g.closest(kind === 'scene' ? '[data-scene]' : kind === 'chapter' ? '[data-ch]' : '[data-a]');
  const xid = host.dataset.scene || host.dataset.ch || host.dataset.a;
  const loc = locate(kind, xid);
  if (kind === 'scene' && (key === 'ArrowLeft' || key === 'ArrowRight')) {
    const chs = state.acts.flatMap(a => a.chapters), i = chs.indexOf(loc.c) + d;
    if (!chs[i]) return;
    loc.c.scenes.splice(loc.si, 1); chs[i].scenes.push(loc.s);
  } else {
    const list = kind === 'scene' ? loc.c.scenes : kind === 'chapter' ? loc.a.chapters : state.acts;
    const from = kind === 'scene' ? loc.si : kind === 'chapter' ? loc.ci : loc.ai, to = from + d;
    if (to < 0 || to >= list.length) return;
    list.splice(to, 0, list.splice(from, 1)[0]);
  }
  commit();
  document.querySelector(`[data-${kind === 'scene' ? 'scene' : kind === 'chapter' ? 'ch' : 'a'}="${xid}"] [data-grip="${kind}"]`)?.focus();
}

// ---------- Drag & drop: acts, chapters, scenes; Codex entries onto scenes ----------
let drag = null;
const line = $('#dropline');
document.addEventListener('pointerdown', e => {
  const g = e.target.closest('[data-grip]');
  if (!g) return;
  const host = g.closest(g.dataset.grip === 'scene' ? '.scene' : g.dataset.grip === 'chapter' ? '.col' : '.act');
  host.draggable = true;
});
document.addEventListener('pointerup', () => document.querySelectorAll('[draggable="true"]:not([data-entry])').forEach(el => el.draggable = false));
document.addEventListener('dragstart', e => {
  const en = e.target.closest?.('[data-entry]');
  if (en) { drag = { type: 'codex', id: en.dataset.entry }; e.dataTransfer.effectAllowed = 'link'; e.dataTransfer.setData('text/plain', entry(en.dataset.entry).name); return; }
  const el = e.target;
  const type = el.matches('.scene') ? 'scene' : el.matches('.col') ? 'chapter' : el.matches('.act') ? 'act' : null;
  if (!type) return;
  drag = { type, id: el.dataset.scene || el.dataset.ch || el.dataset.a, el };
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', type);
  closePop();
  requestAnimationFrame(() => el.classList.add('dragging'));
});
function showLine(x, y, w, h) { Object.assign(line.style, { display: 'block', left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); }
function dropSlot(items, y) {
  // index among siblings by pointer position (vertical list)
  let i = 0;
  for (const it of items) { const r = it.getBoundingClientRect(); if (y > r.top + r.height / 2) i++; }
  return i;
}
function wrapSlot(items, x, y) {
  // index among wrapped columns: rows above the pointer count fully, the pointer's row by x
  let i = 0;
  for (const it of items) {
    const r = it.getBoundingClientRect();
    if (y > r.bottom + 5 || (y >= r.top - 5 && x > r.left + r.width / 2)) i++;
  }
  return i;
}
document.addEventListener('dragover', e => {
  if (!drag) return;
  document.querySelectorAll('.drop-target').forEach(x => x.classList.remove('drop-target'));
  line.style.display = 'none'; drag.target = null;
  if (drag.type === 'codex') {
    const card = e.target.closest?.('.scene');
    if (card) { e.preventDefault(); card.classList.add('drop-target'); drag.target = { scene: card.dataset.scene }; }
    return;
  }
  if (drag.type === 'scene') {
    const col = e.target.closest?.('.col'); if (!col) return;
    e.preventDefault();
    const list = col.querySelector('.scenes'), cards = [...list.children];
    const i = dropSlot(cards, e.clientY), lr = list.getBoundingClientRect();
    const y = !cards.length ? lr.top + 6 : i < cards.length ? cards[i].getBoundingClientRect().top - 4 : cards[cards.length - 1].getBoundingClientRect().bottom + 2;
    showLine(lr.left + 6, y, lr.width - 12, 2);
    drag.target = { ch: col.dataset.ch, index: i };
  }
  if (drag.type === 'chapter') {
    const row = e.target.closest?.('.cols'); if (!row) return;
    e.preventDefault();
    const cols = [...row.querySelectorAll(':scope > .col')], i = wrapSlot(cols, e.clientX, e.clientY);
    const ref = cols[Math.min(i, cols.length - 1)]?.getBoundingClientRect() || row.getBoundingClientRect();
    showLine(i < cols.length ? ref.left - 6 : ref.right + 4, ref.top, 2, Math.max(60, ref.height));
    drag.target = { act: row.closest('[data-a]').dataset.a, index: i };
  }
  if (drag.type === 'act') {
    const board = $('#board'); if (!board.contains(e.target)) return;
    e.preventDefault();
    const acts = [...board.querySelectorAll(':scope > .act')], i = dropSlot(acts, e.clientY), br = board.getBoundingClientRect();
    const y = i < acts.length ? acts[i].getBoundingClientRect().top : acts[acts.length - 1].getBoundingClientRect().bottom;
    showLine(br.left + 12, y - 1, br.width - 24, 3);
    drag.target = { index: i };
  }
});
document.addEventListener('drop', e => {
  if (!drag?.target) return;
  e.preventDefault();
  const t = drag.target;
  if (drag.type === 'codex') {
    const s = locate('scene', t.scene).s;
    if (!refs(s).has(drag.id)) { s.codex.push(drag.id); commit(`Linked <b>${esc(entry(drag.id).name)}</b>`); }
    return;
  }
  snapshot();
  if (drag.type === 'scene') {
    const loc = locate('scene', drag.id), to = locate('chapter', t.ch).c;
    let i = t.index; if (to === loc.c && loc.si < i) i--;
    loc.c.scenes.splice(loc.si, 1); to.scenes.splice(i, 0, loc.s);
    if (to === loc.c && i === loc.si) return;
    commit(`Moved to Chapter ${chapterNo(to.id)}, Scene ${i + 1}`, true);
  }
  if (drag.type === 'chapter') {
    const loc = locate('chapter', drag.id), to = locate('act', t.act).a, before = chapterNo(loc.c.id);
    let i = t.index; if (to === loc.a && loc.ci < i) i--;
    loc.a.chapters.splice(loc.ci, 1); to.chapters.splice(i, 0, loc.c);
    const after = chapterNo(loc.c.id);
    if (before === after && to === loc.a) return;
    commit(`Chapter ${before} → Chapter ${after} · chapters renumbered · <code>ch:${esc(loc.c.slug)}</code> unchanged`, true);
  }
  if (drag.type === 'act') {
    const loc = locate('act', drag.id); let i = t.index; if (loc.ai < i) i--;
    state.acts.splice(loc.ai, 1); state.acts.splice(i, 0, loc.a);
    if (i !== loc.ai) commit(`Act ${loc.ai + 1} → Act ${i + 1} · chapters renumbered`, true);
  }
});
document.addEventListener('dragend', () => {
  drag?.el?.classList.remove('dragging'); drag?.el && (drag.el.draggable = false);
  document.querySelectorAll('.drop-target').forEach(x => x.classList.remove('drop-target'));
  line.style.display = 'none'; drag = null;
});

// ---------- Misc wiring ----------
$('#q').addEventListener('input', e => { state.q = e.target.value.trim(); renderBoard(); });
$('#sideToggle').addEventListener('click', () => { state.side = !state.side; renderChrome(); });
if (matchMedia('(max-width: 720px)').matches) state.side = false;
// Book header from the catalogue; back goes to the book's series (G3); tabs keep ?book= (G4)
(function bookbar() {
  const series = SERIES_NAMES[BOOK.series], back = $('#back'), where = series ? `Back to ${series}` : 'Back to Library';
  back.href = series ? `library.html#series=${BOOK.series}` : 'library.html';
  back.title = where; back.setAttribute('aria-label', where);
  $('#cover').style.background = `linear-gradient(160deg, ${BOOK.cover[0]}, ${BOOK.cover[1]})`;
  $('#bookTitle').textContent = BOOK.title;
  $('#bookTitle').title = series ? `${series} · Book ${String(BOOK.n || '').padStart(3, '0')}` : BOOK.title;
  document.querySelectorAll('[data-tab]').forEach(a => a.href = `${a.dataset.tab}.html${BOOK_Q}`);
  document.title = `Codex · Plan · ${BOOK.title} (reference)`;
  // The book opens on the screen it was last left on (G2). A new book has no id yet.
  if (BOOK_ID !== 'new') try { localStorage.setItem('codex.last.' + BOOK_ID, 'plan'); } catch {}
})();
addEventListener('hashchange', () => applyHash());
applyHash(true);
</script>
